      name: Get system data
      type: SCRIPT
      key: fadc.system.get_data
      history: '0'
      value_type: TEXT
      trends: '0'
      params: |
        var params = JSON.parse(value),
            result = {"data": {}, "error": ""},
            error_msg = "",
            api_url = "",
            auth_token = null,
            auth_cookie = '',
            auth_mode = null;

        function isMacroPlaceholder(v) {
            return /^\{\$[^}]+\}$/.test(String(v || '').trim());
        }

        function hasValue(v) {
            return typeof v !== 'undefined' && String(v).trim() !== '' && !isMacroPlaceholder(v);
        }

        function validateCommon() {
            var scheme = String(params.scheme || '').trim().toLowerCase(),
                port = String(params.port || '').trim();

            if (scheme !== 'http' && scheme !== 'https') {
                throw 'Invalid scheme parameter. Expected http or https.';
            }
            if (!hasValue(params.fqdn)) {
                throw 'API FQDN/IP is not configured.';
            }
            if (!hasValue(params.port) || !/^\d+$/.test(port) || Number(port) < 1 || Number(port) > 65535) {
                throw 'API port is not configured correctly.';
            }
        }

        function applyCommonHeaders(req) {
            req.addHeader('Accept: application/json');
            req.addHeader('Content-Type: application/json');
            if (hasValue(params.http_proxy)) {
                req.setProxy(String(params.http_proxy).trim());
            }
        }

        function getStaticToken() {
            return hasValue(params.token) ? String(params.token) : '';
        }

        function normalizeCookieHeader(setCookieHeader) {
            var cookies = [];

            if (typeof setCookieHeader === 'undefined' || setCookieHeader === null) {
                return '';
            }

            if (!Array.isArray(setCookieHeader)) {
                setCookieHeader = [setCookieHeader];
            }

            setCookieHeader.forEach(function (entry) {
                var cookie = String(entry || '').split(';')[0].trim();
                if (cookie !== '') {
                    cookies.push(cookie);
                }
            });

            return cookies.join('; ');
        }

        function loginToken() {
            var login = new HttpRequest(),
                response = '',
                payload = {},
                headers = {},
                token = '',
                cookie = '';
            applyCommonHeaders(login);

            if (!hasValue(params.user) || !hasValue(params.password)) {
                throw 'Configure an API token or both username and password.';
            }

            payload = {
                username: params.user,
                password: params.password
            };

            response = login.post(api_url + '/api/user/login', JSON.stringify(payload));
            Zabbix.log(4, '[ FortiADC ] [ ' + api_url + '/api/user/login ] Received response with status code ' + login.getStatus() + ': ' + response);

            if (login.getStatus() !== 200) {
                throw 'Login failed with status code ' + login.getStatus() + '.';
            }

            headers = login.getHeaders(true);

            try {
                response = JSON.parse(response);
            }
            catch (error) {
                throw 'Failed to parse login response.';
            }

            if (typeof response.token !== 'undefined' && response.token !== '') {
                token = response.token;
            }
            else if (typeof response.payload === 'object' && response.payload !== null && typeof response.payload.token !== 'undefined' &&  response.payload.token !== '') {
                token = response.payload.token;
            }

            if (token === '') {
                throw 'Login succeeded but token was not returned.';
            }

            if (typeof headers['Set-Cookie'] !== 'undefined') {
                cookie = normalizeCookieHeader(headers['Set-Cookie']);
            }
            else if (typeof headers['set-cookie'] !== 'undefined') {
                cookie = normalizeCookieHeader(headers['set-cookie']);
            }

            return {
                token: token,
                cookie: cookie
            };
        }

        function initAuth() {
            var token = '',
                auth = {};

            if (auth_mode !== null) {
                return;
            }

            token = getStaticToken();
            if (token !== '') {
                auth_mode = 'api';
                auth_token = token;
                auth_cookie = '';
                return;
            }

            auth_mode = 'login';
            auth = loginToken();
            auth_token = auth.token;
            auth_cookie = auth.cookie;
        }

        function apiRequest(method, path, body) {
            var request = new HttpRequest(),
                 response = '',
                url = api_url + path;

            applyCommonHeaders(request);
            initAuth();

            if (auth_mode === 'api') {
                request.addHeader('APITOKEN: ' + auth_token);
            }
            else {
                request.addHeader('Authorization: Bearer ' + auth_token);
                if (auth_cookie !== '') {
                    request.addHeader('Cookie: ' + auth_cookie);
                }
            }

            if (method === 'GET') {
                response = request.get(url);
            }
            else if (method === 'POST') {
                response = request.post(url, body);
            }
            else {
                throw 'Unsupported method: ' + method + '.';
            }

            Zabbix.log(4, '[ FortiADC ] [ ' + url + ' ] Received response with status code ' + request.getStatus() + ': ' + response);

            if (request.getStatus() !== 200) {
                throw method + ' ' + path + ' failed with status code ' + request.getStatus() + '.';
            }

            if (response === null || response === '') {
                throw 'Empty response received  from ' + path + '.';
            }

            try {
                response = JSON.parse(response);
            }
            catch (error) {
                throw 'Failed to parse response received from ' + path + '.';
            }

            if (typeof response !== 'object' || response === null || typeof response.payload === 'undefined') {
                throw 'Cannot process response received from ' + path + '.';
            }

            return response.payload;
        }

        function apiGet(path) {
            return apiRequest('GET', path, '');
        }

        validateCommon();
        api_url = params.scheme + '://' + params.fqdn + ':' + params.port;

        try {
            var critical_errors = [],
                services = {},
                service_keys = [];

            function criticalGet(target, path) {
                try {
                    result.data[target] = apiGet(path);
                }
                catch (error) {
                    result.data[target] = {};
                    critical_errors.push(target + ': ' + error.toString());
                }
            }

            function optionalGet(target, path) {
                try {
                     result.data[target] = apiGet(path);
                }
                catch (error) {
                    result.data[target] = {};
                }
            }

            criticalGet('info', '/api/platform/info');
            criticalGet('resources', '/api/platform/resources_usage');
            criticalGet('disk', '/api/platform/disk_status?vdom=' + encodeURIComponent(params.vdom));
            criticalGet('license', '/api/platform/license_info');
            criticalGet('ha', '/api/system_ha/brief_status?vdom=' + encodeURIComponent(params.vdom));
            optionalGet('ha_status', '/api/system_ha/status');
            optionalGet('services', '/api/system_fortiguard/get_services_info');

            result.data.services_lld = [];

            services = result.data.services;
            if (typeof services === 'object' && services !== null) {
                service_keys = Object.keys(services);
                service_keys.forEach(function (key) {
                    var svc = services[key];
                    if (typeof svc === 'object' && svc !== null && typeof svc.version !== 'undefined')  {
                        result.data.services_lld.push({
                            key: key,
                            version: String(typeof svc.version !== 'undefined' ? svc.version : ''),
                            expire: String(typeof svc.expire !== 'undefined' ? svc.expire : ''),
                            update_time: String(typeof svc.update_time !== 'undefined' ? svc.update_time : ''),
                            update_method: String(typeof svc.update_method !== 'undefined' ? svc.update_method : ''),
                            support_level: String(typeof svc.support_level !== 'undefined' ? svc.support_level : '')
                        });
                    }
                });
            }

            result.error = critical_errors.join(' | ');
        }
        catch (error) {
            error_msg = error.toString();
            error_msg += error_msg.endsWith('.') ? '' : '.';
            Zabbix.log(3, '[ FortiADC ] ERROR: ' + error_msg);
            result.error = error_msg;
        }

        return JSON.stringify(result);
