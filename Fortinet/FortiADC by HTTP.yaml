    - uuid: d2dc8fad1b69472bbf083e2f8640e858
      name: Get HA cluster data
      type: SCRIPT
      key: fadc.ha.get_data
      history: '0'
      value_type: TEXT
      trends: '0'
      params: |
        var params = JSON.parse(value),
            result = {
                data: {
                    config: {
                        enabled: 0,
                        mode: 'standalone',
                        mode_num: 0,
                        group_id: 0,
                        group_name: '',
                        local_state: 'unknown',
                        local_serial: '',
                        local_nodeid: 0,
                        local_address: ''
                    },
                    cluster: {
                        members_count: 0,
                        peers_count: 0,
                        primary: '',
                        config_source: '',
                        status: 1,
                        sync_status: 1,
                        failover_ready: 2,
                        failover_reason: 'HA disabled or standalone'
                    },
                    members: [],
                    members_lld: []
                },
                error: ''
            },
            error_msg = '',
            api_url = '',
            auth_token = null,
            auth_cookie = '',
            auth_mode = null,
            errors = [],
            member_map = {},
            expected_members = 0;

        function isMacroPlaceholder(v) {
            return /^\{\$[^}]+\}$/.test(String(v || '').trim());
        }

        function hasValue(v) {
            return typeof v !== 'undefined' && String(v).trim() !== '' && !isMacroPlaceholder(v);
        }

        function validateCommon() {
            var scheme = String(params.scheme || '').trim().toLowerCase(),
                port = String(params.port || '').trim();

            if (scheme !== 'http' && scheme !== 'https') {
                throw 'Invalid scheme parameter. Expected http or https.';
            }
            if (!hasValue(params.fqdn)) {
                throw 'API FQDN/IP is not configured.';
            }
            if (!hasValue(params.port) || !/^\d+$/.test(port) || Number(port) < 1 || Number(port) > 65535) {
                throw 'API port is not configured correctly.';
            }
        }

        function applyCommonHeaders(req) {
            req.addHeader('Accept: application/json');
            req.addHeader('Content-Type: application/json');
            if (hasValue(params.http_proxy)) {
                req.setProxy(String(params.http_proxy).trim());
            }
        }

        function getStaticToken() {
            return hasValue(params.token) ? String(params.token) : '';
        }

        function normalizeCookieHeader(setCookieHeader) {
            var cookies = [];

            if (typeof setCookieHeader === 'undefined' || setCookieHeader === null) {
                return '';
            }

            if (!Array.isArray(setCookieHeader)) {
                setCookieHeader = [setCookieHeader];
            }

            setCookieHeader.forEach(function (entry) {
                var cookie = String(entry || '').split(';')[0].trim();
                if (cookie !== '') {
                    cookies.push(cookie);
                }
            });

            return cookies.join('; ');
        }

        function loginToken() {
            var login = new HttpRequest(),
                response = '',
                payload = {},
                headers = {},
                token = '',
                cookie = '';
            applyCommonHeaders(login);

            if (!hasValue(params.user) || !hasValue(params.password)) {
                throw 'Configure an API token or both username and password.';
            }

            payload = {
                username: params.user,
                password: params.password
            };

            response = login.post(api_url + '/api/user/login', JSON.stringify(payload));
            Zabbix.log(4, '[ FortiADC HA ] [ ' + api_url + '/api/user/login ] Received response with status code ' + login.getStatus() + ': ' + response);

            if (login.getStatus() !== 200) {
                throw 'Login failed with status code ' + login.getStatus() + '.';
            }

            headers = login.getHeaders(true);

            try {
                response = JSON.parse(response);
            }
            catch (error) {
                throw 'Failed to parse login response.';
            }

            if (typeof response.token !== 'undefined' && response.token !== '') {
                token = response.token;
            }
            else if (typeof response.payload === 'object' && response.payload !== null && typeof response.payload.token !== 'undefined' && response.payload.token !== '') {
                token = response.payload.token;
            }
            else if (typeof response.payload === 'object' && response.payload !== null && typeof response.payload.sid !== 'undefined' && response.payload.sid !== '') {
                token = response.payload.sid;
            }

            if (token === '') {
                throw 'Login succeeded but token was not returned.';
            }

            if (typeof headers['Set-Cookie'] !== 'undefined') {
                cookie = normalizeCookieHeader(headers['Set-Cookie']);
            }
            else if (typeof headers['set-cookie'] !== 'undefined') {
                cookie = normalizeCookieHeader(headers['set-cookie']);
            }

            return {
                token: token,
                cookie: cookie
            };
        }

        function initAuth() {
            var token = '',
                auth = {};

            if (auth_mode !== null) {
                return;
            }

            token = getStaticToken();
            if (token !== '') {
                auth_mode = 'api';
                auth_token = token;
                auth_cookie = '';
                return;
            }

            auth_mode = 'login';
            auth = loginToken();
            auth_token = auth.token;
            auth_cookie = auth.cookie;
        }

        function apiRequest(method, path, body) {
            var request = new HttpRequest(),
                response = '',
                url = api_url + path;

            applyCommonHeaders(request);
            initAuth();

            if (auth_mode === 'api') {
                request.addHeader('APITOKEN: ' + auth_token);
            }
            else {
                request.addHeader('Authorization: Bearer ' + auth_token);
                if (auth_cookie !== '') {
                    request.addHeader('Cookie: ' + auth_cookie);
                }
            }

            if (method === 'GET') {
                response = request.get(url);
            }
            else if (method === 'POST') {
                response = request.post(url, body);
            }
            else {
                throw 'Unsupported method: ' + method + '.';
            }

            Zabbix.log(4, '[ FortiADC HA ] [ ' + url + ' ] Received response with status code ' + request.getStatus() + ': ' + response);

            if (request.getStatus() !== 200) {
                throw method + ' ' + path + ' failed with status code ' + request.getStatus() + '.';
            }

            if (response === null || response === '') {
                throw 'Empty response received from ' + path + '.';
            }

            try {
                response = JSON.parse(response);
            }
            catch (error) {
                throw 'Failed to parse response received from ' + path + '.';
            }

            if (typeof response !== 'object' || response === null || typeof response.payload === 'undefined') {
                throw 'Cannot process response received from ' + path + '.';
            }

            return response.payload;
        }

        function apiGet(path) {
            return apiRequest('GET', path, '');
        }

        function getFirst(paths, required, label, record_error) {
            var last_error = '';
            for (var i = 0; i < paths.length; i++) {
                try {
                    return apiGet(paths[i]);
                }
                catch (error) {
                    last_error = error.toString();
                    Zabbix.log(3, '[ FortiADC HA ] ' + label + ' endpoint failed: ' + last_error);
                }
            }
            if (required) {
                throw label + ': ' + last_error;
            }
            if (last_error !== '' && record_error) {
                errors.push(label + ': ' + last_error);
            }
            return null;
        }

        function hasOwn(obj, key) {
            return Object.prototype.hasOwnProperty.call(obj, key);
        }

        function getValue(obj, keys, def) {
            if (typeof obj !== 'object' || obj === null) {
                return def;
            }
            for (var i = 0; i < keys.length; i++) {
                var k = keys[i];
                if (hasOwn(obj, k) && obj[k] !== null && typeof obj[k] !== 'undefined' && obj[k] !== '') {
                    return obj[k];
                }
            }
            return def;
        }

        function toStringValue(v, def) {
            if (v === null || typeof v === 'undefined') {
                return def;
            }
            return String(v);
        }

        function toNumber(v, def) {
            if (v === null || typeof v === 'undefined' || v === '') {
                return def;
            }
            if (typeof v === 'boolean') {
                return v ? 1 : 0;
            }
            if (typeof v === 'number') {
                return v;
            }
            var s = String(v).replace(/%/g, '').replace(/,/g, '').trim();
            var n = parseFloat(s);
            return isNaN(n) ? def : n;
        }

        function toInteger(v, def) {
            var n = toNumber(v, def);
            return (n === def) ? def : Math.round(n);
        }

        function modeToNum(mode) {
            var m = String(mode || '').toLowerCase();
            if (m === '' || m === 'standalone' || m === 'none' || m === 'disable' || m === 'disabled') {
                return 0;
            }
            if (m.indexOf('active-passive') !== -1 || m === 'a-p' || m === 'ap') {
                return 1;
            }
            if (m.indexOf('active-active-vrrp') !== -1 || m.indexOf('vrrp') !== -1) {
                return 3;
            }
            if (m.indexOf('active-active') !== -1 || m === 'a-a' || m === 'aa') {
                return 2;
            }
            return 10;
        }

        function cleanKey(s, fallback) {
            s = String(s || fallback || 'unknown').replace(/^\s+|\s+$/g, '');
            if (s === '') {
                s = String(fallback || 'unknown');
            }
            s = s.replace(/[^A-Za-z0-9_.-]/g, '_');
            if (s.length > 180) {
                s = s.substring(0, 180);
            }
            return s;
        }

        function normalizeRole(v) {
            if (typeof v === 'boolean') {
                return v ? 1 : 2;
            }
            if (typeof v === 'number') {
                if (v === 1) { return 1; }
                if (v === 2) { return 2; }
                if (v === 0) { return 0; }
            }
            var s = String(v || '').toLowerCase();
            if (s === '') { return 0; }
            if (s === '1' || s.indexOf('primary') !== -1 || s.indexOf('master') !== -1 || s.indexOf('active') !== -1) {
                if (s.indexOf('passive') === -1 && s.indexOf('secondary') === -1) {
                    return 1;
                }
            }
            if (s === '2' || s.indexOf('secondary') !== -1 || s.indexOf('slave') !== -1 || s.indexOf('backup') !== -1 || s.indexOf('passive') !== -1) {
                return 2;
            }
            if (s.indexOf('standalone') !== -1) {
                return 3;
            }
            return 0;
        }

        function roleToText(n) {
            if (n === 1) { return 'primary'; }
            if (n === 2) { return 'secondary'; }
            if (n === 3) { return 'standalone'; }
            return 'unknown';
        }

        function normalizeState(v, def) {
            if (typeof v === 'boolean') {
                return v ? 1 : 0;
            }
            if (typeof v === 'number') {
                if (v === 1) { return 1; }
                if (v === 0) { return 0; }
                return 2;
            }
            var s = String(v || '').toLowerCase();
            if (s === '') { return def; }
            if (s === '1' || s.indexOf('up') !== -1 || s.indexOf('online') !== -1 || s.indexOf('alive') !== -1 || s.indexOf('running') !== -1 || s.indexOf('ok') !== -1 || s.indexOf('healthy') !== -1 || s.indexOf('primary') !== -1 || s.indexOf('secondary') !== -1 || s.indexOf('standalone') !== -1) {
                return 1;
            }
            if (s === '0' || s.indexOf('down') !== -1 || s.indexOf('offline') !== -1 || s.indexOf('dead') !== -1 || s.indexOf('lost') !== -1 || s.indexOf('failed') !== -1 || s.indexOf('error') !== -1) {
                return 0;
            }
            return 2;
        }

        function stateToText(n) {
            if (n === 0) { return 'down'; }
            if (n === 1) { return 'up'; }
            return 'unknown';
        }

        function normalizeSync(v, def) {
            if (typeof v === 'boolean') {
                return v ? 1 : 0;
            }
            if (typeof v === 'number') {
                if (v === 1) { return 1; }
                if (v === 0) { return 0; }
                return 2;
            }
            var s = String(v || '').toLowerCase();
            if (s === '') { return def; }
            if (s === 'n/a' || s === 'na' || s === 'standalone') { return def; }
            if (s === '1' || s.indexOf('in sync') !== -1 || s.indexOf('in-sync') !== -1 || s.indexOf('synchronized') !== -1 || s.indexOf('synced') !== -1 || s === 'sync' || s === 'ok') {
                return 1;
            }
            if (s === '0' || s.indexOf('out of sync') !== -1 || s.indexOf('out-of-sync') !== -1 || s.indexOf('not sync') !== -1 || s.indexOf('not synchronized') !== -1 || s.indexOf('mismatch') !== -1 || s.indexOf('unsync') !== -1) {
                return 0;
            }
            return 2;
        }

        function syncToText(n) {
            if (n === 0) { return 'out-of-sync'; }
            if (n === 1) { return 'in-sync'; }
            return 'unknown';
        }

        function normalizeConfigSource(v, self) {
            var s = String(v || '').toLowerCase();
            if (typeof v === 'boolean') { return v ? 1 : 0; }
            if (typeof v === 'number') {
                if (v === 1) { return 1; }
                if (v === 0) { return 0; }
            }
            if (s === '') { return 2; }
            if (s === '1' || s === 'yes' || s === 'true' || s === 'source' || s === 'primary' || s === 'local' || s.indexOf('config source') !== -1) {
                return 1;
            }
            if (s === '0' || s === 'no' || s === 'false' || s === 'n/a' || s === 'na') {
                return 0;
            }
            if (self && (String(v) === self.serial || String(v) === self.hostname || String(v) === String(self.node_id))) {
                return 1;
            }
            return 2;
        }

        function configSourceToText(n) {
            if (n === 1) { return 'source'; }
            if (n === 0) { return 'no'; }
            return 'unknown';
        }

        function makeMember(raw, source, localDefaults) {
            var member = {},
                serial = toStringValue(getValue(raw, ['serial', 'sn', 'local_sn', 'serial_number', 'serial-number', 'device_id', 'device-id'], ''), ''),
                hostname = toStringValue(getValue(raw, ['hostname', 'hostName', 'host-name', 'name', 'host', 'mkey'], ''), ''),
                node_id = toInteger(getValue(raw, ['nodeid', 'node_id', 'node-id', 'local_nodeid', 'id', 'node'], 0), 0),
                address = toStringValue(getValue(raw, ['address', 'ip', 'ip_address', 'ip-address', 'local_address', 'ha_ip', 'ha-ip'], ''), ''),
                state_raw = getValue(raw, ['state', 'status', 'local_state', 'ha_state', 'ha-state'], ''),
                role_raw = getValue(raw, ['role', 'ha_role', 'ha-role', 'state', 'local_state'], ''),
                sync_raw = getValue(raw, ['sync', 'sync_state', 'sync-state', 'cfg_sync_state', 'cfg-sync-state', 'config_sync_state', 'config-sync-state'], ''),
                cfg_src_raw = getValue(raw, ['cfg_src', 'cfg-src', 'config_source', 'config-source', 'is_cfg_src', 'is-cfg-src'], ''),
                key = '';

            if (localDefaults) {
                if (serial === '') { serial = localDefaults.serial || ''; }
                if (hostname === '') { hostname = localDefaults.hostname || ''; }
                if (node_id === 0) { node_id = localDefaults.node_id || 0; }
                if (address === '') { address = localDefaults.address || ''; }
                if (state_raw === '') { state_raw = localDefaults.state || ''; }
                if (role_raw === '') { role_raw = localDefaults.role || ''; }
                if (sync_raw === '') { sync_raw = localDefaults.sync || ''; }
                if (cfg_src_raw === '') { cfg_src_raw = localDefaults.cfg_src || ''; }
            }

            if (hostname === '' && serial !== '') { hostname = serial; }
            if (hostname === '') { hostname = 'node-' + String(node_id); }

            key = cleanKey(serial !== '' ? serial : hostname, hostname);

            member = {
                key: key,
                hostname: hostname,
                serial: serial,
                node_id: node_id,
                address: address,
                role: normalizeRole(role_raw),
                role_text: '',
                state: normalizeState(state_raw, source === 'local' ? 1 : 2),
                state_text: '',
                sync: normalizeSync(sync_raw, 2),
                sync_text: '',
                cfg_source: 2,
                cfg_source_text: '',
                cfg_source_raw: toStringValue(cfg_src_raw, ''),
                uptime: toInteger(getValue(raw, ['uptime', 'up_time', 'up-time'], 0), 0),
                cpu: toNumber(getValue(raw, ['cpu', 'cpu_usage', 'cpu-usage', 'cpu_util', 'cpu-util'], 0), 0),
                memory: toNumber(getValue(raw, ['memory', 'mem', 'memory_usage', 'memory-usage', 'mem_usage', 'mem-usage'], 0), 0),
                source: source
            };

            member.role_text = roleToText(member.role);
            member.state_text = stateToText(member.state);
            member.sync_text = syncToText(member.sync);
            member.cfg_source = normalizeConfigSource(cfg_src_raw, member);
            member.cfg_source_text = configSourceToText(member.cfg_source);

            return member;
        }

        function mergeMember(member) {
            var key = member.key,
                existing = null;

            if (!hasOwn(member_map, key)) {
                member_map[key] = member;
                return;
            }

            existing = member_map[key];
            Object.keys(member).forEach(function (k) {
                if (member[k] !== '' && member[k] !== 0 && member[k] !== 2) {
                    existing[k] = member[k];
                }
                else if ((typeof existing[k] === 'undefined' || existing[k] === '' || existing[k] === 0 || existing[k] === 2) && typeof member[k] !== 'undefined') {
                    existing[k] = member[k];
                }
            });
            existing.role_text = roleToText(existing.role);
            existing.state_text = stateToText(existing.state);
            existing.sync_text = syncToText(existing.sync);
            existing.cfg_source_text = configSourceToText(existing.cfg_source);
        }

        function addPeerMembers(peers) {
            if (!Array.isArray(peers)) {
                return;
            }
            peers.forEach(function (peer) {
                if (typeof peer === 'object' && peer !== null) {
                    mergeMember(makeMember(peer, 'peer', null));
                }
            });
        }

        function discoverMemberObjects(obj, path) {
            if (obj === null || typeof obj === 'undefined') {
                return;
            }
            if (Array.isArray(obj)) {
                obj.forEach(function (entry, idx) {
                    discoverMemberObjects(entry, path + '[' + idx + ']');
                });
                return;
            }
            if (typeof obj !== 'object') {
                return;
            }

            var has_member_hint = false;
            ['serial', 'sn', 'local_sn', 'serial_number', 'serial-number', 'nodeid', 'node_id', 'node-id', 'local_nodeid', 'state', 'local_state', 'address', 'local_address', 'ip'].forEach(function (k) {
                if (hasOwn(obj, k)) {
                    has_member_hint = true;
                }
            });

            if (has_member_hint && path.indexOf('peers') !== -1) {
                mergeMember(makeMember(obj, 'peer', null));
                return;
            }

            Object.keys(obj).forEach(function (k) {
                if (k === 'peers' && Array.isArray(obj[k])) {
                    addPeerMembers(obj[k]);
                }
                else if (typeof obj[k] === 'object' && obj[k] !== null) {
                    discoverMemberObjects(obj[k], path + '.' + k);
                }
            });
        }

        validateCommon();
        api_url = params.scheme + '://' + params.fqdn + ':' + params.port;
        expected_members = toInteger(params.expected_members, 0);

        try {
            var vdom = encodeURIComponent(String(params.vdom || 'root')),
                brief = {},
                status = {},
                config = {},
                info = {},
                mode = '',
                local_hostname = '',
                local_member = null,
                members = [],
                any_down = 0,
                any_out_of_sync = 0,
                known_sync = 0,
                primary = '',
                config_source = '',
                config_source_label = '',
                cluster_sync = 2,
                localDefaults = {};

            brief = getFirst([
                '/api/system_ha/brief_status?vdom=' + vdom,
                '/api/system_ha/brief_status'
            ], false, 'HA brief status', true) || {};

            status = getFirst([
                '/api/system_ha/status',
                '/api/system_ha/status?vdom=' + vdom
            ], false, 'HA status', true) || {};

            config = getFirst([
                '/api/system_ha?vdom=' + vdom,
                '/api/system_ha'
            ], false, 'HA configuration', false) || {};

            info = getFirst([
                '/api/platform/info'
            ], false, 'Platform info', false) || {};

            mode = toStringValue(getValue(brief, ['mode'], getValue(status, ['mode'], getValue(config, ['mode', 'cluster-mode', 'cluster_mode'], 'standalone'))), 'standalone');
            result.data.config.mode = mode;
            result.data.config.mode_num = modeToNum(mode);
            result.data.config.enabled = result.data.config.mode_num === 0 ? 0 : 1;
            result.data.config.group_id = toInteger(getValue(config, ['group_id', 'group-id', 'groupid'], 0), 0);
            result.data.config.group_name = toStringValue(getValue(config, ['group_name', 'group-name', 'group'], ''), '');
            result.data.config.local_state = toStringValue(getValue(brief, ['local_state'], getValue(status, ['local_state'], 'unknown')), 'unknown');
            result.data.config.local_serial = toStringValue(getValue(brief, ['local_sn'], getValue(status, ['local_sn'], '')), '');
            result.data.config.local_nodeid = toInteger(getValue(brief, ['local_nodeid'], getValue(status, ['local_nodeid'], 0)), 0);
            result.data.config.local_address = toStringValue(getValue(status, ['local_address'], getValue(brief, ['local_address'], '')), '');

            local_hostname = toStringValue(getValue(info, ['hostName', 'hostname', 'host-name', 'name'], ''), '');
            if (local_hostname === '' && result.data.config.local_serial !== '') {
                local_hostname = result.data.config.local_serial;
            }

            localDefaults = {
                hostname: local_hostname,
                serial: result.data.config.local_serial,
                node_id: result.data.config.local_nodeid,
                address: result.data.config.local_address,
                state: result.data.config.local_state,
                role: result.data.config.local_state,
                sync: getValue(brief, ['cfg_sync_state'], ''),
                cfg_src: getValue(brief, ['cfg_src'], '')
            };

            local_member = makeMember({}, 'local', localDefaults);
            if (result.data.config.enabled === 0) {
                local_member.role = 3;
                local_member.role_text = roleToText(local_member.role);
                local_member.sync = 2;
                local_member.sync_text = syncToText(local_member.sync);
            }
            mergeMember(local_member);

            addPeerMembers(getValue(status, ['peers'], []));
            discoverMemberObjects(status, 'status');

            config_source = toStringValue(getValue(brief, ['cfg_src'], ''), '');
            cluster_sync = normalizeSync(getValue(brief, ['cfg_sync_state'], ''), 2);

            members = [];
            Object.keys(member_map).forEach(function (key) {
                var m = member_map[key];
                if (m.hostname === '' && m.serial !== '') { m.hostname = m.serial; }
                if (m.hostname === '') { m.hostname = m.key; }
                if (m.role === 0 && m.state === 1 && result.data.config.enabled === 1) {
                    m.role = 2;
                    m.role_text = roleToText(m.role);
                }
                if (result.data.config.enabled === 1 && cluster_sync !== 2 && m.sync === 2) {
                    m.sync = cluster_sync;
                    m.sync_text = syncToText(m.sync);
                }
                if (config_source !== '' && config_source.toLowerCase() !== 'n/a' && config_source.toLowerCase() !== 'na') {
                    if (String(config_source) === String(m.serial) || String(config_source) === String(m.hostname) || String(config_source) === String(m.node_id)) {
                        m.cfg_source = 1;
                        m.cfg_source_text = configSourceToText(m.cfg_source);
                        config_source_label = m.hostname || m.serial || config_source;
                    }
                    else if (m.cfg_source === 2) {
                        m.cfg_source = 0;
                        m.cfg_source_text = configSourceToText(m.cfg_source);
                    }
                }
                if (m.role === 1 && primary === '') {
                    primary = m.hostname || m.serial;
                }
                members.push(m);
            });

            members.sort(function (a, b) {
                if (a.role !== b.role) {
                    if (a.role === 1) { return -1; }
                    if (b.role === 1) { return 1; }
                }
                return String(a.hostname).localeCompare(String(b.hostname));
            });

            members.forEach(function (m) {
                if (m.state === 0) {
                    any_down = 1;
                }
                if (m.sync === 0) {
                    any_out_of_sync = 1;
                }
                if (m.sync !== 2) {
                    known_sync++;
                }
            });

            result.data.members = members;
            result.data.members_lld = members.map(function (m) {
                return {
                    key: m.key,
                    hostname: m.hostname,
                    serial: m.serial,
                    node_id: String(m.node_id),
                    address: m.address,
                    role: m.role_text,
                    state: m.state_text,
                    sync: m.sync_text,
                    cfg_source: m.cfg_source_text
                };
            });

            result.data.cluster.members_count = members.length;
            result.data.cluster.peers_count = Math.max(0, members.length - 1);
            result.data.cluster.primary = primary;
            result.data.cluster.config_source = config_source_label !== '' ? config_source_label : config_source;
            result.data.cluster.state = any_down ? 0 : 1;

            if (result.data.config.enabled === 0) {
                result.data.cluster.sync_status = 1;
                result.data.cluster.failover_ready = 2;
                result.data.cluster.failover_reason = 'HA disabled or standalone';
            }
            else {
                var failover_reasons = [];
                result.data.cluster.sync_status = any_out_of_sync ? 0 : (known_sync > 0 ? 1 : 2);

                if (expected_members > 0 && members.length !== expected_members) {
                    failover_reasons.push('member count ' + members.length + ' does not match expected ' + expected_members);
                }
                if (members.length === 0) {
                    failover_reasons.push('no HA members discovered');
                }
                if (any_down) {
                    failover_reasons.push('one or more HA members are down');
                }
                if (any_out_of_sync) {
                    failover_reasons.push('one or more HA members are out of sync');
                }
                if (known_sync === 0) {
                    failover_reasons.push('HA sync state is unknown');
                }

                result.data.cluster.failover_ready = failover_reasons.length === 0 ? 1 : 0;
                result.data.cluster.failover_reason = failover_reasons.length === 0 ? 'HA members are up and in sync' : failover_reasons.join('; ');
            }

            result.data.cluster.status = result.data.config.enabled === 0 ? 1 : (result.data.cluster.failover_ready === 1 ? 1 : 0);
        }
        catch (error) {
            error_msg = error.toString();
            error_msg += error_msg.endsWith('.') ? '' : '.';
            Zabbix.log(3, '[ FortiADC HA ] ERROR: ' + error_msg);
        }

        if (errors.length > 0) {
            error_msg += (error_msg === '' ? '' : ' ') + errors.join(' | ');
        }

        result.error = error_msg;

        return JSON.stringify(result);
      description: Collects FortiADC HA status, peer/member information, synchronization status, and failover readiness from the FortiADC REST API.
      timeout: '{$FADC.DATA.TIMEOUT}'
      parameters:
      - name: expected_members
        value: '{$FADC.HA.EXPECTED.MEMBERS}'
      - name: fqdn
        value: '{$FADC.API.FQDN}'
      - name: http_proxy
        value: '{$FADC.HTTP.PROXY}'
      - name: password
        value: '{$FADC.API.PASS}'
      - name: port
        value: '{$FADC.API.PORT}'
      - name: scheme
        value: '{$FADC.SCHEME}'
      - name: token
        value: '{$FADC.API.TOKEN}'
      - name: user
        value: '{$FADC.API.USER}'
      - name: vdom
        value: '{$FADC.VDOM}'
      tags:
      - tag: component
        value: ha
      - tag: component
        value: raw
