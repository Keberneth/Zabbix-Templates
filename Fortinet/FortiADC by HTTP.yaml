        name: CPU utilization is high
        event_name: High CPU utilization (over {$CPU.UTIL.WARN}% for 5m)
        opdata: 'Current utilization: {ITEM.LASTVALUE1}'
        priority: WARNING
        description: The CPU utilization is high.
        dependencies:
        - name: CPU utilization is too high
          expression: min(/FortiADC by HTTP/fadc.cpu.util,5m)>{$CPU.UTIL.CRIT}
        tags:
