zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 63339cc946574762af4ff019c1cad5eb
      name: Templates/Fortinet
    - uuid: c2e076bb4255499886a5b6b4ca5262a5
      name: 'Templates/Network devices'
  templates:
    - uuid: 34775222c3c742469b8ac72a45cffcc1
      template: 'FortiADC by HTTP'
      name: 'FortiADC by HTTP'
      description: |
        Template for monitoring FortiADC by REST API.
        
        Preferred authentication method:
        1. Create a REST API administrator user in the FortiADC GUI.
        2. Save the generated API key.
        3. Put the API key into {$FADC.API.TOKEN}.
        4. Set {$FADC.API.FQDN}, {$FADC.API.PORT}, {$FADC.SCHEME}, and {$FADC.VDOM}.
        
        Fallback authentication method (legacy/session-based; standard admin account only):
        1. Leave {$FADC.API.TOKEN} empty.
        2. Set {$FADC.API.USER} and {$FADC.API.PASS} for a standard administrator account.
        3. The template will log in to /api/user/login and reuse the returned bearer token plus session cookie.
        4. REST API administrator accounts should use {$FADC.API.TOKEN} instead of username/password.
        
        Monitored areas:
        - API availability and TCP reachability
        - System info, uptime, firmware, serial number
        - CPU, memory, disk utilization
        - License and FortiGuard service metadata
        - HA state
        - Physical interface state
        - Virtual server health and traffic counters
        - Pool member health
        
        Notes:
        - This template is API-based and does not use SNMP.
        - FortiADC API behavior can vary by firmware. Validate endpoints and permissions in a lab before broad rollout.
      vendor:
        name: Keberneth
        version: '7.0.0'
      groups:
        - name: Templates/Fortinet
        - name: 'Templates/Network devices'
      items:
        - uuid: f43f1a336272490dbee76c8b95037fdc
          name: 'API availability status'
          type: DEPENDENT
          key: fadc.api.status
          delay: '0'
          description: 'Checks API availability by successful retrieval of platform info.'
          valuemap:
            name: 'Service state'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.data.info.hostName
              error_handler: CUSTOM_VALUE
            - type: JAVASCRIPT
              parameters:
                - 'return String(value || '''').trim() !== '''' ? 1 : 0;'
          master_item:
            key: fadc.system.get_data
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: 387657e0a27b4cddbe9e5b39b21455e1
              expression: 'nodata(/FortiADC by HTTP/fadc.api.status,{$FADC.NODATA.TIME})=1'
              name: 'No fresh API monitoring data has been received for {$FADC.NODATA.TIME}'
              priority: HIGH
              description: 'No new values were produced for the API availability item within {$FADC.NODATA.TIME}. Monitoring may have stopped because of collector, proxy, timeout, or script execution issues.'
              tags:
                - tag: scope
                  value: availability
                - tag: target
                  value: api
            - uuid: 7e24cac3bf6c4a12b9d615a76b878c8c
              expression: 'last(/FortiADC by HTTP/fadc.api.status)=0'
              name: 'Unexpected response from API'
              priority: AVERAGE
              description: 'Received an unexpected response from the FortiADC API. Explicit authentication failures are handled by a separate trigger.'
              dependencies:
                - name: 'Authentication to FortiADC API failed'
                  expression: 'last(/FortiADC by HTTP/fadc.auth.status)=0'
                - name: 'Port {$FADC.API.PORT} is unavailable'
                  expression: 'last(/FortiADC by HTTP/net.tcp.service["{$FADC.SCHEME}","{$FADC.API.FQDN}","{$FADC.API.PORT}"])=0'
              tags:
                - tag: scope
                  value: availability
        - uuid: 6d6733c08d8d4f65be252a896c200905
          name: 'API authentication status'
          type: DEPENDENT
          key: fadc.auth.status
          delay: '0'
          description: 'Indicates whether the template can authenticate to the FortiADC API with the configured APITOKEN or with the legacy session-based fallback for a standard administrator account.'
          valuemap:
            name: 'Authentication state'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.error
              error_handler: CUSTOM_VALUE
            - type: JAVASCRIPT
              parameters:
                - |
                  var err = String(value || '').toLowerCase();
                  
                  if (err === '') {
                      return 1;
                  }
                  
                  if (err.indexOf('set {$fadc.api.token}') !== -1 ||
                      err.indexOf('login failed') !== -1 ||
                      err.indexOf('token was not returned') !== -1 ||
                      err.indexOf('authentication') !== -1 ||
                      err.indexOf('unauthorized') !== -1 ||
                      err.indexOf('forbidden') !== -1 ||
                      err.indexOf('not authorized') !== -1 ||
                      err.indexOf('permission denied') !== -1 ||
                      err.indexOf('invalid token') !== -1 ||
                      err.indexOf('apitoken') !== -1 ||
                      err.indexOf('api token') !== -1 ||
                      err.indexOf('username and password') !== -1 ||
                      err.indexOf('bearer') !== -1 ||
                      err.indexOf('cookie') !== -1 ||
                      /status code (401|403)\b/.test(err)) {
                      return 0;
                  }
                  
                  return 1;
          master_item:
            key: fadc.system.get_data
          tags:
            - tag: component
              value: auth
            - tag: component
              value: health
          triggers:
            - uuid: 2e29a630ea2447d3ab494a2be407116b
              expression: 'last(/FortiADC by HTTP/fadc.auth.status)=0'
              name: 'Authentication to FortiADC API failed'
              priority: HIGH
              description: 'The template could not authenticate to the FortiADC API using the configured APITOKEN or the legacy session-based fallback for a standard administrator account. Check the API credentials, permissions, trusted hosts, and the ''System data item errors'' item for the returned message.'
              dependencies:
                - name: 'Port {$FADC.API.PORT} is unavailable'
                  expression: 'last(/FortiADC by HTTP/net.tcp.service["{$FADC.SCHEME}","{$FADC.API.FQDN}","{$FADC.API.PORT}"])=0'
              tags:
                - tag: scope
                  value: availability
                - tag: target
                  value: api
        - uuid: 52fa6a8f7d0748d9b8ac7645d67a0cc8
          name: 'CPU utilization'
          type: DEPENDENT
          key: fadc.cpu.util
          delay: '0'
          value_type: FLOAT
          units: '%'
          description: 'CPU utilization in percent.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.data.resources.cpu
          master_item:
            key: fadc.system.get_data
          tags:
            - tag: component
              value: cpu
          triggers:
            - uuid: 65ad23bca49647b78e7f251502325414
              expression: 'min(/FortiADC by HTTP/fadc.cpu.util,5m)>{$CPU.UTIL.WARN}'
              name: 'CPU utilization is high'
              event_name: 'High CPU utilization (over {$CPU.UTIL.WARN}% for 5m)'
              opdata: 'Current utilization: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'The CPU utilization is high.'
              dependencies:
                - name: 'CPU utilization is too high'
                  expression: 'min(/FortiADC by HTTP/fadc.cpu.util,5m)>{$CPU.UTIL.CRIT}'
              tags:
                - tag: scope
                  value: performance
            - uuid: ce413335335a4fc5905f2bb017778b62
              expression: 'min(/FortiADC by HTTP/fadc.cpu.util,5m)>{$CPU.UTIL.CRIT}'
              name: 'CPU utilization is too high'
              event_name: 'High CPU utilization (over {$CPU.UTIL.CRIT}% for 5m)'
              opdata: 'Current utilization: {ITEM.LASTVALUE1}'
              priority: HIGH
              description: 'The CPU utilization is too high. The system might be slow to respond.'
              tags:
                - tag: scope
                  value: performance
        - uuid: c71d790fb62044cc882f4f6d28baf21a
