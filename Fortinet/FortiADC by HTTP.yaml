            if (token === '') {
                throw 'Login succeeded but token was not returned.';
            }

            if (typeof headers['Set-Cookie'] !== 'undefined') {
                cookie = normalizeCookieHeader(headers['Set-Cookie']);
            }
            else if (typeof headers['set-cookie'] !== 'undefined') {
                cookie = normalizeCookieHeader(headers['set-cookie']);
            }

            return {
                token: token,
                cookie: cookie
            };
        }

        function initAuth() {
            var token = '',
                auth = {};

            if (auth_mode !== null) {
                return;
            }

            token = getStaticToken();
            if (token !== '') {
                auth_mode = 'api';
                auth_token = token;
                auth_cookie = '';
                return;
            }

            auth_mode = 'login';
            auth = loginToken();
            auth_token = auth.token;
            auth_cookie = auth.cookie;
        }

        function apiRequest(method, path, body) {
            var request = new HttpRequest(),
                 response = '',
                url = api_url + path;

            applyCommonHeaders(request);
            initAuth();

            if (auth_mode === 'api') {
                request.addHeader('APITOKEN: ' + auth_token);
            }
            else {
                request.addHeader('Authorization: Bearer ' + auth_token);
                if (auth_cookie !== '') {
                    request.addHeader('Cookie: ' + auth_cookie);
                }
            }

            if (method === 'GET') {
                response = request.get(url);
            }
            else if (method === 'POST') {
                response = request.post(url, body);
            }
            else {
                throw 'Unsupported method: ' + method + '.';
            }

            Zabbix.log(4, '[ FortiADC ] [ ' + url + ' ] Received response with status code ' + request.getStatus() + ': ' + response);

            if (request.getStatus() !== 200) {
                throw method + ' ' + path + ' failed with status code ' + request.getStatus() + '.';
            }

            if (response === null || response === '') {
                throw 'Empty response received  from ' + path + '.';
            }

            try {
                response = JSON.parse(response);
            }
            catch (error) {
                throw 'Failed to parse response received from ' + path + '.';
            }

            if (typeof response !== 'object' || response === null || typeof response.payload === 'undefined') {
                throw 'Cannot process response received from ' + path + '.';
            }

            return response.payload;
        }

        function apiGet(path) {
            return apiRequest('GET', path, '');
        }

        validateCommon();
        api_url = params.scheme + '://' + params.fqdn + ':' + params.port;

        result.data = [];

        try {
            var view_list = [],
                partial_errors = [],
                seen = {};

            view_list = apiGet('/api/all_vs_info/vs_list?vdom=' + encodeURIComponent(params.vdom));

            if (!Array.isArray(view_list)) {
                throw 'Unexpected payload for virtual server list.';
            }

            view_list.forEach(function (vs) {
                var vsname = '',
                    poolname = '',
                    members  = [];

                if (typeof vs.config !== 'object' || vs.config === null) {
                    return;
                }

                vsname = String(typeof vs.config.mkey !== 'undefined' ? vs.config.mkey : '');
                poolname = String(typeof vs.config.pool !== 'undefined' ? vs.config.pool : '');

                if (vsname === '' || poolname === '') {
                    return;
                }

                try {
                    members = apiGet('/api/all_vs_info/pool_member_list?vdom=' + encodeURIComponent(params.vdom) + '&vsname=' + encodeURIComponent(vsname) + '&crname=&poolname=' + encodeURIComponent(poolname));
                    if (!Array.isArray(members)) {
                        return;
                    }

                    members.forEach(function (member) {
                        var cfg = {},
                            item = {},
                            key = '';

                        cfg = (typeof member.config === 'object' && member.config !== null) ? member.config : {};
                        key = vsname + '|' + poolname + '|' + String(typeof  cfg.id !== 'undefined' ? cfg.id : '');

                        if (key === vsname + '|' + poolname + '|') {
                            return;
                        }
                        if (typeof seen[key] !== 'undefined') {
                            return;
                        }

                        seen[key] = 1;
                        item = {
                            key: key,
                            vsname: vsname,
                            poolname: poolname,
                            member_id: String(typeof cfg.id !== 'undefined' ? cfg.id : ''),
                            availability: String(typeof cfg.availability !== 'undefined' ? cfg.availability : 'UNKNOWN').trim().toUpperCase(),
                            port: String(typeof cfg.port !== 'undefined' ? cfg.port : '').trim(),
                            weight: Number(typeof cfg.weight !== 'undefined' ? cfg.weight : 0),
                            rsname: String(typeof cfg.rsname !== 'undefined' ? cfg.rsname : '').trim(),
                            rsstatus: String(typeof cfg.rsstatus !== 'undefined'  ? cfg.rsstatus : 'unknown').trim().toLowerCase(),
                            rsaddress: String(typeof cfg.rsaddress !== 'undefined' ? cfg.rsaddress : '').trim()
                        };
                        result.data.push(item);
                    });
                }
                catch (error) {
                    partial_errors.push(vsname + '/' + poolname + ': ' + error.toString());
                }
            });

            if (result.data.length === 0 && partial_errors.length > 0) {
                result.error = partial_errors.join(' | ');
            }
            else {
                result.error = '';
            }
        }
        catch (error) {
            error_msg = error.toString();
            error_msg += error_msg.endsWith('.') ? '' : '.';
            Zabbix.log(3, '[ FortiADC ] ERROR: ' + error_msg);
            result.error = error_msg;
        }

        return JSON.stringify(result);
