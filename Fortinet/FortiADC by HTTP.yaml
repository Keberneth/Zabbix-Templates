          formulaid: C
        - macro: '{#HASERIAL}'
          value: '{$FADC.HA.MEMBER.SERIAL.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
          formulaid: D
      description: Discovers FortiADC HA members from the FortiADC HA API status data.
      master_item:
        key: fadc.ha.get_data
      lld_macro_paths:
      - lld_macro: '{#HAKEY}'
        path: $.key
      - lld_macro: '{#HAHOSTNAME}'
        path: $.hostname
      - lld_macro: '{#HASERIAL}'
        path: $.serial
      - lld_macro: '{#HANODEID}'
        path: $.node_id
      - lld_macro: '{#HAADDRESS}'
        path: $.address
      - lld_macro: '{#HAROLE}'
        path: $.role
      - lld_macro: '{#HASTATE}'
        path: $.state
      - lld_macro: '{#HASYNC}'
        path: $.sync
      - lld_macro: '{#HACFGSRC}'
        path: $.cfg_source
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data.members_lld
        error_handler: DISCARD_VALUE
      item_prototypes:
      - uuid: 4bbb97de89a54d23bb0588be30d60042
        name: 'HA member [{#HAHOSTNAME}]: Get data'
        type: DEPENDENT
        key: fadc.ha.member.get_data["{#HAKEY}"]
        delay: '0'
        value_type: TEXT
        trends: '0'
        description: Raw normalized data for HA member {#HAHOSTNAME}.
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.data.members[?(@.key == "{#HAKEY}")].first()
          error_handler: DISCARD_VALUE
        master_item:
          key: fadc.ha.get_data
        tags:
        - tag: component
          value: ha
      - uuid: 34a5d5fb5a394647ac2cce8ae7bed504
        name: 'HA member [{#HAHOSTNAME}]: Health'
        type: DEPENDENT
        key: fadc.ha.member.health["{#HAKEY}"]
        delay: '0'
        description: Per-member HA health. Good requires the member to be up and in sync. Not-good means down or out-of-sync. Unknown means the API did not provide enough state/sync data.
        valuemap:
          name: FortiADC HA member health
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - |-
            var m;
            try { m = JSON.parse(value); }
            catch (e) { return 2; }
            var state = Number(m.state);
            var sync = Number(m.sync);
            if (state === 0 || sync === 0) { return 0; }
            if (state === 1 && sync === 1) { return 1; }
            if (state === 1 && sync === 2) { return 2; }
            return 2;
        master_item:
          key: fadc.ha.member.get_data["{#HAKEY}"]
        tags:
        - tag: component
          value: ha
        - tag: component
          value: health
