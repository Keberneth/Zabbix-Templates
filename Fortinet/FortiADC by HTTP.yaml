        - uuid: 810d164d421642b58b0f0dd4d757e1cc
          name: 'FortiGuard services discovery'
          type: DEPENDENT
          key: fadc.service.discovery
          delay: '0'
          filter:
            evaltype: AND
            conditions:
              - macro: '{#KEY}'
                value: '{$FADC.SERVICE.KEY.MATCHES}'
                formulaid: A
              - macro: '{#KEY}'
                value: '{$FADC.SERVICE.KEY.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
          description: 'Discovery for FortiGuard and license-backed services returned by /system_fortiguard/get_services_info.'
          item_prototypes:
            - uuid: 7ec34afd5128489392e0097844df8097
              name: 'Service [{#KEY}]: Expiration date'
              type: DEPENDENT
              key: 'fadc.service.expire["{#KEY}"]'
              delay: '0'
              units: unixtime
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.expire
                  error_handler: DISCARD_VALUE
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var text = String(value || '').trim();
                      if (text === '' || text.toLowerCase() === 'unknown' || text.toLowerCase() === 'n/a') {
                          return -1;
                      }
                      var d = new Date(text + 'T00:00:00Z');
                      if (isNaN(d.getTime())) {
                          return -1;
                      }
                      return Math.floor(d.getTime() / 1000);
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: 'fadc.service.get_data["{#KEY}"]'
              tags:
                - tag: component
                  value: service
                - tag: service
                  value: '{#KEY}'
              trigger_prototypes:
                - uuid: ea03e63f1cbb4a329fa672a56dfe31cc
                  expression: '{$FADC.SERVICE.LICENSE.CONTROL:"{#KEY}"}=1 and last(/FortiADC by HTTP/fadc.service.expire["{#KEY}"])>0 and last(/FortiADC by HTTP/fadc.service.expire["{#KEY}"])<=now()'
                  name: 'Service [{#KEY}]: License expired'
                  event_name: 'Service [{#KEY}]: License expired'
                  opdata: 'Expiration: {ITEM.LASTVALUE1}'
                  priority: AVERAGE
                  description: 'FortiGuard service license is expired.'
                  tags:
                    - tag: scope
                      value: notice
                - uuid: 53cefeb4f6f74ed9902ebed188077652
                  expression: '{$FADC.SERVICE.LICENSE.CONTROL:"{#KEY}"}=1 and last(/FortiADC by HTTP/fadc.service.expire["{#KEY}"])>now() and (last(/FortiADC by HTTP/fadc.service.expire["{#KEY}"]) - now()) / 86400 < {$FADC.SERVICE.EXPIRE.WARN:"{#KEY}"}'
                  name: 'Service [{#KEY}]: License expires soon'
                  event_name: 'Service [{#KEY}]: License expires in less than {$FADC.SERVICE.EXPIRE.WARN:"{#KEY}"} days'
                  opdata: 'Expiration: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: 'FortiGuard service license will expire soon.'
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: notice
            - uuid: f629ee2a35644594b275c2aa7157599a
