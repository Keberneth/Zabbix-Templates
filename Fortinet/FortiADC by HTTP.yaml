          value: '{#IFNAME}'
      - uuid: a895d4ea482d4d5691311dd708f53fc4
        name: 'Interface [{#IFNAME}]: Speed'
        type: DEPENDENT
        key: fadc.if.speed["{#IFNAME}"]
        delay: '0'
        units: bps
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.speed
          error_handler: DISCARD_VALUE
        - type: JAVASCRIPT
          parameters:
          - |
            var text = String(value || '').trim().toUpperCase();
            var m = text.match(/([0-9]+(?:\.[0-9]+)?)\s*([KMG]?BPS|[KMG]?MBPS|[KMG]?GBPS)/i);
            if (!m) {
                m = text.match(/([0-9]+(?:\.[0-9]+)?)\s*([KMG]?BPS)/i);
            }
            if (!m) {
                return 0;
            }
            var num = parseFloat(m[1]);
            var unit = m[2].toUpperCase();
            var mult = 1;
            if (unit === 'KBPS') {
                mult = 1000;
            }
            else if (unit === 'MBPS') {
                mult = 1000000;
            }
            else if (unit === 'GBPS') {
                mult = 1000000000;
            }
            else {
                mult = 1;
            }
            return Math.round(num * mult);
        - type: DISCARD_UNCHANGED_HEARTBEAT
