          triggers:
            - uuid: 6cf41346a3fa436089790c5289502805
              expression: 'length(last(/FortiADC by HTTP/fadc.if.data_errors))>0'
              name: 'There are errors in the ''Get interfaces data'' metric'
              priority: WARNING
              dependencies:
                - name: 'Authentication to FortiADC API failed'
                  expression: 'last(/FortiADC by HTTP/fadc.auth.status)=0'
                - name: 'Unexpected response from API'
