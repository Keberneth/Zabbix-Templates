      trigger_prototypes:
      - uuid: 91a7923353cf4ff3aee4339c5f87cd97
        expression: '{$FADC.HA.MONITOR}=1 and {$FADC.HA.MEMBER.CONTROL:"{#HAHOSTNAME}"}=1 and last(/FortiADC by HTTP/fadc.ha.member.health["{#HAKEY}"])=0'
        name: 'HA member [{#HAHOSTNAME}]: Health is not good'
        priority: HIGH
        opdata: 'Health: {ITEM.LASTVALUE1}'
        description: The HA member is down or out of sync. A failover may be risky until this is corrected.
        tags:
        - tag: scope
          value: availability
        - tag: component
          value: ha
        recovery_mode: RECOVERY_EXPRESSION
        recovery_expression: last(/FortiADC by HTTP/fadc.ha.member.health["{#HAKEY}"])<>0 or {$FADC.HA.MONITOR}=0 or {$FADC.HA.MEMBER.CONTROL:"{#HAHOSTNAME}"}=0
      - uuid: 76bdbf41037c4cc4b4fd84dee9a1dec9
        expression: '{$FADC.HA.MONITOR}=1 and {$FADC.HA.MEMBER.CONTROL:"{#HAHOSTNAME}"}=1 and last(/FortiADC by HTTP/fadc.ha.member.state["{#HAKEY}"])=0'
        name: 'HA member [{#HAHOSTNAME}]: State is down'
        priority: HIGH
        opdata: 'State: {ITEM.LASTVALUE1}'
        description: The FortiADC HA member is reported as down by HA monitoring.
        recovery_mode: RECOVERY_EXPRESSION
        recovery_expression: last(/FortiADC by HTTP/fadc.ha.member.state["{#HAKEY}"])<>0 or {$FADC.HA.MONITOR}=0 or {$FADC.HA.MEMBER.CONTROL:"{#HAHOSTNAME}"}=0
        tags:
        - tag: scope
          value: availability
        - tag: component
          value: ha
      - uuid: cc2dbb857f334070a9c84d4c7c517dbf
        expression: '{$FADC.HA.MONITOR}=1 and {$FADC.HA.SYNC.CONTROL:"{#HAHOSTNAME}"}=1 and last(/FortiADC by HTTP/fadc.ha.member.sync["{#HAKEY}"])=0'
        name: 'HA member [{#HAHOSTNAME}]: Sync status is out of sync'
        priority: HIGH
        opdata: 'Sync: {ITEM.LASTVALUE1}'
        description: The FortiADC HA member is out of sync. A failover may be risky until synchronization is corrected.
        recovery_mode: RECOVERY_EXPRESSION
        recovery_expression: last(/FortiADC by HTTP/fadc.ha.member.sync["{#HAKEY}"])<>0 or {$FADC.HA.MONITOR}=0 or {$FADC.HA.SYNC.CONTROL:"{#HAHOSTNAME}"}=0
        tags:
        - tag: scope
          value: availability
        - tag: component
          value: ha
      - uuid: c74496c3472a4709ba9f87fa3c03bffc
        expression: '{$FADC.HA.MONITOR}=1 and {$FADC.HA.SYNC.CONTROL:"{#HAHOSTNAME}"}=1 and last(/FortiADC by HTTP/fadc.ha.member.sync["{#HAKEY}"])=2'
        name: 'HA member [{#HAHOSTNAME}]: Sync status is unknown'
        priority: WARNING
        opdata: 'Sync: {ITEM.LASTVALUE1}'
        description: The template cannot determine this HA member synchronization state.
        recovery_mode: RECOVERY_EXPRESSION
        recovery_expression: last(/FortiADC by HTTP/fadc.ha.member.sync["{#HAKEY}"])<>2 or {$FADC.HA.MONITOR}=0 or {$FADC.HA.SYNC.CONTROL:"{#HAHOSTNAME}"}=0
        tags:
        - tag: scope
          value: availability
        - tag: component
          value: ha
      - uuid: 1afcf206d330494da75e3052382c0df6
        expression: '{$FADC.HA.MONITOR}=1 and last(/FortiADC by HTTP/fadc.ha.member.role["{#HAKEY}"])>0 and change(/FortiADC by HTTP/fadc.ha.member.role["{#HAKEY}"])<>0'
        name: 'HA member [{#HAHOSTNAME}]: Role changed'
        priority: INFO
        opdata: 'Role: {ITEM.LASTVALUE1}'
        description: The HA member role changed. This normally indicates failover or HA election activity.
        manual_close: 'YES'
        tags:
        - tag: scope
          value: notice
        - tag: component
          value: ha
