      discovery_rules:
        - uuid: 2b2da878d0274e728b25f060fcb7f81a
          name: 'Physical interfaces discovery'
          type: DEPENDENT
          key: fadc.if.discovery
          delay: '0'
          filter:
            evaltype: AND
            conditions:
              - macro: '{#IFNAME}'
                value: '{$FADC.IF.NAME.MATCHES}'
                formulaid: A
              - macro: '{#IFNAME}'
                value: '{$FADC.IF.NAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
          description: 'Discovery for physical FortiADC interfaces.'
          item_prototypes:
            - uuid: df0f540cd53a46ca9702905885420335
              name: 'Interface [{#IFNAME}]: Duplex'
              type: DEPENDENT
              key: 'fadc.if.duplex["{#IFNAME}"]'
              delay: '0'
              value_type: CHAR
              trends: '0'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.duplex
                  error_handler: DISCARD_VALUE
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: 'fadc.if.get_data["{#IFNAME}"]'
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: a6a7fe6db2d54c86bebc88a529e3a7ea
              name: 'Interface [{#IFNAME}]: Get data'
              type: DEPENDENT
              key: 'fadc.if.get_data["{#IFNAME}"]'
              delay: '0'
              history: '0'
              value_type: TEXT
              trends: '0'
              description: 'Raw data for interface {#IFNAME}.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.data[?(@.name == "{#IFNAME}")].first()'
                  error_handler: DISCARD_VALUE
              master_item:
                key: fadc.if.get_data
              tags:
                - tag: component
                  value: raw
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 470165b23b214e5aa66aecd504a80efc
              name: 'Interface [{#IFNAME}]: IP address'
              type: DEPENDENT
              key: 'fadc.if.ip["{#IFNAME}"]'
              delay: '0'
              value_type: CHAR
              trends: '0'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.ip
                  error_handler: DISCARD_VALUE
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: 'fadc.if.get_data["{#IFNAME}"]'
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: a895d4ea482d4d5691311dd708f53fc4
              name: 'Interface [{#IFNAME}]: Speed'
              type: DEPENDENT
              key: 'fadc.if.speed["{#IFNAME}"]'
              delay: '0'
              units: bps
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.speed
                  error_handler: DISCARD_VALUE
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var text = String(value || '').trim().toUpperCase();
                      var m = text.match(/([0-9]+(?:\.[0-9]+)?)\s*([KMG]?BPS|[KMG]?MBPS|[KMG]?GBPS)/i);
                      if (!m) {
                          m = text.match(/([0-9]+(?:\.[0-9]+)?)\s*([KMG]?BPS)/i);
                      }
                      if (!m) {
                          return 0;
                      }
                      var num = parseFloat(m[1]);
                      var unit = m[2].toUpperCase();
                      var mult = 1;
                      if (unit === 'KBPS') {
                          mult = 1000;
                      }
                      else if (unit === 'MBPS') {
                          mult = 1000000;
                      }
                      else if (unit === 'GBPS') {
                          mult = 1000000000;
                      }
                      else {
                          mult = 1;
                      }
                      return Math.round(num * mult);
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: 'fadc.if.get_data["{#IFNAME}"]'
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: ee03552a3f4f4554a28c41befd5e9dbd
              name: 'Interface [{#IFNAME}]: Link state'
              type: DEPENDENT
              key: 'fadc.if.status["{#IFNAME}"]'
              delay: '0'
              valuemap:
                name: 'Link state'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.status
                  error_handler: CUSTOM_VALUE
