    macros:
    - macro: '{$CPU.UTIL.CRIT}'
      value: '95'
      description: Threshold of CPU utilization for critical trigger in %.
    - macro: '{$CPU.UTIL.WARN}'
      value: '85'
      description: Threshold of CPU utilization for warning trigger in %.
    - macro: '{$DISK.UTIL.CRIT}'
      value: '90'
      description: Threshold of disk utilization for critical trigger in %.
    - macro: '{$DISK.UTIL.WARN}'
      value: '80'
      description: Threshold of disk utilization for warning trigger in %.
    - macro: '{$FADC.API.FQDN}'
      description: FortiADC API FQDN/IP.
    - macro: '{$FADC.API.PASS}'
      description: Optional fallback login password for a standard administrator account used with /api/user/login when API token is not provided.
    - macro: '{$FADC.API.PORT}'
      value: '443'
      description: FortiADC API TCP port.
    - macro: '{$FADC.API.TOKEN}'
      description: Preferred FortiADC REST API token (APITOKEN header).
    - macro: '{$FADC.API.USER}'
      description: Optional fallback login username for a standard administrator account used with /api/user/login when API token is not provided.
    - macro: '{$FADC.DATA.TIMEOUT}'
      value: 15s
      description: Response timeout for API requests.
    - macro: '{$FADC.HA.ACTIVE.STATE}'
      value: Primary
      description: Only raise virtual server and pool member health triggers when the local HA state matches this value.
    - macro: '{$FADC.HTTP.PROXY}'
      description: HTTP proxy for API requests. Use format [protocol://][username[:password]@]proxy.example.com[:port].
    - macro: '{$FADC.IF.CONTROL}'
      value: '1'
      description: Controls interface link-down triggers. Can be used with interface name as context.
    - macro: '{$FADC.IF.NAME.MATCHES}'
      value: .*
      description: Used in interface discovery. Can be overridden on host or linked template level.
    - macro: '{$FADC.IF.NAME.NOT_MATCHES}'
      value: CHANGE_IF_NEEDED
      description: Used in interface discovery. Can be overridden on host or linked template level.
    - macro: '{$FADC.LICENSE.CONTROL}'
      value: '1'
      description: Controls the license validity trigger.
    - macro: '{$FADC.MEMBER.CONTROL}'
      value: '1'
      description: Controls pool member health triggers. Can be used with member key as context.
    - macro: '{$FADC.MEMBER.RS.MATCHES}'
      value: .*
      description: Used in pool member discovery. Can be overridden on host or linked template level.
    - macro: '{$FADC.MEMBER.RS.NOT_MATCHES}'
      value: CHANGE_IF_NEEDED
      description: Used in pool member discovery. Can be overridden on host or linked template level.
    - macro: '{$FADC.MEMBER.VS.MATCHES}'
      value: .*
      description: Used in pool member discovery. Can be overridden on host or linked template level.
    - macro: '{$FADC.MEMBER.VS.NOT_MATCHES}'
      value: CHANGE_IF_NEEDED
      description: Used in pool member discovery. Can be overridden on host or linked template level.
    - macro: '{$FADC.NODATA.TIME}'
      value: 5m
      description: Maximum age of the API availability item before the no-data trigger fires.
    - macro: '{$FADC.SCHEME}'
      value: https
      description: Request scheme which may be http or https.
    - macro: '{$FADC.SERVICE.EXPIRE.WARN}'
      value: '30'
      description: Days before expiration for service license warning trigger. Can be used with service key as context.
    - macro: '{$FADC.SERVICE.KEY.MATCHES}'
      value: .*
      description: Used in FortiGuard service discovery. Can be overridden on host or linked template level.
    - macro: '{$FADC.SERVICE.KEY.NOT_MATCHES}'
      value: CHANGE_IF_NEEDED
      description: Used in FortiGuard service discovery. Can be overridden on host or linked template level.
    - macro: '{$FADC.SERVICE.LICENSE.CONTROL}'
      value: '1'
      description: Controls FortiGuard service expiry triggers. Can be used with service key as context.
    - macro: '{$FADC.VDOM}'
      value: root
      description: Virtual domain name used by VDOM-aware API calls.
    - macro: '{$FADC.VS.CONTROL}'
      value: '1'
      description: Controls virtual server health triggers. Can be used with VS name as context.
    - macro: '{$FADC.VS.NAME.MATCHES}'
      value: .*
      description: Used in virtual server discovery. Can be overridden on host or linked template level.
    - macro: '{$FADC.VS.NAME.NOT_MATCHES}'
      value: CHANGE_IF_NEEDED
      description: Used in virtual server discovery. Can be overridden on host or linked template level.
    - macro: '{$MEMORY.UTIL.CRIT}'
      value: '90'
      description: Threshold of memory utilization for critical trigger in %.
    - macro: '{$MEMORY.UTIL.WARN}'
      value: '80'
      description: Threshold of memory utilization for warning trigger in %.
    - macro: '{$FADC.HA.EXPECTED.MEMBERS}'
      value: '2'
      description: Expected FortiADC HA member count. Set to 0 to disable member count validation.
    - macro: '{$FADC.HA.MONITOR}'
      value: '1'
      description: Controls FortiADC HA monitoring triggers. Set to 0 to disable HA problem triggers.
    - macro: '{$FADC.HA.MEMBER.CONTROL}'
      value: '1'
      description: Controls FortiADC HA member state triggers. Can be used with HA member hostname as context.
    - macro: '{$FADC.HA.SYNC.CONTROL}'
      value: '1'
      description: Controls FortiADC HA synchronization triggers. Can be used with HA member hostname as context.
    - macro: '{$FADC.HA.MEMBER.HOSTNAME.MATCHES}'
      value: .*
      description: Used in FortiADC HA member discovery hostname filtering.
    - macro: '{$FADC.HA.MEMBER.HOSTNAME.NOT_MATCHES}'
      value: CHANGE_IF_NEEDED
      description: Used in FortiADC HA member discovery hostname filtering.
    - macro: '{$FADC.HA.MEMBER.SERIAL.MATCHES}'
      value: .*
      description: Used in FortiADC HA member discovery serial filtering.
    - macro: '{$FADC.HA.MEMBER.SERIAL.NOT_MATCHES}'
      value: CHANGE_IF_NEEDED
      description: Used in FortiADC HA member discovery serial filtering.
