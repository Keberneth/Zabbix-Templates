            if (typeof response.token !== 'undefined' && response.token !== '') {
                token = response.token;
            }
            else if (typeof response.payload === 'object' && response.payload !== null && typeof response.payload.token !== 'undefined' &&  response.payload.token !== '') {
                token = response.payload.token;
            }

            if (token === '') {
                throw 'Login succeeded but token was not returned.';
            }

            if (typeof headers['Set-Cookie'] !== 'undefined') {
                cookie = normalizeCookieHeader(headers['Set-Cookie']);
            }
            else if (typeof headers['set-cookie'] !== 'undefined') {
                cookie = normalizeCookieHeader(headers['set-cookie']);
            }

            return {
                token: token,
                cookie: cookie
            };
        }

        function initAuth() {
            var token = '',
                auth = {};

            if (auth_mode !== null) {
                return;
            }

            token = getStaticToken();
            if (token !== '') {
                auth_mode = 'api';
                auth_token = token;
                auth_cookie = '';
                return;
            }

            auth_mode = 'login';
            auth = loginToken();
            auth_token = auth.token;
            auth_cookie = auth.cookie;
        }

        function apiRequest(method, path, body) {
            var request = new HttpRequest(),
                 response = '',
                url = api_url + path;

            applyCommonHeaders(request);
            initAuth();

            if (auth_mode === 'api') {
                request.addHeader('APITOKEN: ' + auth_token);
            }
            else {
                request.addHeader('Authorization: Bearer ' + auth_token);
                if (auth_cookie !== '') {
                    request.addHeader('Cookie: ' + auth_cookie);
                }
            }

            if (method === 'GET') {
                response = request.get(url);
            }
            else if (method === 'POST') {
                response = request.post(url, body);
            }
            else {
                throw 'Unsupported method: ' + method + '.';
            }

            Zabbix.log(4, '[ FortiADC ] [ ' + url + ' ] Received response with status code ' + request.getStatus() + ': ' + response);

            if (request.getStatus() !== 200) {
                throw method + ' ' + path + ' failed with status code ' + request.getStatus() + '.';
            }

            if (response === null || response === '') {
                throw 'Empty response received  from ' + path + '.';
            }

            try {
                response = JSON.parse(response);
            }
            catch (error) {
                throw 'Failed to parse response received from ' + path + '.';
            }

            if (typeof response !== 'object' || response === null || typeof response.payload === 'undefined') {
                throw 'Cannot process response received from ' + path + '.';
            }

            return response.payload;
        }

        function apiGet(path) {
            return apiRequest('GET', path, '');
        }

        validateCommon();
        api_url = params.scheme + '://' + params.fqdn + ':' + params.port;

        result.data = [];

        try {
            var config_list = [],
                view_list = [],
                runtime = {new: []},
                config_map = {},
                view_map = {},
                runtime_map = {},
                names = {},
                idx = 0;

            function firstSuccess(paths, optionalDefault) {
                var i = 0,
                    last = '';
                for (i = 0; i < paths.length; i++) {
                    try {
                        return apiGet(paths[i]);
                     }
                    catch (error) {
                        last = error.toString();
                    }
                }
                if (typeof optionalDefault !== 'undefined') {
                    return optionalDefault;
                }
                throw last;
            }

            config_list = firstSuccess([
                '/api/load_balance_virtual_server?vdom=' + encodeURIComponent(params.vdom),
                '/api/load_balance_virtual_server'
            ]);

            view_list = firstSuccess([
                '/api/all_vs_info/vs_list?vdom=' + encodeURIComponent(params.vdom)
            ]);

            runtime = firstSuccess([
                '/api/slb/all_vs_status_last_2'
            ], {new: []});

            if (!Array.isArray(config_list)) {
                throw 'Unexpected payload for virtual server configuration.';
            }
            if (!Array.isArray(view_list)) {
                throw 'Unexpected payload for virtual server list.';
            }

            config_list.forEach(function (vs) {
                if (typeof vs.mkey !== 'undefined') {
                    config_map[String(vs.mkey)] = vs;
                     names[String(vs.mkey)] = 1;
                }
            });

            view_list.forEach(function (vs) {
                if (typeof vs.config === 'object' && vs.config !== null && typeof vs.config.mkey !== 'undefined') {
                    view_map[String(vs.config.mkey)] = vs.config;
                    names[String(vs.config.mkey)] = 1;
                }
            });

            if (typeof runtime === 'object' && runtime !== null && Array.isArray(runtime.new)) {
                runtime.new.forEach(function (vs) {
                    if (typeof vs.mkey !== 'undefined') {
                        runtime_map[String(vs.mkey)] = vs;
                        names[String(vs.mkey)] = 1;
                    }
                });
            }

            result.data = Object.keys(names).sort().map(function (name) {
                var item = {
                        name: name,
                        address: '',
                        port: '',
                        pool: '',
                        interface: '',
                        type: '',
                        admin_status: 'unknown',
                        availability:  'UNKNOWN',
                        current_status_num: -1,
                        current_sessions: 0,
                        max_sessions: 0,
                        total_sessions: 0,
                        in_bytes: 0,
                        out_bytes: 0,
                        load_balance_sessions: 0,
                        active_http_sessions: 0,
                        new_http_sessions: 0,
                        http_throughput: 0,
                        limit_sessions: 0,
                        request_errors: 0,
                        response_errors: 0
                    },
                    cfg = {},
                    view = {},
                    stats = {};

                if (typeof config_map[name] !== 'undefined') {
                    cfg = config_map[name];
                    item.address = String(typeof cfg.address !== 'undefined' ? cfg.address : '');
                    item.port = String(typeof cfg.port !== 'undefined' ? cfg.port : '').trim();
                    item.pool = String(typeof cfg.pool !== 'undefined' ? cfg.pool : '');
                    item.interface = String(typeof cfg.interface  !== 'undefined' ? cfg.interface : '');
                    item.type = String(typeof cfg.type !== 'undefined' ? cfg.type : '');
                    item.admin_status = String(typeof cfg.status !== 'undefined' ? cfg.status : 'unknown').trim().toLowerCase();
                }

                if (typeof view_map[name] !== 'undefined') {
                    view = view_map[name];
                    item.address = item.address === '' ? String(typeof view.address !== 'undefined' ? view.address : '') : item.address;
                    item.port = item.port === '' ? String(typeof view.port !== 'undefined' ? view.port : '').trim() : item.port;
                    item.pool = item.pool === '' ? String(typeof view.pool !== 'undefined' ? view.pool : '') : item.pool;
                    item.availability = String(typeof view.availability !== 'undefined' ? view.availability : 'UNKNOWN').trim().toUpperCase();
                }

                if (typeof runtime_map[name] !== 'undefined') {
                    stats = runtime_map[name];
                    item.current_status_num  = Number(typeof stats['current-status'] !== 'undefined' ? stats['current-status'] : -1);
                    item.current_sessions = Number(typeof stats.current_sessions !== 'undefined' ? stats.current_sessions : 0);
                    item.max_sessions = Number(typeof stats.max_sessions !== 'undefined' ? stats.max_sessions : 0);
                    item.total_sessions = Number(typeof stats.total_sessions !== 'undefined' ? stats.total_sessions : 0);
                    item.in_bytes = Number(typeof stats.in_bytes !== 'undefined' ? stats.in_bytes : 0);
                    item.out_bytes = Number(typeof stats.out_bytes !== 'undefined' ? stats.out_bytes : 0);
                    item.load_balance_sessions = Number(typeof stats.load_balance_sessions !== 'undefined' ? stats.load_balance_sessions : 0);
                    item.active_http_sessions = Number(typeof stats.active_http_sessions !== 'undefined' ? stats.active_http_sessions : 0);
                    item.new_http_sessions = Number(typeof stats.new_http_sessions !== 'undefined'  ? stats.new_http_sessions : 0);
                    item.http_throughput = Number(typeof stats.http_throughput !== 'undefined' ? stats.http_throughput : 0);
                    item.limit_sessions = Number(typeof stats.limit_sessions !== 'undefined' ? stats.limit_sessions : 0);
                    item.request_errors = Number(typeof stats.request_errors !== 'undefined' ? stats.request_errors : 0);
                    item.response_errors = Number(typeof stats.response_errors !== 'undefined' ? stats.response_errors : 0);
                }

                return item;
            });

            result.error = '';
        }
        catch (error) {
            error_msg = error.toString();
            error_msg += error_msg.endsWith('.') ? '' : '.';
            Zabbix.log(3, '[ FortiADC ] ERROR: ' + error_msg);
            result.error = error_msg;
        }

        return JSON.stringify(result);
      description: Collects virtual server configuration, availability, and runtime counters from the FortiADC REST API.
      timeout: '{$FADC.DATA.TIMEOUT}'
      parameters:
      - name: fqdn
