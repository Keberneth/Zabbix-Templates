        - uuid: 70207dd547c440749d4b871e5c67694a
          name: 'System uptime'
          type: DEPENDENT
          key: fadc.uptime
          delay: '0'
          units: uptime
          description: 'System uptime converted to seconds.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.data.info.systemUpTime
            - type: JAVASCRIPT
              parameters:
                - |
                  var text = String(value || '').toLowerCase();
                  var total = 0, m;
                  m = text.match(/(\d+)\s*d/);
                  if (m) total += parseInt(m[1], 10) * 86400;
                  m = text.match(/(\d+)\s*h/);
                  if (m) total += parseInt(m[1], 10) * 3600;
                  m = text.match(/(\d+)\s*m/);
                  if (m) total += parseInt(m[1], 10) * 60;
                  m = text.match(/(\d+)\s*s/);
                  if (m) total += parseInt(m[1], 10);
                  return total;
          master_item:
            key: fadc.system.get_data
          tags:
