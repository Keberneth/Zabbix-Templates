          value: '{$FADC.SERVICE.KEY.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
          formulaid: B
      description: Discovery for FortiGuard and license-backed services returned by /system_fortiguard/get_services_info.
      item_prototypes:
      - uuid: 7ec34afd5128489392e0097844df8097
        name: 'Service [{#KEY}]: Expiration date'
        type: DEPENDENT
        key: fadc.service.expire["{#KEY}"]
        delay: '0'
        units: unixtime
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.expire
          error_handler: DISCARD_VALUE
        - type: JAVASCRIPT
          parameters:
          - |
            var text = String(value || '').trim();
            if (text === '' || text.toLowerCase() === 'unknown' || text.toLowerCase() === 'n/a') {
                return -1;
            }
            var d = new Date(text + 'T00:00:00Z');
            if (isNaN(d.getTime())) {
                return -1;
            }
            return Math.floor(d.getTime() / 1000);
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1h
        master_item:
          key: fadc.service.get_data["{#KEY}"]
        tags:
        - tag: component
          value: service
        - tag: service
          value: '{#KEY}'
        trigger_prototypes:
        - uuid: ea03e63f1cbb4a329fa672a56dfe31cc
          expression: '{$FADC.SERVICE.LICENSE.CONTROL:"{#KEY}"}=1 and last(/FortiADC by HTTP/fadc.service.expire["{#KEY}"])>0 and last(/FortiADC by HTTP/fadc.service.expire["{#KEY}"])<=now()'
