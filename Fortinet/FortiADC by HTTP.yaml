    - uuid: f4f044eb56af4c729012a240ae9a8507
      name: Free disk space
      type: DEPENDENT
      key: fadc.fs.free
      delay: '0'
      units: B
      description: Free disk space in bytes.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data.disk.free
      - type: JAVASCRIPT
        parameters:
        - |
          var text = String(value || '').trim();
          var m = text.match(/([0-9]+(?:\.[0-9]+)?)\s*([KMGT]?B)/i);
          if (!m) {
              return 0;
          }
          var size = parseFloat(m[1]);
          var unit = m[2].toUpperCase();
          var mult = {
              'B': 1,
              'KB': 1024,
              'MB': 1024 * 1024,
              'GB': 1024 * 1024 * 1024,
              'TB': 1024 * 1024 * 1024 * 1024
          };
          return Math.round(size * mult[unit]);
      master_item:
        key: fadc.system.get_data
      tags:
      - tag: component
        value: storage
