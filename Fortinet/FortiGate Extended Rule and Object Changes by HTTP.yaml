                       * fingerprint snapshot of one table bucket (input: "<previous>@@FGCHG@@<latest>") and
                       * returns the changes as JSON {state, n, added, deleted, modified, moved, from, to,
                       * summary, detail}. The output only depends on the two snapshots, so re-evaluating the
                       * same pair gives the same value (discarded by "Discard unchanged").
                       */
                      var SEP = '@@FGCHG@@',
                      	SUMMARY_MAX = 300,
                      	SUMMARY_ITEMS = 4,
                      	DETAIL_MAX = 60000,
                      	LOG_TOLERANCE = 120,
                      	LOG_PER_OBJECT = 5,
                      	MEMBERS_SHOWN = 6;

                      function unesc(s) {
                      	try {
                      		return decodeURIComponent(s);
                      	}
                      	catch (e) {
                      		return s;
                      	}
                      }

                      function parse(t) {
                      	var lines = t.split('\n'), h = lines[0].split('\t'), fp, i, f, mode = 'E', key;

                      	if (h[0] !== 'FGCHG1' || h.length < 11) return null;
                      	fp = {
                      		ts: parseInt(h[1], 10), vdom: unesc(h[2]), table: unesc(h[3]), bucket: h[4], fw: unesc(h[5]),
                      		cfgsig: h[6], count: parseInt(h[7], 10), ordered: h[9] === '1', labels: h[10].split(','),
                      		name: h.length > 11 ? unesc(h[11]) : unesc(h[3]), order: [], map: {}, logs: []
                      	};
                      	for (i = 1; i < lines.length; i++) {
                      		if (lines[i] === '@LOG') {
                      			mode = 'L';
                      			continue;
                      		}
                      		if (lines[i] === '') continue;
                      		f = lines[i].split('\t');
                      		if (mode === 'E') {
                      			if (f.length < 3) continue;
                      			key = unesc(f[0]);
                      			if (fp.map.hasOwnProperty('#' + key)) continue;
                      			fp.map['#' + key] = { key: key, hash: f[1], sig: f[2], label: unesc(f[3] || ''), extra: f[4] || '' };
                      			fp.order.push(key);
                      		}
                      		else if (f[0] === 'L' && f.length >= 8) {
                      			fp.logs.push({ time: parseInt(f[1], 10), tz: unesc(f[2]), key: unesc(f[3]), action: unesc(f[4]),
                      				user: unesc(f[5]), ui: unesc(f[6]), attr: unesc(f[7]) });
                      		}
                      	}
                      	return fp;
                      }

                      function pad(n) {
                      	return (n < 10 ? '0' : '') + n;
                      }

                      function tzMinutes(tz) {
                      	var m = /^([+-])(\d\d):?(\d\d)$/.exec(String(tz || ''));
                      	return m ? (m[1] === '-' ? -1 : 1) * (parseInt(m[2], 10) * 60 + parseInt(m[3], 10)) : null;
                      }

                      /* local time of the FortiGate when the log carries a time zone, otherwise Zabbix server time */
                      function fmt(t, tz, short) {
                      	var off = tzMinutes(tz), d;
                      	if (off === null) off = -new Date(t * 1000).getTimezoneOffset();
                      	d = new Date((t + off * 60) * 1000);
                      	if (short) return pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes());
                      	return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()) + ' ' +
                      		pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()) + ':' + pad(d.getUTCSeconds());
                      }

                      /* positions (indexes into seq) of one longest increasing subsequence */
                      function lis(seq) {
                      	var tails = [], prev = [], i, lo, hi, mid, out = [], k;
                      	for (i = 0; i < seq.length; i++) {
                      		lo = 0;
                      		hi = tails.length;
                      		while (lo < hi) {
                      			mid = (lo + hi) >> 1;
                      			if (seq[tails[mid]] < seq[i]) lo = mid + 1;
                      			else hi = mid;
                      		}
                      		prev[i] = lo > 0 ? tails[lo - 1] : -1;
                      		tails[lo] = i;
                      	}
                      	k = tails.length ? tails[tails.length - 1] : -1;
                      	while (k >= 0) {
                      		out.push(k);
                      		k = prev[k];
                      	}
                      	return out;
                      }

                      function members(extra) {
                      	var r = {}, list, i;
                      	if (extra === '' ) return r;
                      	list = extra.split(',');
                      	for (i = 0; i < list.length; i++) r['#' + unesc(list[i])] = true;
                      	return r;
                      }

                      function memberDiff(a, b) {
                      	var ma, mb, plus = [], minus = [], k;
                      	if (a === b) return '';
                      	if (a.charAt(0) === '#' || b.charAt(0) === '#') {
                      		return 'members ' + (a.charAt(0) === '#' ? a.split(':')[0].substring(1) : (a === '' ? 0 : a.split(',').length)) +
                      			' -> ' + (b.charAt(0) === '#' ? b.split(':')[0].substring(1) : (b === '' ? 0 : b.split(',').length));
                      	}
                      	ma = members(a);
                      	mb = members(b);
                      	for (k in mb) if (mb.hasOwnProperty(k) && !ma.hasOwnProperty(k)) plus.push(k.substring(1));
                      	for (k in ma) if (ma.hasOwnProperty(k) && !mb.hasOwnProperty(k)) minus.push(k.substring(1));
                      	plus.sort();
                      	minus.sort();
                      	if (plus.length + minus.length > MEMBERS_SHOWN) {
                      		return 'members +' + plus.length + ' -' + minus.length;
                      	}
                      	return 'members' + (plus.length ? ' +' + plus.join(' +') : '') + (minus.length ? ' -' + minus.join(' -') : '');
                      }

                      var res = { state: 'ok', n: 0, added: 0, deleted: 0, modified: 0, moved: 0, from: 0, to: 0, summary: '', detail: '' },
                      	pos = value.indexOf(SEP), a, b;

                      if (pos < 0) {
                      	res.state = 'baseline';
                      	res.detail = 'Baseline: waiting for the next snapshot to compare with.';
                      	return JSON.stringify(res);
                      }
                      a = parse(value.substring(0, pos));
                      b = parse(value.substring(pos + SEP.length));
                      if (b === null) throw 'Cannot parse the latest fingerprint snapshot.';
                      res.to = b.ts;
                      if (a === null) {
                      	res.state = 'baseline';
                      	res.detail = 'Baseline: the previous snapshot has an unknown format.';
                      	return JSON.stringify(res);
                      }
                      res.from = a.ts;

                      var title = b.name + ' [' + b.vdom + ']', span = fmt(a.ts) + ' and ' + fmt(b.ts),
                      	na = a.bucket.split('/')[1], nb = b.bucket.split('/')[1];

                      if (a.cfgsig !== b.cfgsig || na !== nb || a.table !== b.table || a.vdom !== b.vdom) {
                      	res.state = 'rebaseline';
                      	res.detail = title + ': ' + (na !== nb ? 'the table was split into ' + nb + ' snapshot parts (was ' + na + ')' :
                      		'the ignored attributes or the object filter changed') + ' between ' + span +
                      		'. A new baseline was taken, so changes in this interval are not compared; see "Change tracking: Recent config changes (FortiGate log)".';
                      	return JSON.stringify(res);
                      }

                      var policy = b.ordered, changes = [], byKey = {}, i, k, ea, eb, c, groups, g;

                      function label(key, lbl) {
                      	return policy ? '#' + key + (lbl ? ' "' + lbl + '"' : '') : '"' + key + '"';
                      }

                      function change(key, lbl) {
                      	if (!byKey.hasOwnProperty('#' + key)) {
                      		byKey['#' + key] = { key: key, label: label(key, lbl), kinds: [], attrs: [], members: '', after: null, logs: [] };
                      		changes.push(byKey['#' + key]);
                      	}
                      	return byKey['#' + key];
                      }

                      for (i = 0; i < b.order.length; i++) {
                      	k = b.order[i];
                      	eb = b.map['#' + k];
                      	ea = a.map['#' + k];
                      	if (!ea) {
                      		change(k, eb.label).kinds.push('added');
                      	}
                      	else if (ea.hash !== eb.hash) {
                      		c = change(k, eb.label);
                      		c.kinds.push('modified');
                      		if (ea.sig.length === eb.sig.length && a.labels.join(',') === b.labels.join(',')) {
                      			for (g = 0; g < b.labels.length; g++) {
                      				if (ea.sig.charAt(g) !== eb.sig.charAt(g)) c.attrs.push(b.labels[g]);
                      			}
                      		}
                      		c.members = memberDiff(ea.extra, eb.extra);
                      		if (c.members !== '') {
                      			groups = [];
                      			for (g = 0; g < c.attrs.length; g++) if (c.attrs[g] !== 'members') groups.push(c.attrs[g]);
                      			c.attrs = groups;
                      		}
                      	}
                      }
                      for (i = 0; i < a.order.length; i++) {
                      	k = a.order[i];
                      	if (!b.map['#' + k]) change(k, a.map['#' + k].label).kinds.push('deleted');
                      }

                      if (policy) {
                      	var common = [], seq = [], keep = {}, idx, aPos = {};
                      	for (i = 0; i < a.order.length; i++) aPos['#' + a.order[i]] = i;
                      	for (i = 0; i < b.order.length; i++) {
                      		if (aPos.hasOwnProperty('#' + b.order[i])) {
                      			common.push(b.order[i]);
                      			seq.push(aPos['#' + b.order[i]]);
                      		}
                      	}
                      	idx = lis(seq);
                      	for (i = 0; i < idx.length; i++) keep['#' + common[idx[i]]] = true;
                      	for (i = 0; i < common.length; i++) {
                      		if (!keep['#' + common[i]]) {
                      			c = change(common[i], b.map['#' + common[i]].label);
                      			c.kinds.push('moved');
                      			c.after = i > 0 ? label(common[i - 1], b.map['#' + common[i - 1]].label) : null;
                      		}
                      	}
                      }

                      /* attach config-change log entries from the latest snapshot */
                      var logs = b.logs.slice(0), logged = 0, users = {}, tmin = 0, tmax = 0, tz = '';
                      logs.sort(function (x, y) { return x.time - y.time; });
                      for (i = 0; i < logs.length; i++) {
                      	if (logs[i].time <= a.ts - LOG_TOLERANCE || logs[i].time > b.ts + LOG_TOLERANCE) continue;
                      	logged++;
                      	if (byKey.hasOwnProperty('#' + logs[i].key)) byKey['#' + logs[i].key].logs.push(logs[i]);
                      }

                      /* after a firmware change, report only differences confirmed by a log entry made after the previous check */
                      var fwChanged = a.fw !== '' && b.fw !== '' && a.fw !== b.fw, suppressed = 0, reported = [];
                      function confirmed(c) {
                      	for (var j = 0; j < c.logs.length; j++) {
                      		if (c.logs[j].time > a.ts) return true;
                      	}
                      	return false;
                      }
                      for (i = 0; i < changes.length; i++) {
                      	if (fwChanged && !confirmed(changes[i])) {
                      		suppressed++;
                      		continue;
                      	}
                      	reported.push(changes[i]);
                      }
                      changes = reported;

                      for (i = 0; i < changes.length; i++) {
                      	c = changes[i];
                      	c.logs = c.logs.slice(-LOG_PER_OBJECT);
                      	if (c.kinds.indexOf('added') !== -1) res.added++;
                      	if (c.kinds.indexOf('deleted') !== -1) res.deleted++;
                      	if (c.kinds.indexOf('modified') !== -1) res.modified++;
                      	if (c.kinds.indexOf('moved') !== -1) res.moved++;
                      	for (g = 0; g < c.logs.length; g++) {
                      		if (c.logs[g].user) users[c.logs[g].user] = true;
                      		if (tmin === 0 || c.logs[g].time < tmin) tmin = c.logs[g].time;
                      		if (c.logs[g].time > tmax) {
                      			tmax = c.logs[g].time;
                      			tz = c.logs[g].tz;
                      		}
                      	}
                      }
                      res.n = changes.length;

                      /* short form for the problem name ("modified #12 "Web" (source)"), long form for the report */
                      function describe(c, long) {
                      	var s = long ? '[' + c.kinds.join('+').toUpperCase() + '] ' + c.label : c.kinds.join(' and ') + ' ' + c.label,
                      		extra = [];
                      	if (c.attrs.length) extra.push((long ? 'changed: ' : '') + c.attrs.join(', '));
                      	if (c.members) extra.push(c.members);
                      	if (long && c.kinds.indexOf('moved') !== -1) extra.push(c.after !== null ? 'now after ' + c.after : 'now first');
                      	return s + (extra.length ? ' (' + extra.join('; ') + ')' : '');
                      }

                      /* summary: used in the problem name */
                      if (res.n > 0) {
                      	var parts = [], who = Object.keys(users).sort(), s;
                      	for (i = 0; i < changes.length && i < SUMMARY_ITEMS; i++) parts.push(describe(changes[i], false));
                      	s = (res.n > 1 ? res.n + ' changes: ' : '') + parts.join('; ') +
                      		(res.n > SUMMARY_ITEMS ? '; +' + (res.n - SUMMARY_ITEMS) + ' more' : '');
                      	if (who.length) {
                      		s += ' | by ' + who.slice(0, 3).join(', ') + (who.length > 3 ? ' +' + (who.length - 3) : '') +
                      			' at ' + fmt(tmin, tz, true) + (fmt(tmax, tz, true) !== fmt(tmin, tz, true) ? '-' + fmt(tmax, tz, true) : '');
                      	}
                      	if (s.length > SUMMARY_MAX) s = s.substring(0, SUMMARY_MAX - 3) + '...';
                      	res.summary = s;
                      }

                      /* detail: the full report shown in Latest data and in the problem */
                      var lines = [], size = 0;
                      lines.push(title + ': ' + (res.n === 0 ? 'no changes' : res.n + ' change' + (res.n > 1 ? 's' : '') +
                      	' (' + res.added + ' added, ' + res.modified + ' modified, ' + res.deleted + ' deleted' +
                      	(policy ? ', ' + res.moved + ' moved' : '') + ')') + ' between ' + span + ' (Zabbix server time).');
                      if (fwChanged) {
                      	lines.push('FortiOS changed from ' + a.fw + ' to ' + b.fw + (suppressed > 0 ? ': ' + suppressed +
                      		' fingerprint difference(s) without a matching config-change log entry were treated as firmware related and not reported.' : '.'));
                      }
                      for (i = 0; i < changes.length; i++) {
                      	c = changes[i];
                      	var line = describe(c, true);
                      	size += line.length + 1;
                      	if (size > DETAIL_MAX) {
                      		lines.push('... ' + (changes.length - i) + ' more change(s) not shown.');
                      		break;
                      	}
                      	lines.push(line);
                      	if (c.logs.length === 0) {
                      		lines.push('    (no config-change log entry for this object in the interval)');
                      	}
                      	for (g = 0; g < c.logs.length; g++) {
                      		var l = c.logs[g];
                      		line = '    ' + fmt(l.time, l.tz) + (l.tz ? ' ' + l.tz : '') + ' ' + l.action + ' by ' + (l.user || '?') +
                      			(l.ui ? ' via ' + l.ui : '') + (l.attr ? ': ' + l.attr : '');
                      		size += line.length + 1;
                      		lines.push(line);
                      	}
                      }
                      if (res.n === 0 && logged > 0) {
                      	lines.push(logged + ' config-change log entr' + (logged > 1 ? 'ies' : 'y') +
                      		' in the interval without a net configuration difference (changed back, or no effective change).');
                      }
                      res.detail = lines.join('\n');

                      return JSON.stringify(res);
                - type: DISCARD_UNCHANGED
