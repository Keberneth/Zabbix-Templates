        - macro: '{$FGATE.CHG.DIFF.INTERVAL}'
          value: '5m'
          description: 'How often the calculated items compare the two latest snapshots. Only sets how soon after a collection a change is reported; it does not query the FortiGate.'
        - macro: '{$FGATE.CHG.HISTORY}'
          value: '7d'
          description: 'History storage period of the change summaries, details and counts (at least 1d).'
        - macro: '{$FGATE.CHG.IGNORE.ATTRS}'
          value: 'list,dirty,uuid-idx'
          description: 'Comma-separated object attributes that are not compared. "list" holds the IP addresses that SDN/fabric connectors resolve for dynamic addresses and changes by itself; "dirty" and "uuid-idx" are internal. Add for example color to ignore cosmetic changes. Changing it starts a new baseline.'
        - macro: '{$FGATE.CHG.INTERVAL}'
          value: '1h'
          description: How often the configuration snapshot is read from the FortiGate.
        - macro: '{$FGATE.CHG.LOG.LOOKBACK}'
          value: '24h'
          description: 'How far back the config-change log is read. Must be longer than {$FGATE.CHG.INTERVAL}.'
        - macro: '{$FGATE.CHG.LOG.MAXROWS}'
          value: '1000'
          description: Maximum number of config-change log rows read per VDOM and collection.
        - macro: '{$FGATE.CHG.LOG.SOURCE}'
          value: auto
          description: 'Where the config-change log is read: auto (first enabled of disk, memory, fortianalyzer, forticloud), disk, memory, fortianalyzer, forticloud, or none to not read the log.'
        - macro: '{$FGATE.CHG.NODATA}'
          value: '2h30m'
          description: Raise the no-data problem when no snapshot was collected for this long. The default allows one missed hourly collection.
        - macro: '{$FGATE.CHG.OBJECT.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
          description: 'Regular expression for objects that are not tracked, matched against "<table>:<key>", for example ^firewall\.address:SDN_ or ^firewall\.policy:(100|101)$. Changing it starts a new baseline.'
        - macro: '{$FGATE.CHG.SNAPSHOT.HISTORY}'
          value: '1d'
          description: 'History storage period of the fingerprint snapshots. Must be longer than {$FGATE.CHG.INTERVAL}; the comparison needs the previous snapshot.'
        - macro: '{$FGATE.CHG.TABLES}'
