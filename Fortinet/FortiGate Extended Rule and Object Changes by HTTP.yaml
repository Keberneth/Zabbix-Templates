zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: '41d23565286045a6855bdf9b7c52dc87'
      name: Templates/Network devices
  templates:
    - uuid: '45791399380e4bf7a461a837d01e065b'
      template: FortiGate Extended Rule and Object Changes by HTTP
      name: 'FortiGate Extended: Rule and Object Changes by HTTP'
      description: |
        Extension for the "FortiGate by HTTP" template. Detects changes to firewall policies, address objects, address groups (including members) and services through the FortiOS REST API, and raises an Information problem that names the changed objects. When the FortiGate config-change log can be read through the API, the problem also shows who made the change, from where, exactly when and which attributes changed. The template only reads from the FortiGate (GET requests).

        Setup:
        1. Link this template to a host that already has "FortiGate by HTTP". It reuses that template's connection macros ({$FGATE.API.FQDN}, {$FGATE.API.TOKEN}, {$FGATE.API.PORT}, {$FGATE.SCHEME}, {$FGATE.HTTP.PROXY}) and changes nothing in it.
        2. The REST API admin profile needs read access to Firewall and Log & Report. On multi-VDOM units the admin needs access to the tracked VDOMs; {$FGATE.CHG.VDOMS}=* lists them (needs global scope, otherwise set the VDOM names).
        3. Optional: add tables to {$FGATE.CHG.TABLES}, for example firewall/vip, firewall/vipgrp, firewall/local-in-policy, firewall/proxy-policy, firewall.schedule/recurring or firewall/ippool.

        How it works:
        - Every {$FGATE.CHG.INTERVAL} (default 1h) the script item "Change tracking: Get snapshot" reads the tracked tables of each VDOM and reduces every object to a fingerprint: its key, a content hash, one short hash per attribute group (source, destination, service, NAT, profiles, ...) and, for groups, the member names. Apart from names, members and the config-change log text, no configuration values are stored.
        - Per table, a calculated item compares the two latest snapshots and reports added, deleted, modified and moved (policy order) objects. The problem "<table> changed [<vdom>]: ..." has severity Information, resolves at the next check without changes and can be closed manually. Disable it for one table with {$FGATE.CHG.ALERT:"<table>"}=0, for example {$FGATE.CHG.ALERT:"firewall.address"}=0.
        - Config-change entries of the FortiGate system event log (log IDs 0100044544-0100044547) are read from {$FGATE.CHG.LOG.SOURCE} (default auto: disk, memory, FortiAnalyzer or FortiGate Cloud, whichever is enabled) and attached to the changed objects.
        - After a FortiOS upgrade only differences confirmed by the config-change log are reported, so attributes added by the new firmware do not raise false changes.
        - Warning problems: no snapshot collected for {$FGATE.CHG.NODATA}, and collector errors. Information problem: config-change log not readable.

        Limits:
        - Something changed and changed back between two checks is not reported as a change; it is visible in "Change tracking: Recent config changes (FortiGate log)".
        - Zabbix text values are limited to 64 KB, so big tables (roughly 2000+ objects) are split into several snapshot parts automatically. In the check where a table is split, that table is re-baselined instead of compared, and new parts start with a baseline.
        - Policy moves are detected within each snapshot part.

        History: snapshots are kept for {$FGATE.CHG.SNAPSHOT.HISTORY} (default 1d, needed for the comparison); change summaries, details and counts for {$FGATE.CHG.HISTORY} (default 7d).
      vendor:
        name: Keberneth
        version: '7.0.0.0'
      groups:
        - name: Templates/Network devices
      items:
        - uuid: c4a540403daf4205b00b5aac66b8a2f4
          name: 'Change tracking: Get snapshot'
          type: SCRIPT
          key: fgate.chg.get
          delay: '{$FGATE.CHG.INTERVAL}'
          history: '0'
          value_type: TEXT
          trends: '0'
          params: |
            /*
             * FortiGate rule & object change collector (Zabbix 7.0 Script item, ES5 / Duktape).
             *
             * Reads the monitored cmdb tables (policies, addresses, groups, services ...) for every
             * monitored VDOM, reduces every object to a short fingerprint and returns one JSON
             * document. The previous fingerprint is compared by the calculated "diff" items, so this
             * script keeps no state of its own. Config-change entries from the FortiGate system event
             * log (log id 0100044544-0100044547) are attached to the fingerprints so the change report
             * can say who changed what and exactly when.
             */
            var FMT = 'FGCHG1',
            	BUCKET_LIMIT = 60000,        // max UTF-8 bytes per fingerprint value (Zabbix text limit is 65535)
            	MAX_BUCKETS = 64,
            	LOG_BUCKET_LIMIT = 12000,    // max bytes of log lines stored with one fingerprint bucket
            	LOG_ATTR_LIMIT = 400,        // max length of one cfgattr value
            	RECENT_LIMIT = 60000,        // max size of the "recent changes" text
            	MEMBER_LIST_LIMIT = 700,     // group member lists longer than this are stored as count+hash
            	LOG_PAGE_ROWS = 500,
            	LOG_IDS = ['0100044544', '0100044545', '0100044546', '0100044547'];

            var params = JSON.parse(value),
            	started = Date.now(),
            	request = new HttpRequest(),
            	errors = [],
            	out = {
            		ts: Math.floor(started / 1000),
            		errors: '',
            		tables: [],
            		buckets: [],
            		fp: {},
            		count: {}
            	};

            /* ---------- small helpers ---------- */

            function isMacro(v) {
            	return typeof v !== 'string' || v === '' || v.indexOf('{' + '$') === 0;
            }

            function param(name, dflt) {
            	var v = params[name];
            	return isMacro(v) ? dflt : String(v).trim();
            }

            function esc(s) {
            	return String(s).replace(/%/g, '%25').replace(/\t/g, '%09').replace(/\n/g, '%0A')
            		.replace(/\r/g, '%0D').replace(/@/g, '%40').replace(/,/g, '%2C');
            }

            function utf8len(s) {
            	var n = 0, c, i;
            	for (i = 0; i < s.length; i++) {
            		c = s.charCodeAt(i);
            		if (c < 0x80) n += 1;
            		else if (c < 0x800) n += 2;
            		else if (c >= 0xD800 && c <= 0xDBFF) { n += 4; i++; }
            		else n += 3;
            	}
            	return n;
            }

            var B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';

            function sigChar(s) {
            	return B64.charAt(parseInt(md5(s).substring(0, 2), 16) & 63);
            }

            function bucketHash(key) {
            	return parseInt(md5(String(key)).substring(0, 7), 16);
            }

            function parseDuration(s, dflt) {
            	var m = /^(\d+)\s*([smhdw]?)$/.exec(String(s).trim());
            	if (!m) return dflt;
            	return parseInt(m[1], 10) * ({ '': 1, s: 1, m: 60, h: 3600, d: 86400, w: 604800 })[m[2]];
            }

            function regex(s, dflt) {
            	try {
            		return new RegExp(s);
            	}
            	catch (e) {
            		errors.push('Invalid regular expression "' + s + '": ' + e);
            		return dflt;
            	}
            }

            function addError(msg) {
            	errors.push(msg);
            	Zabbix.log(3, '[ FortiGate config change ] ' + msg);
            }

            /* canonical JSON: sorted keys, sorted arrays (FortiOS reference lists are sets), no q_* meta keys */
            function canon(v) {
            	var i, keys, parts;
            	if (v === null || typeof v !== 'object') return JSON.stringify(v);
            	if (Array.isArray(v)) {
            		parts = [];
            		for (i = 0; i < v.length; i++) parts.push(canon(v[i]));
            		parts.sort();
            		return '[' + parts.join(',') + ']';
            	}
            	keys = Object.keys(v).sort();
            	parts = [];
            	for (i = 0; i < keys.length; i++) {
            		if (keys[i].indexOf('q_') === 0) continue;
            		parts.push(JSON.stringify(keys[i]) + ':' + canon(v[keys[i]]));
            	}
            	return '{' + parts.join(',') + '}';
            }

            /* ---------- table registry ---------- */

            var POLICY_GROUPS = [
            	['name', /^name$/],
            	['status', /^status$/],
            	['action', /^(action|send-deny-packet)$/],
            	['srcintf', /^srcintf$/],
            	['dstintf', /^dstintf$/],
            	['source', /^(srcaddr|internet-service6?-src|src-vendor-mac|network-service-src|ztna-ems-tag)/],
            	['destination', /^(dstaddr|internet-service|network-service-dynamic|ztna-geo-tag)/],
            	['service', /^service/],
            	['schedule', /^schedule/],
            	['users', /^(users|groups|fsso-groups)$/],
            	['nat', /^(nat|ippool|poolname|natip|fixedport|permit-any-host|permit-stun-host|port-preserve|pcp-)/],
            	['profiles', /(-profile|-sensor|-list|^utm-status$|^profile-|^inspection-mode$|^webproxy-|^casb-|^virtual-patch)/],
            	['logging', /^(logtraffic|log-|custom-log-fields|capture-packet)/],
            	['comments', /^comments?$/]
            ];
            var ADDRESS_GROUPS = [
            	['comment', /^comments?$/],
            	['interface', /^(associated-interface|interface)$/],
            	['appearance', /^(color|tagging)$/]
            ];
            var GROUP_GROUPS = [
            	['members', /^member$/],
            	['exclude', /^(exclude|exclude-member)$/],
            	['comment', /^comments?$/],
            	['appearance', /^(color|tagging)$/]
            ];
            var SERVICE_GROUPS = [
            	['ports', /^(protocol|protocol-number|tcp-portrange|udp-portrange|sctp-portrange|icmptype|icmpcode|iprange|fqdn|proxy|helper)$/],
            	['category', /^category$/],
            	['comment', /^comments?$/],
            	['appearance', /^(color|tagging)$/]
            ];
            var GENERIC_GROUPS = [
            	['comment', /^comments?$/],
            	['appearance', /^(color|tagging)$/]
            ];

            var KNOWN = {
            	'firewall/policy':                 ['Firewall policy', 'policy'],
            	'firewall/security-policy':        ['Security policy', 'policy'],
            	'firewall/proxy-policy':           ['Proxy policy', 'policy'],
            	'firewall/local-in-policy':        ['Local-in policy', 'policy'],
            	'firewall/local-in-policy6':       ['Local-in policy (IPv6)', 'policy'],
            	'firewall/multicast-policy':       ['Multicast policy', 'policy'],
            	'firewall/central-snat-map':       ['Central SNAT', 'policy'],
            	'firewall/DoS-policy':             ['DoS policy', 'policy'],
            	'firewall/shaping-policy':         ['Shaping policy', 'policy'],
            	'firewall/address':                ['Address', 'address'],
            	'firewall/address6':               ['Address (IPv6)', 'address'],
            	'firewall/multicast-address':      ['Multicast address', 'address'],
            	'firewall/addrgrp':                ['Address group', 'group'],
            	'firewall/addrgrp6':               ['Address group (IPv6)', 'group'],
            	'firewall.service/custom':         ['Service', 'service'],
            	'firewall.service/group':          ['Service group', 'group'],
            	'firewall/vip':                    ['Virtual IP', 'vip'],
            	'firewall/vip6':                   ['Virtual IP (IPv6)', 'vip'],
            	'firewall/vipgrp':                 ['Virtual IP group', 'group'],
            	'firewall/vipgrp6':                ['Virtual IP group (IPv6)', 'group'],
            	'firewall/ippool':                 ['IP pool', 'address'],
            	'firewall/ippool6':                ['IP pool (IPv6)', 'address'],
            	'firewall.schedule/recurring':     ['Schedule (recurring)', 'generic'],
            	'firewall.schedule/onetime':       ['Schedule (one-time)', 'generic'],
            	'firewall.schedule/group':         ['Schedule group', 'group'],
            	'firewall/internet-service-custom':       ['Internet service (custom)', 'generic'],
            	'firewall/internet-service-custom-group': ['Internet service group (custom)', 'group']
            };

            function tableDef(path) {
            	var k = KNOWN[path], kind = k ? k[1] : (/polic|snat-map/.test(path) ? 'policy' : 'generic'),
            		groups = ({ policy: POLICY_GROUPS, address: ADDRESS_GROUPS, vip: ADDRESS_GROUPS, group: GROUP_GROUPS,
            			service: SERVICE_GROUPS, generic: GENERIC_GROUPS })[kind],
            		rest = ({ policy: 'other', address: 'value', vip: 'mapping', group: 'other', service: 'other',
            			generic: 'config' })[kind],
            		labels = [], i;

            	for (i = 0; i < groups.length; i++) labels.push(groups[i][0]);
            	labels.push(rest);

            	return {
            		path: path,
            		id: path.replace(/\//g, '.'),           // matches cfgpath in FortiGate config-change logs
            		name: k ? k[0] : path,
            		kind: kind,
            		ordered: kind === 'policy',
            		groups: groups,
            		labels: labels
            	};
            }

            /* ---------- FortiGate API ---------- */

            var apiBase;

            function api(path, query) {
            	var url = apiBase + path + (query ? '?' + query : ''), body, status, json = null, msg;

            	try {
            		body = request.get(url);
            	}
            	catch (e) {
            		throw 'request to ' + path + ' failed: ' + e;
            	}
            	status = request.getStatus();
            	Zabbix.log(5, '[ FortiGate config change ] GET ' + path + ' -> ' + status);

            	if (body !== null && body !== '') {
            		try {
            			json = JSON.parse(body);
            		}
            		catch (e) {
            			json = null;
            		}
            	}
            	if (status !== 200) {
            		msg = path + ' returned HTTP ' + status;
            		if (status === 401) msg += ' (check {' + '$FGATE.API.TOKEN} and the trusted hosts of the API admin)';
            		if (status === 403) msg += ' (the API admin profile is missing read permission or VDOM access)';
            		throw msg;
            	}
            	if (json === null || typeof json !== 'object') throw path + ' returned a response that is not JSON';
            	if (typeof json.status !== 'undefined' && json.status !== 'success') {
            		throw path + ' returned status "' + json.status + '"' +
            			(typeof json.error !== 'undefined' ? ' (error ' + json.error + ')' : '');
            	}
            	return json;
            }

            /* ---------- configuration ---------- */

            var fwVersion = '', ignore = {}, objectExclude, tables = [], vdoms = [];

            function init() {
            	var scheme = param('scheme', 'https'), fqdn = param('fqdn', ''), port = param('port', '443'),
            		token = param('token', ''), proxy = param('http_proxy', ''), list, i;

            	if (fqdn === '') throw 'Set the {' + '$FGATE.API.FQDN} macro (provided by the FortiGate by HTTP template or the host).';
            	if (token === '') throw 'Set the {' + '$FGATE.API.TOKEN} macro (provided by the FortiGate by HTTP template or the host).';

            	if (proxy !== '') request.setProxy(proxy);
            	request.addHeader('Accept: application/json');
            	request.addHeader('Authorization: Bearer ' + token);
            	apiBase = scheme + '://' + fqdn + ':' + port;

            	list = param('ignore_attrs', '').split(',');
            	for (i = 0; i < list.length; i++) {
            		if (list[i].trim() !== '') ignore[list[i].trim()] = true;
            	}
            	objectExclude = regex(param('object_not_matches', ''), null);
            	if (param('object_not_matches', '') === '') objectExclude = null;

            	/* the comparison needs the previous snapshot: warn about settings that make it impossible */
            	var interval = parseDuration(param('interval', '1h'), 0), keep = parseDuration(param('snapshot_history', '1d'), 0);
            	if (interval > 0 && keep > 0 && keep < 2 * interval) {
            		errors.push('{' + '$FGATE.CHG.SNAPSHOT.HISTORY} must be at least twice {' + '$FGATE.CHG.INTERVAL}, otherwise changes cannot be compared.');
            	}
            	if (interval > 0 && parseDuration(param('log_lookback', '24h'), 86400) < interval) {
            		errors.push('{' + '$FGATE.CHG.LOG.LOOKBACK} is shorter than {' + '$FGATE.CHG.INTERVAL}: some config-change log entries will be missed.');
            	}

            	list = param('tables', 'firewall/policy').split(',');
            	for (i = 0; i < list.length; i++) {
            		var p = list[i].trim().replace(/^\/+|\/+$/g, '').replace(/^api\/v2\/cmdb\//, '');
            		if (p !== '') tables.push(tableDef(p));
            	}
            }

            function loadVdoms() {
            	var spec = param('vdoms', '*'), inc = regex(param('vdom_matches', '.*'), /.*/),
            		exc = regex(param('vdom_not_matches', '^vsys_'), /^vsys_/), names = [], res, i;

            	if (spec === '*') {
            		try {
            			res = api('/api/v2/cmdb/system/vdom', 'format=name').results || [];
            			for (i = 0; i < res.length; i++) {
            				if (res[i] && typeof res[i].name === 'string') names.push(res[i].name);
            			}
            		}
            		catch (e) {
            			addError('Cannot list VDOMs (' + e + '); using "root". Set {' + '$FGATE.CHG.VDOMS} to the VDOM names to monitor.');
            		}
            		if (names.length === 0) names = ['root'];
            	}
            	else {
            		names = spec.split(',');
            	}
            	for (i = 0; i < names.length; i++) {
            		var n = names[i].trim();
            		if (n !== '' && inc.test(n) && !exc.test(n) && vdoms.indexOf(n) === -1) vdoms.push(n);
            	}
            	if (vdoms.length === 0) throw 'No VDOM left to monitor after applying {' + '$FGATE.CHG.VDOM.MATCHES} / {' + '$FGATE.CHG.VDOM.NOT_MATCHES}.';
            }

            /* ---------- config-change log ---------- */

            var log = { status: 2, source: 'none', message: 'disabled by {' + '$FGATE.CHG.LOG.SOURCE}', entries: 0 },
            	logByTable = {},     // "vdom|tableid" -> [entry]
            	recent = [];

            function logEpoch(e) {
            	var t = Number(e.eventtime), m;
            	if (!(t > 0) && e._metadata) t = Number(e._metadata.timestamp);
            	if (t > 1e17) t = t / 1e9;
            	else if (t > 1e14) t = t / 1e6;
            	else if (t > 1e11) t = t / 1e3;
            	if (!(t > 0) && typeof e.date === 'string' && typeof e.time === 'string') {
            		m = /^(\d{4})-(\d\d)-(\d\d)$/.exec(e.date);
            		var tm = /^(\d\d):(\d\d):(\d\d)$/.exec(e.time);
            		if (m && tm) {
            			t = Date.UTC(+m[1], +m[2] - 1, +m[3], +tm[1], +tm[2], +tm[3]) / 1000 - tzMinutes(e.tz) * 60;
            		}
            	}
            	return t > 0 ? Math.floor(t) : 0;
            }

            function tzMinutes(tz) {
            	var m = /^([+-])(\d\d):?(\d\d)$/.exec(String(tz || ''));
            	return m ? (m[1] === '-' ? -1 : 1) * (parseInt(m[2], 10) * 60 + parseInt(m[3], 10)) : 0;
            }

            function logQuery(device, vdom, sinceMs, maxRows, withFilters) {
            	var path = '/api/v2/log/' + device + '/event/system', rows = [], start = 0, page, r, q, waited, sid;

            	while (rows.length < maxRows) {
            		page = Math.min(LOG_PAGE_ROWS, maxRows - rows.length);
            		q = 'vdom=' + encodeURIComponent(vdom) + '&start=' + start + '&rows=' + page;
            		if (withFilters) {
            			q += '&filter=' + encodeURIComponent('_metadata.timestamp>=' + sinceMs) +
            				'&filter=' + encodeURIComponent('logid==' + LOG_IDS.join(',logid=='));
            		}
            		r = api(path, q);
            		/* FortiAnalyzer / FortiGate Cloud searches run asynchronously: poll with the session id */
            		waited = 0;
            		while (typeof r.session_id !== 'undefined' && typeof r.completed !== 'undefined' &&
            				Number(r.completed) < 100 && waited < 20) {
            			sid = r.session_id;
            			Zabbix.sleep(1000);
            			waited++;
            			r = api(path, q + '&session_id=' + encodeURIComponent(sid));
            		}
            		if (!Array.isArray(r.results)) throw path + ' returned no results array';
            		rows = rows.concat(r.results);
            		if (r.results.length < page) break;
            		start += r.results.length;
            	}
            	return rows;
            }

            function logDevices(spec) {
            	var order = ['disk', 'memory', 'fortianalyzer', 'forticloud'],
            		setting = { disk: 'log.disk/setting', memory: 'log.memory/setting',
            			fortianalyzer: 'log.fortianalyzer/setting', forticloud: 'log.fortiguard/setting' },
            		enabled = [], unknown = [], i, r, st;

            	if (spec !== 'auto') return [spec];
            	for (i = 0; i < order.length; i++) {
            		try {
            			r = api('/api/v2/cmdb/' + setting[order[i]], '');
            			st = r.results;
            			if (Array.isArray(st)) st = st[0];
            			if (st && st.status === 'enable') enabled.push(order[i]);
            		}
            		catch (e) {
            			if (order[i] === 'disk' || order[i] === 'memory') unknown.push(order[i]);
            		}
            	}
            	return enabled.concat(unknown).length > 0 ? enabled.concat(unknown) : ['memory', 'disk'];
            }

            function loadLogs() {
            	var spec = param('log_source', 'auto').toLowerCase(), lookback = parseDuration(param('log_lookback', '24h'), 86400),
            		maxRows = parseInt(param('log_maxrows', '1000'), 10) || 1000, since = out.ts - lookback,
            		devices, d, v, rows, used = null, lastErr = '', i, k, e, ids = {}, paths = {}, t;

            	if (spec === 'none' || spec === 'off' || spec === '0') return;
            	if (['auto', 'disk', 'memory', 'fortianalyzer', 'forticloud'].indexOf(spec) === -1) {
            		log = { status: 0, source: spec, message: 'unknown log source "' + spec + '"', entries: 0 };
            		return;
            	}
            	for (i = 0; i < LOG_IDS.length; i++) ids[LOG_IDS[i]] = true;
            	for (i = 0; i < tables.length; i++) paths[tables[i].id] = tables[i];

            	devices = logDevices(spec);
            	log = { status: 0, source: devices.join('/'), message: '', entries: 0 };

            	var seen = {}, failed = [];
            	for (v = 0; v < vdoms.length; v++) {
            		rows = null;
            		for (d = 0; d < devices.length && rows === null; d++) {
            			if (used !== null && devices[d] !== used) continue;
            			try {
            				rows = logQuery(devices[d], vdoms[v], since * 1000, maxRows, true);
            			}
            			catch (e1) {
            				try {
            					/* older builds may reject the filters: fetch the newest rows and filter here */
            					rows = logQuery(devices[d], vdoms[v], since * 1000, maxRows, false);
            				}
            				catch (e2) {
            					lastErr = String(e2);
            					rows = null;
            				}
            			}
            			if (rows !== null) used = devices[d];
            		}
            		if (rows === null) {
            			failed.push(vdoms[v]);
            			continue;
            		}
            		for (i = 0; i < rows.length; i++) {
            			e = rows[i];
            			if (!e || typeof e !== 'object') continue;
            			if (typeof e.logid !== 'undefined' && !ids[String(e.logid)] &&
            					!ids['0' + String(e.logid)] && !ids[('000' + String(e.logid)).slice(-10)]) continue;
            			if (typeof e.cfgpath !== 'string' || !paths[e.cfgpath]) continue;
            			/* some units log VDOM changes in the management VDOM: attribute entries by their "vd" field */
            			var vd = typeof e.vd === 'string' && e.vd !== '' ? e.vd : vdoms[v];
            			if (vdoms.indexOf(vd) === -1) continue;
            			t = logEpoch(e);
            			if (t !== 0 && t < since) continue;
            			k = [e.eventtime, e.cfgtid, vd, e.cfgpath, e.cfgobj, e.action, e.cfgattr].join('|');
            			if (seen[k]) continue;
            			seen[k] = true;
            			var entry = {
            				time: t,
            				tz: typeof e.tz === 'string' ? e.tz : '',
            				vdom: vd,
            				path: e.cfgpath,
            				key: typeof e.cfgobj === 'undefined' ? '' : String(e.cfgobj),
            				action: String(e.action || e.logdesc || ''),
            				user: String(e.user || ''),
            				ui: String(e.ui || ''),
            				attr: String(typeof e.cfgattr === 'undefined' ? '' : e.cfgattr).substring(0, LOG_ATTR_LIMIT)
            			};
            			k = vd + '|' + e.cfgpath;
            			if (!logByTable[k]) logByTable[k] = [];
            			logByTable[k].push(entry);
            			recent.push(entry);
            		}
            	}
            	recent.sort(function (a, b) { return b.time - a.time; });
            	log = { status: failed.length ? 0 : 1, source: used || devices.join('/'), entries: recent.length,
            		message: failed.length ? 'cannot read the system event log' + (vdoms.length > 1 ? ' of VDOM ' + failed.join(', ') : '') +
            			': ' + lastErr : 'ok' };
            }

            function fmtTime(t, tz) {
            	var off = tz ? tzMinutes(tz) : -new Date(t * 1000).getTimezoneOffset(),
            		d = new Date((t + off * 60) * 1000);
            	function p(n) { return (n < 10 ? '0' : '') + n; }
            	return d.getUTCFullYear() + '-' + p(d.getUTCMonth() + 1) + '-' + p(d.getUTCDate()) + ' ' +
            		p(d.getUTCHours()) + ':' + p(d.getUTCMinutes()) + ':' + p(d.getUTCSeconds()) +
            		(tz ? ' ' + tz : '');
            }

            function recentText() {
            	var lines = [], size = 0, i, e, line;
            	for (i = 0; i < recent.length; i++) {
            		e = recent[i];
            		line = fmtTime(e.time, e.tz) + ' [' + e.vdom + '] ' + e.path + (e.key !== '' ? ' ' + e.key : '') + ': ' +
            			e.action + ' by ' + (e.user || '?') + (e.ui ? ' via ' + e.ui : '') + (e.attr ? ' - ' + e.attr : '');
            		size += utf8len(line) + 1;
            		if (size > RECENT_LIMIT) {
            			lines.push('... ' + (recent.length - i) + ' older entries not shown');
            			break;
            		}
            		lines.push(line);
            	}
            	return lines.join('\n');
            }

            /* ---------- fingerprints ---------- */

            function objectKey(o) {
            	if (typeof o.q_origin_key !== 'undefined') return String(o.q_origin_key);
            	if (typeof o.policyid !== 'undefined') return String(o.policyid);
            	if (typeof o.name !== 'undefined') return String(o.name);
            	if (typeof o.id !== 'undefined') return String(o.id);
            	return null;
            }

            function memberExtra(o) {
            	var m = o.member, names = [], i, s;
            	if (!Array.isArray(m)) return '';
            	for (i = 0; i < m.length; i++) {
            		names.push(esc(m[i] && typeof m[i] === 'object' ? (m[i].name !== undefined ? m[i].name : objectKey(m[i])) : m[i]));
            	}
            	names.sort();
            	s = names.join(',');
            	return s.length <= MEMBER_LIST_LIMIT ? s : '#' + names.length + ':' + md5(s).substring(0, 8);
            }

            function fingerprint(def, o) {
            	var keys = Object.keys(o).sort(), all = [], parts = [], g, i, k, s, sig = '';

            	for (g = 0; g < def.labels.length; g++) parts.push([]);
            	for (i = 0; i < keys.length; i++) {
            		k = keys[i];
            		if (k.indexOf('q_') === 0 || ignore[k]) continue;
            		s = JSON.stringify(k) + ':' + canon(o[k]);
            		all.push(s);
            		for (g = 0; g < def.groups.length; g++) {
            			if (def.groups[g][1].test(k)) break;
            		}
            		parts[g].push(s);
            	}
            	for (g = 0; g < parts.length; g++) sig += sigChar(parts[g].join(','));
            	return { hash: md5(all.join(',')).substring(0, 10), sig: sig };
            }

            function collectTable(vdom, def) {
            	var r = api('/api/v2/cmdb/' + def.path, 'vdom=' + encodeURIComponent(vdom) + '&exclude-default-values=1&skip=1'),
            		res = r.results, entries = [], seen = {}, i, o, key, fp, line, label;

            	if (!Array.isArray(res)) throw def.path + ' did not return a table (check the path in {' + '$FGATE.CHG.TABLES})';
            	if (typeof r.version === 'string' && fwVersion === '') fwVersion = r.version + (r.build ? ' build' + r.build : '');

            	for (i = 0; i < res.length; i++) {
            		o = res[i];
            		if (!o || typeof o !== 'object') continue;
            		key = objectKey(o);
            		if (key === null || seen[key]) continue;
            		if (objectExclude !== null && objectExclude.test(def.id + ':' + key)) continue;
            		seen[key] = true;
            		fp = fingerprint(def, o);
            		label = def.kind === 'policy' && typeof o.name === 'string' ? o.name : '';
            		line = esc(key) + '\t' + fp.hash + '\t' + fp.sig + '\t' + esc(label) + '\t' +
            			(def.kind === 'group' ? memberExtra(o) : '');
            		entries.push({ key: key, line: line, size: utf8len(line) + 1, bh: bucketHash(key) });
            	}
            	return entries;
            }

            function logLine(e) {
            	return 'L\t' + e.time + '\t' + esc(e.tz) + '\t' + esc(e.key) + '\t' + esc(e.action) + '\t' +
            		esc(e.user) + '\t' + esc(e.ui) + '\t' + esc(e.attr);
            }

            function packTable(vdom, def, entries, cfgsig) {
            	var logs = (logByTable[vdom + '|' + def.id] || []).slice(0), n = 1, buckets, i, b, size, ok,
            		tableHash, header, text;

            	logs.sort(function (a, b2) { return b2.time - a.time; });
            	for (i = 0; i < logs.length; i++) {
            		logs[i].line = logLine(logs[i]);
            		logs[i].size = utf8len(logs[i].line) + 1;
            		logs[i].bh = bucketHash(logs[i].key);
            	}
            	tableHash = md5(entries.map(function (x) { return x.line; }).join('\n')).substring(0, 10);

            	for (;;) {
            		buckets = [];
            		for (b = 0; b < n; b++) buckets.push({ lines: [], size: 300, logs: [], logSize: 0 });
            		for (i = 0; i < entries.length; i++) {
            			b = buckets[entries[i].bh & (n - 1)];
            			b.lines.push(entries[i].line);
            			b.size += entries[i].size;
            		}
            		for (i = 0; i < logs.length; i++) {
            			b = buckets[logs[i].bh & (n - 1)];
            			if (b.logSize + logs[i].size <= LOG_BUCKET_LIMIT) {
            				b.logs.push(logs[i].line);
            				b.logSize += logs[i].size;
            			}
            		}
            		ok = true;
            		for (b = 0; b < n; b++) {
            			if (buckets[b].size + buckets[b].logSize > BUCKET_LIMIT) ok = false;
            		}
            		if (ok || n >= MAX_BUCKETS) break;
            		n *= 2;
            	}
            	if (!ok) addError(def.name + ' [' + vdom + '] is too large for ' + MAX_BUCKETS + ' fingerprint buckets; some objects are not tracked.');

            	for (b = 0; b < n; b++) {
            		header = [FMT, out.ts, esc(vdom), esc(def.id), b + '/' + n, esc(fwVersion), cfgsig, entries.length,
            			tableHash, def.ordered ? 1 : 0, def.labels.join(','), esc(def.name)].join('\t');
            		text = header + '\n' + buckets[b].lines.join('\n') + '\n@LOG\n' + buckets[b].logs.join('\n');
            		if (utf8len(text) > 65000) text = text.substring(0, 60000);   /* never exceed the Zabbix text limit */
            		out.fp[vdom + '|' + def.id + '|' + b] = text;
            		out.buckets.push({
            			'{#VDOM}': vdom, '{#TABLE}': def.id, '{#TABLE.NAME}': def.name, '{#BUCKET}': String(b), '{#BUCKETS}': String(n),
            			'{#PART}': n > 1 ? ' part ' + (b + 1) + '/' + n : ''
            		});
            	}
            	out.tables.push({
            		'{#VDOM}': vdom, '{#TABLE}': def.id, '{#TABLE.NAME}': def.name, '{#TABLE.PATH}': def.path, '{#BUCKETS}': String(n)
            	});
            	out.count[vdom + '|' + def.id] = entries.length;
            }

            /* ---------- main ---------- */

            var okTables = 0, failedTables = 0, objects = 0;

            try {
            	init();
            	loadVdoms();

            	var collected = [], v, t, ignoreList = Object.keys(ignore).sort().join(','), cfgsig;
            	cfgsig = md5(FMT + '|' + ignoreList + '|' + param('object_not_matches', '')).substring(0, 8);

            	for (v = 0; v < vdoms.length; v++) {
            		for (t = 0; t < tables.length; t++) {
            			try {
            				collected.push({ vdom: vdoms[v], def: tables[t], entries: collectTable(vdoms[v], tables[t]) });
            				okTables++;
            			}
            			catch (e) {
            				failedTables++;
            				addError(tables[t].name + ' [' + vdoms[v] + ']: ' + e);
            			}
            		}
            	}

            	if (okTables > 0) {
            		try {
            			loadLogs();
            		}
            		catch (e) {
            			log = { status: 0, source: log.source, message: String(e), entries: 0 };
            			logByTable = {};
            			recent = [];
            		}
            		for (v = 0; v < collected.length; v++) {
            			packTable(collected[v].vdom, collected[v].def, collected[v].entries, cfgsig);
            			objects += collected[v].entries.length;
            		}
            	}
            }
            catch (e) {
            	addError(String(e));
            }

            if (okTables > 0) {
            	out.lastok = out.ts;
            	out.objects = objects;
            	out.recent = recentText();
            }
            else {
            	delete out.tables;
            	delete out.buckets;
            }
            out.ok_tables = okTables;
            out.failed_tables = failedTables;
            out.fwversion = fwVersion;
            log.info = log.status === 2 ? 'disabled' : log.source + ': ' + log.message +
            	(log.status === 1 ? ' (' + log.entries + ' change entries in the last ' + param('log_lookback', '24h') + ')' : '');
            out.log = log;
            out.vdoms = vdoms.join(',');
            out.errors = errors.join('\n');
            out.duration = Math.round((Date.now() - started) / 100) / 10;

            return JSON.stringify(out);
          description: Reads the monitored firewall tables of every monitored VDOM and the config-change log from the FortiOS REST API and returns the fingerprint snapshot used by the change items.
