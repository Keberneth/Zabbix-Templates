          manual_close: 'YES'
          tags:
          - tag: scope
            value: capacity
      - uuid: e7049117ec5f4ffeb7c4eb097911a147
        name: 'FortiSwitch [{#SWNAME}]: {#PORT}: Outbound dropped packets'
        type: DEPENDENT
        key: fgsw.port.tx_drops[{#SWKEY},{#PORT}]
        delay: '0'
        description: Outbound dropped packets counter.
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.data[?(@.key == "{#SWKEY}")].ports.{#PORT}.tx_drops.first()
          error_handler: CUSTOM_VALUE
          error_handler_params: '0'
        master_item:
          key: fgsw.switches.get_data
        tags:
        - tag: component
          value: port
        - tag: port
          value: '{#PORT}'
        - tag: switch
          value: '{#SWNAME}'
        - tag: switch_group
          value: '{#SWGROUP}'
      - uuid: e0352be291824ab28291aaa9db0fefb3
        name: 'FortiSwitch [{#SWNAME}]: {#PORT}: Outbound packets with errors'
        type: DEPENDENT
        key: fgsw.port.tx_errors[{#SWKEY},{#PORT}]
        delay: '0'
        description: Outbound packet error counter.
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.data[?(@.key == "{#SWKEY}")].ports.{#PORT}.tx_errors.first()
          error_handler: CUSTOM_VALUE
          error_handler_params: '0'
        master_item:
          key: fgsw.switches.get_data
        tags:
        - tag: component
          value: port
        - tag: port
          value: '{#PORT}'
        - tag: switch
          value: '{#SWNAME}'
        - tag: switch_group
          value: '{#SWGROUP}'
        trigger_prototypes:
        - uuid: c7f57a25492d4c8ca8e0f7238e7d0e85
          expression: min(/FortiSwitch by FortiGate HTTP/fgsw.port.tx_errors[{#SWKEY},{#PORT}],4m)>{$FGATE.SW.PORT.SEND.ERRORS.WARN}
          name: 'FortiSwitch [{#SWNAME}]: {#PORT}: High send error rate'
          priority: WARNING
          description: Outbound packet errors above the threshold sustained for at least 4 minutes.
          tags:
          - tag: scope
            value: errors
      master_item:
        key: fgsw.switches.get_data
      lld_macro_paths:
      - lld_macro: '{#PORT}'
        path: $.port
      - lld_macro: '{#SWGROUP}'
        path: $.switch_group
      - lld_macro: '{#SWKEY}'
        path: $.key
      - lld_macro: '{#SWNAME}'
        path: $.name
      - lld_macro: '{#SWSERIAL}'
        path: $.serial
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data
      - type: JAVASCRIPT
        parameters:
        - "var result = [];\nJSON.parse(value).forEach(function (sw) {\n    var ports = sw.ports || {};\n    Object.keys(ports).forEach(function (pn) {\n        var p = ports[pn] || {};\n        var ls = (p.link_status ? String(p.link_status) : '').toLowerCase();\n        if (ls === 'down' || ls === 'disconnected' || ls === 'disabled' || ls === 'no_link') {\n            return;\n        }\n        result.push({\n            \"key\": sw.key,\n            \"name\": sw.name,\n            \"serial\": sw.serial,\n            \"switch_group\": sw.switch_group,\n            \"port\": pn\n        });\n    });\n});\nreturn JSON.stringify(result);\n"
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 6h
      graph_prototypes:
      - uuid: c9b41628c0dc4d33815c5deab9366cef
