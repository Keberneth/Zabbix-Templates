            - uuid: 84e45afc920e4cdb913627dbd1454c52
              name: 'FortiSwitch [{#SWNAME}]: {#PORT}: Bits sent'
              type: DEPENDENT
              key: 'fgsw.port.tx_bps[{#SWKEY},{#PORT}]'
              delay: '0'
              units: bps
              description: 'Outbound traffic rate on this port.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.data[?(@.key == "{#SWKEY}")].ports.{#PORT}.tx_bytes.first()'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              master_item:
                key: fgsw.switches.get_data
              tags:
                - tag: component
                  value: port
                - tag: port
                  value: '{#PORT}'
                - tag: switch
                  value: '{#SWNAME}'
                - tag: switch_group
                  value: '{#SWGROUP}'
              trigger_prototypes:
                - uuid: 9bf889ff609b456aa8abf21163089d0f
                  expression: 'last(/FortiSwitch by FortiGate HTTP/fgsw.port.tx_bps[{#SWKEY},{#PORT}]) > ({$FGATE.SW.PORT.SPEED.MAX:"{#PORT}"} * 1000000 * 0.8)'
                  name: 'FortiSwitch [{#SWNAME}]: {#PORT}: High bandwidth usage send (>80%)'
                  priority: WARNING
                  description: 'Outbound traffic exceeds 80% of the configured port speed.'
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: capacity
            - uuid: e7049117ec5f4ffeb7c4eb097911a147
              name: 'FortiSwitch [{#SWNAME}]: {#PORT}: Outbound dropped packets'
              type: DEPENDENT
              key: 'fgsw.port.tx_drops[{#SWKEY},{#PORT}]'
              delay: '0'
              description: 'Outbound dropped packets counter. Counter normalized to a per-second rate by preprocessing.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.data[?(@.key == "{#SWKEY}")].ports.{#PORT}.tx_drops.first()'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
              master_item:
                key: fgsw.switches.get_data
              tags:
                - tag: component
                  value: port
                - tag: port
                  value: '{#PORT}'
                - tag: switch
                  value: '{#SWNAME}'
                - tag: switch_group
                  value: '{#SWGROUP}'
              trigger_prototypes:
                - uuid: a46e46d103424909a576f063cb0cac3e
                  expression: 'min(/FortiSwitch by FortiGate HTTP/fgsw.port.tx_drops[{#SWKEY},{#PORT}],4m)>{$FGATE.SW.PORT.DROPS.WARN:"{#PORT}"}'
                  name: 'FortiSwitch [{#SWNAME}]: {#PORT}: High send drop rate'
                  opdata: 'TX drops/s: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: 'Sustained outbound packet drop rate is above the configured threshold.'
                  tags:
                    - tag: scope
                      value: performance
            - uuid: e0352be291824ab28291aaa9db0fefb3
              name: 'FortiSwitch [{#SWNAME}]: {#PORT}: Outbound packets with errors'
              type: DEPENDENT
              key: 'fgsw.port.tx_errors[{#SWKEY},{#PORT}]'
              delay: '0'
              description: 'Outbound packet error counter. Counter normalized to a per-second rate by preprocessing.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.data[?(@.key == "{#SWKEY}")].ports.{#PORT}.tx_errors.first()'
                  error_handler: CUSTOM_VALUE
