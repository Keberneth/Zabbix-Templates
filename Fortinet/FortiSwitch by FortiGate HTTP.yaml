zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 14e7de6aeadf4cdb95fc052ac19cda0f
    name: Fortinet Office Network
  - uuid: 52ef8af8c6734325a48f2318366b1786
    name: Templates/Network devices
  templates:
  - uuid: 3dfc5ac9a74e4269bf29ab7783a33cbc
    template: FortiSwitch by FortiGate HTTP
    name: FortiSwitch by FortiGate HTTP
    description: |-
      Starter template for monitoring FortiSwitch devices that are managed by a FortiGate controller.

      This template is intended to be linked to the same FortiGate host that already uses your FortiGate by HTTP template.
      It reuses the same controller-side macros:
      - {$FGATE.API.FQDN}
      - {$FGATE.API.PORT}
      - {$FGATE.API.TOKEN}
      - {$FGATE.SCHEME}
      - {$FGATE.DATA.TIMEOUT}
      - {$FGATE.HTTP.PROXY}

      The template uses the FortiGate REST API to query managed FortiSwitch inventory and status. Because Fortinet's public
      documentation exposes the endpoint families but not every field for every FortiOS build, the master JavaScript item
      normalizes several common field names to improve compatibility across versions.
    vendor:
      name: Keberneth
      version: '7.0.0'
    groups:
    - name: Fortinet Office Network
    - name: Templates/Network devices
    items:
    - uuid: 6836c66e19374f409498055fca40a172
      name: Get managed FortiSwitch data
      type: SCRIPT
      key: fgsw.switches.get_data
      delay: 5m
      history: '0'
      value_type: TEXT
      trends: '0'
      params: |-
        var params = JSON.parse(value),
            request = new HttpRequest(),
            result = {"ok": 0, "data": [], "error": ""},
            api_url = "",
            error_msg = "";

        function safeText(v) {
            return (typeof v === 'undefined' || v === null) ? '' : String(v);
        }

        function first(obj, keys, def) {
            var i, key;
            if (typeof obj !== 'object' || obj === null) {
                return def;
            }
            for (i = 0; i < keys.length; i++) {
                key = keys[i];
                if (typeof obj[key] !== 'undefined' && obj[key] !== null && obj[key] !== '') {
                    return obj[key];
                }
            }
            return def;
        }

        function safeInt(v, def) {
            var n = Number(v);
            return isNaN(n) ? def : Math.floor(n);
        }

        function arrify(response) {
            var r, out;
            if (typeof response !== 'object' || response === null) {
                return [];
            }

            r = response.results;

            if (Array.isArray(r)) {
                return r;
            }

            if (typeof r === 'object' && r !== null) {
                out = [];
                Object.keys(r).forEach(function (k) {
                    var item = r[k];
                    if (typeof item !== 'object' || item === null) {
                        item = {"value": item};
                    }
                    if (typeof item.__key === 'undefined') {
                        item.__key = k;
                    }
                    out.push(item);
                });
                return out;
            }

            return [];
        }

        function getHttpData(url) {
            var response;

            response = request.get(url);
            Zabbix.log(4, '[ FortiSwitch by FortiGate HTTP ] [ ' + url + ' ] Received response with status code ' + request.getStatus() + ': ' + response);

            if (request.getStatus() !== 200) {
                throw 'Failed to receive data: invalid response status code ' + request.getStatus() + '.';
            }

            if (response !== null && response !== '') {
                try {
                    response = JSON.parse(response);
                }
                catch (error) {
                    throw 'Failed to parse response received from FortiGate API.';
                }
            }

            if (typeof response !== 'object' || response === null) {
                throw 'Cannot process response data: received data is not an object.';
            }

            return response;
        }

        function switchAliases(v) {
            return [
                safeText(first(v, ['serial', 'sn', 'switch_id', 'switch-id', 'q_origin_key', '__key', 'id'], '')),
                safeText(first(v, ['name', 'switch_name', 'switch-name', 'hostname'], ''))
            ];
        }

        function runtimeState(v) {
            var raw = safeText(first(v, [
                'connection_state',
                'connection-state',
                'connection',
                'state',
                'fortilink_status',
                'fortilink-status',
                'conn_status',
                'link',
                'status'
            ], ''));
            var s = raw.toLowerCase();

            if (['up', 'connected', 'online', 'true', '1', 'ok', 'healthy'].indexOf(s) !== -1) {
                return {"num": 1, "raw": raw};
            }

            if (['down', 'disconnected', 'offline', 'false', '0', 'error', 'failed', 'lost'].indexOf(s) !== -1) {
                return {"num": 0, "raw": raw};
            }

            return {"num": 2, "raw": raw === '' ? 'unknown' : raw};
        }

        function portCount(v) {
            var fields = ['port_total', 'ports_total', 'port_count', 'ports_count', 'max_ports'];
            var ports = first(v, ['ports', 'interfaces'], null);
            var i, n;

            for (i = 0; i < fields.length; i++) {
                n = Number(v[fields[i]]);
                if (!isNaN(n)) {
                    return Math.floor(n);
                }
            }

            if (Array.isArray(ports)) {
                return ports.length;
            }

            if (typeof ports === 'object' && ports !== null) {
                return Object.keys(ports).length;
            }

            return 0;
        }

        try {
            ['scheme', 'api.token', 'api.fqdn', 'api.port'].forEach(function (field) {
                var macro = '{$FGATE.' + field.toUpperCase() + '}';
                var key = field.split('.').pop();

                if (typeof params[key] === 'undefined') {
                    throw 'Please set "' + key + '" script input parameter to ' + macro + ' macro value.';
                }

                if (params[key] === macro || params[key] === '') {
                    throw 'Please change ' + macro + ' macro to the proper value.';
                }
            });

            if (typeof params.http_proxy !== 'undefined' && params.http_proxy !== '{' + '$FGATE.HTTP.PROXY}' && params.http_proxy !== '') {
                request.setProxy(params.http_proxy);
            }

            api_url = params.scheme + '://' + params.fqdn + ':' + params.port;

            var monitor_resp = null,
                cmdb_resp = null,
                devices = {},
                alias_to_key = {},
                partial_errors = [];

            try {
                monitor_resp = getHttpData(
                    api_url + '/api/v2/monitor/switch-controller/managed-switch?access_token=' + encodeURIComponent(params.token)
                );
            }
            catch (error) {
                partial_errors.push('monitor endpoint failed: ' + error);
            }

            try {
                cmdb_resp = getHttpData(
                    api_url + '/api/v2/cmdb/switch-controller/managed-switch?access_token=' + encodeURIComponent(params.token)
                );
            }
            catch (error) {
                partial_errors.push('cmdb endpoint failed: ' + error);
            }

            if (monitor_resp === null && cmdb_resp === null) {
                throw partial_errors.join(' ');
            }

            function resolveKey(v) {
                var aliases = switchAliases(v),
                    key = '',
                    i;

                for (i = 0; i < aliases.length; i++) {
                    if (aliases[i] !== '' && typeof alias_to_key[aliases[i]] !== 'undefined') {
                        key = alias_to_key[aliases[i]];
                        break;
                    }
                }

                if (key === '') {
                    key = aliases[0] !== '' ? aliases[0] : aliases[1];
                }

                if (key === '') {
                    return '';
                }

                for (i = 0; i < aliases.length; i++) {
                    if (aliases[i] !== '') {
                        alias_to_key[aliases[i]] = key;
                    }
                }

                return key;
            }

            arrify(cmdb_resp || {}).forEach(function (item) {
                var key;
                if (typeof item !== 'object' || item === null) {
                    return;
                }

                key = resolveKey(item);
                if (key === '') {
                    return;
                }

                if (typeof devices[key] === 'undefined') {
                    devices[key] = {"cfg": {}, "mon": {}};
                }

                devices[key].cfg = item;
            });

            arrify(monitor_resp || {}).forEach(function (item) {
                var key;
                if (typeof item !== 'object' || item === null) {
                    return;
                }

                key = resolveKey(item);
                if (key === '') {
                    return;
                }

                if (typeof devices[key] === 'undefined') {
                    devices[key] = {"cfg": {}, "mon": {}};
                }

                devices[key].mon = item;
            });

            result.data = Object.keys(devices).map(function (k) {
                var merged = {},
                    cfg = devices[k].cfg || {},
                    mon = devices[k].mon || {},
                    state;

                Object.keys(cfg).forEach(function (x) {
                    merged[x] = cfg[x];
                });

                Object.keys(mon).forEach(function (x) {
                    merged[x] = mon[x];
                });

                state = runtimeState(merged);

                return {
                    "key": k,
                    "serial": safeText(first(merged, ['serial', 'sn', 'switch_id', 'switch-id', 'q_origin_key', 'id'], k)),
                    "name": safeText(first(merged, ['name', 'switch_name', 'switch-name', 'hostname'], k)),
                    "model": safeText(first(merged, ['model', 'model_name', 'fsw_model', 'platform', 'platform_str', 'product'], '')),
                    "ip": safeText(first(merged, ['ip', 'ip-address', 'mgmt_ip', 'management_ip', 'ipv4_address', 'ipv4-address'], '')),
                    "version": safeText(first(merged, ['version', 'os_ver', 'firmware', 'firmware_version'], '')),
                    "profile": safeText(first(merged, ['switch_profile', 'switch-profile', 'profile'], '')),
                    "state_raw": state.raw,
                    "state_num": state.num,
                    "port_total": portCount(merged),
                    "description": safeText(first(merged, ['description', 'comments'], ''))
                };
            });

            result.data.sort(function (a, b) {
                if (a.name < b.name) {
                    return -1;
                }
                if (a.name > b.name) {
                    return 1;
                }
                return 0;
            });

            result.ok = 1;
            if (partial_errors.length === 0) {
                result.error = '';
            }
        }
        catch (error) {
            error_msg = error.toString();
            error_msg += error_msg.endsWith('.') ? '' : '.';
            Zabbix.log(3, '[ FortiSwitch by FortiGate HTTP ] ERROR: ' + error_msg);
            result.error = error_msg;
        }

        return JSON.stringify(result);
      description: Item for gathering managed FortiSwitch inventory and status from the FortiGate API.
      timeout: '{$FGATE.DATA.TIMEOUT}'
      parameters:
      - name: fqdn
        value: '{$FGATE.API.FQDN}'
      - name: http_proxy
        value: '{$FGATE.HTTP.PROXY}'
      - name: port
        value: '{$FGATE.API.PORT}'
      - name: scheme
        value: '{$FGATE.SCHEME}'
      - name: token
        value: '{$FGATE.API.TOKEN}'
      tags:
      - tag: component
        value: raw
    - uuid: 99a54308bc814097b4b167bf283f6e37
      name: API availability status
      type: DEPENDENT
      key: fgsw.api.status
      delay: '0'
      description: Checking API availability by normalized response.
      valuemap:
        name: Service state
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.ok
        error_handler: CUSTOM_VALUE
        error_handler_params: '0'
      master_item:
        key: fgsw.switches.get_data
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: 947d83249fab46dd95576c8cf3b2181a
        expression: last(/FortiSwitch by FortiGate HTTP/fgsw.api.status)=0
        name: Unexpected response from API
        priority: AVERAGE
        description: Received an unexpected response from API. It may be unavailable or the endpoint may be unsupported by this FortiOS build.
        tags:
        - tag: scope
          value: availability
    - uuid: f0478d1d9a094b9fba9cff9b6fb593ac
      name: Master metric item errors
      type: DEPENDENT
      key: fgsw.data_errors
      delay: '0'
      value_type: TEXT
      history: '0'
      trends: '0'
      description: Item for gathering errors of the master metric.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.error
        error_handler: CUSTOM_VALUE
        error_handler_params: ''
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: fgsw.switches.get_data
      tags:
      - tag: component
        value: error
      triggers:
      - uuid: 8802c2c28e284bdea3079d6b665da904
        expression: length(last(/FortiSwitch by FortiGate HTTP/fgsw.data_errors))>0
        name: There are errors in the master metric
        priority: WARNING
        dependencies:
        - name: Unexpected response from API
          expression: last(/FortiSwitch by FortiGate HTTP/fgsw.api.status)=0
        tags:
        - tag: scope
          value: availability
    - uuid: 36115d0b14314cb59292110a2a09da9c
      name: Managed FortiSwitch count
      type: DEPENDENT
      key: fgsw.switch.count
      delay: '0'
      description: Number of FortiSwitch devices returned by the controller.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data.length()
        error_handler: CUSTOM_VALUE
        error_handler_params: '0'
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: fgsw.switches.get_data
    - uuid: 42de5962c0bc4c3aa2527223c69927a9
      name: Managed FortiSwitch connected
      type: DEPENDENT
      key: fgsw.switch.connected
      delay: '0'
      description: Number of managed FortiSwitch devices with a normalized state of up.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data
        error_handler: CUSTOM_VALUE
        error_handler_params: '[]'
      - type: JAVASCRIPT
        parameters:
        - |-
          var data = JSON.parse(value); return data.filter(function (v) { return Number(v.state_num) === 1; }).length;
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: fgsw.switches.get_data
    discovery_rules:
    - uuid: e7e892806a9541a784c67bc6b8bacb15
      name: Managed FortiSwitch discovery
      type: DEPENDENT
      key: fgsw.switch.discovery
      delay: '0'
      description: Discovery of FortiSwitch devices managed by the FortiGate.
      master_item:
        key: fgsw.switches.get_data
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 6h
      lld_macro_paths:
      - lld_macro: '{#SWKEY}'
        path: $.key
      - lld_macro: '{#SWSERIAL}'
        path: $.serial
      - lld_macro: '{#SWNAME}'
        path: $.name
      - lld_macro: '{#SWMODEL}'
        path: $.model
      - lld_macro: '{#SWIP}'
        path: $.ip
      item_prototypes:
      - uuid: d6ed6f8fee8a48e4a716bd9c77f10648
        name: 'FortiSwitch [{#SWNAME}]: Get data'
        type: DEPENDENT
        key: fgsw.switch.get_data[{#SWKEY}]
        delay: '0'
        history: '0'
        value_type: TEXT
        trends: '0'
        description: Item for gathering normalized data for the managed FortiSwitch.
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.data[?(@.key == "{#SWKEY}")].first()
          error_handler: DISCARD_VALUE
        master_item:
          key: fgsw.switches.get_data
        tags:
        - tag: component
          value: raw
      - uuid: e874ce55686e4731b1b3bb0ebba81a44
        name: 'FortiSwitch [{#SWNAME}]: State'
        type: DEPENDENT
        key: fgsw.switch.state[{#SWKEY}]
        delay: '0'
        master_item:
          key: fgsw.switch.get_data[{#SWKEY}]
        description: Normalized runtime state of the managed FortiSwitch.
        valuemap:
          name: Fortinet managed device state
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.state_num
        tags:
        - tag: component
          value: switch
        - tag: switch
          value: '{#SWNAME}'
      - uuid: 9c8e374e2bb44fa2be3dd24830a20275
        name: 'FortiSwitch [{#SWNAME}]: State raw'
        type: DEPENDENT
        key: fgsw.switch.state_raw[{#SWKEY}]
        delay: '0'
        master_item:
          key: fgsw.switch.get_data[{#SWKEY}]
        description: Raw state string returned by the API normalization script.
        value_type: CHAR
        trends: '0'
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.state_raw
        tags:
        - tag: component
          value: switch
        - tag: switch
          value: '{#SWNAME}'
      - uuid: 331eb2ee8ffa40faa84052ba414767bd
        name: 'FortiSwitch [{#SWNAME}]: IP address'
        type: DEPENDENT
        key: fgsw.switch.ip[{#SWKEY}]
        delay: '0'
        master_item:
          key: fgsw.switch.get_data[{#SWKEY}]
        description: Management IP address of the FortiSwitch.
        value_type: CHAR
        trends: '0'
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.ip
        tags:
        - tag: component
          value: network
        - tag: switch
          value: '{#SWNAME}'
      - uuid: 3f5f8f9f251244c4bb98085bea19640a
        name: 'FortiSwitch [{#SWNAME}]: Model'
        type: DEPENDENT
        key: fgsw.switch.model[{#SWKEY}]
        delay: '0'
        master_item:
          key: fgsw.switch.get_data[{#SWKEY}]
        description: Model of the FortiSwitch.
        value_type: CHAR
        trends: '0'
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.model
        tags:
        - tag: component
          value: system
        - tag: switch
          value: '{#SWNAME}'
      - uuid: 8c0b9b248a504812978f817b6d86af25
        name: 'FortiSwitch [{#SWNAME}]: Firmware version'
        type: DEPENDENT
        key: fgsw.switch.version[{#SWKEY}]
        delay: '0'
        master_item:
          key: fgsw.switch.get_data[{#SWKEY}]
        description: Firmware version of the FortiSwitch if returned by the controller API.
        value_type: CHAR
        trends: '0'
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.version
        tags:
        - tag: component
          value: system
        - tag: switch
          value: '{#SWNAME}'
      - uuid: f6616f3b8f6942448dfe29b936ed2e6e
        name: 'FortiSwitch [{#SWNAME}]: Port count'
        type: DEPENDENT
        key: fgsw.switch.ports[{#SWKEY}]
        delay: '0'
        master_item:
          key: fgsw.switch.get_data[{#SWKEY}]
        description: Total ports discovered for the FortiSwitch.
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.port_total
        tags:
        - tag: component
          value: switch
        - tag: switch
          value: '{#SWNAME}'
      - uuid: e9f1c62e8ec342eab1b7747543677779
        name: 'FortiSwitch [{#SWNAME}]: Profile'
        type: DEPENDENT
        key: fgsw.switch.profile[{#SWKEY}]
        delay: '0'
        master_item:
          key: fgsw.switch.get_data[{#SWKEY}]
        description: Assigned switch profile if returned by the controller API.
        value_type: CHAR
        trends: '0'
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.profile
        tags:
        - tag: component
          value: switch
        - tag: switch
          value: '{#SWNAME}'
      trigger_prototypes:
      - uuid: 47cfd56595f74343984685c80f8bf854
        expression: last(/FortiSwitch by FortiGate HTTP/fgsw.switch.state[{#SWKEY}])=0
        name: FortiSwitch [{#SWNAME}] is down
        opdata: 'Current state: {ITEM.LASTVALUE1}'
        priority: AVERAGE
        description: The managed FortiSwitch is reported as down by the normalized controller API response.
        tags:
        - tag: scope
          value: availability
    tags:
    - tag: class
      value: network
    - tag: target
      value: fortiswitch
    - tag: target
      value: fortinet
    macros:
    - macro: '{$FGATE.API.FQDN}'
      description: FortiGate API FQDN/IP (ex. ngfw.example.com).
    - macro: '{$FGATE.API.PORT}'
      value: '443'
      description: The port of FortiGate API endpoint.
    - macro: '{$FGATE.API.TOKEN}'
      type: SECRET_TEXT
      description: FortiGate API token.
    - macro: '{$FGATE.DATA.TIMEOUT}'
      value: 15s
      description: Response timeout for an API.
    - macro: '{$FGATE.HTTP.PROXY}'
      description: HTTP proxy for API requests.
    - macro: '{$FGATE.SCHEME}'
      value: http
      description: Request scheme which may be http or https.
    valuemaps:
    - uuid: f78cb6da96ca4688afa2f2921853a70a
      name: Service state
      mappings:
      - value: '0'
        newvalue: down
      - value: '1'
        newvalue: up
    - uuid: f9bc4700a9b941638bf22851106eb65c
      name: Fortinet managed device state
      mappings:
      - value: '0'
        newvalue: down
      - value: '1'
        newvalue: up
      - value: '2'
        newvalue: unknown
