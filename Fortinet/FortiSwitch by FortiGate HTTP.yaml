          parameters:
          - $.data[?(@.key == "{#SWKEY}")].ports.{#PORT}.rx_bytes.first()
          error_handler: CUSTOM_VALUE
          error_handler_params: '0'
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        - type: MULTIPLIER
          parameters:
          - '8'
        master_item:
