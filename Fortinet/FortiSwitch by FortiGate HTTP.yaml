      - uuid: 272d15a6db4e4020801dc20c73752bd8
        name: 'FortiSwitch [{#SWNAME}]: {#PORT}: Errors and drops'
        graph_items:
        - color: F63100
          item:
            host: FortiSwitch by FortiGate HTTP
