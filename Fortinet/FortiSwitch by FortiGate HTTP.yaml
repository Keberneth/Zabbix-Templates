zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 14e7de6aeadf4cdb95fc052ac19cda0f
    name: Fortinet Office Network
  - uuid: 52ef8af8c6734325a48f2318366b1786
    name: Templates/Network devices
  templates:
  - uuid: 3dfc5ac9a74e4269bf29ab7783a33cbc
    template: FortiSwitch by FortiGate HTTP
    name: FortiSwitch by FortiGate HTTP
    description: |
      Updated template for monitoring FortiSwitch devices that are managed by a FortiGate controller.

      This template is intended to be linked to the same FortiGate host that already uses your FortiGate by HTTP template.
      It reuses the same controller-side macros:
      - {$FGATE.API.FQDN}
      - {$FGATE.API.PORT}
      - {$FGATE.API.TOKEN}
      - {$FGATE.SCHEME}
      - {$FGATE.DATA.TIMEOUT}
      - {$FGATE.HTTP.PROXY}

      This revision prefers the newer FortiGate monitor endpoint for managed switch runtime status and augments it with:
      - CMDB managed-switch data for configured values such as profile and description
      - switch-group membership for the GUI "Switch Group" column

      Normalized per-switch fields returned by the master item:
      - serial
      - name
      - model
      - ip
      - version
      - profile
      - switch_group
      - admin_state
      - connection_state
      - state_raw
      - state_num
      - flags
      - join_time
      - port_total
      - port_up
      - port_down
      - description
    vendor:
      name: Keberneth
      version: '7.0.1.1'
    groups:
    - name: Fortinet Office Network
    - name: Templates/Network devices
    items:
    - uuid: 6836c66e19374f409498055fca40a172
      name: Get managed FortiSwitch data
      type: SCRIPT
      key: fgsw.switches.get_data
      delay: 5m
      history: '0'
      value_type: TEXT
      trends: '0'
      params: |2
            var params = JSON.parse(value),
                request = new HttpRequest(),
                result = {"ok": 0, "data": [], "error": ""},
                api_url = "",
                error_msg = "";

            function isObject(v) {
                return typeof v === 'object' && v !== null && !Array.isArray(v);
            }

            function safeText(v) {
                return (typeof v === 'undefined' || v === null) ? '' : String(v);
            }

            function first(obj, keys, def) {
                var i, key;
                if (!isObject(obj)) {
                    return def;
                }
                for (i = 0; i < keys.length; i++) {
                    key = keys[i];
                    if (typeof obj[key] !== 'undefined' && obj[key] !== null && obj[key] !== '') {
                        return obj[key];
                    }
                }
                return def;
            }

            function arrify(response) {
                var cands = ['results', 'result', 'data', 'entries'],
                    i, r, out;

                if (Array.isArray(response)) {
                    return response;
                }

                if (!isObject(response)) {
                    return [];
                }

                for (i = 0; i < cands.length; i++) {
                    r = response[cands[i]];
                    if (Array.isArray(r)) {
                        return r;
                    }
                    if (isObject(r)) {
                        out = [];
                        Object.keys(r).forEach(function (k) {
                            var item = r[k];
                            if (!isObject(item)) {
                                item = {"value": item};
                            }
                            if (typeof item.__key === 'undefined') {
                                item.__key = k;
                            }
                            out.push(item);
                        });
                        return out;
                    }
                }

                return [];
            }

            function getHttpData(url) {
                var response;

                response = request.get(url);
                Zabbix.log(4, '[ FortiSwitch by FortiGate HTTP ] [ ' + url + ' ] Received response with status code ' + request.getStatus() + ': ' + response);

                if (request.getStatus() !== 200) {
                    throw 'Failed to receive data: invalid response status code ' + request.getStatus() + '.';
                }

                if (response !== null && response !== '') {
                    try {
                        response = JSON.parse(response);
                    }
                    catch (error) {
                        throw 'Failed to parse response received from FortiGate API.';
                    }
                }

                if (!isObject(response) && !Array.isArray(response)) {
                    throw 'Cannot process response data: received data is not an object.';
                }

                return response;
            }

            function queryUrls(urls) {
                var i, last_error = '';
                for (i = 0; i < urls.length; i++) {
                    try {
                        return getHttpData(urls[i]);
                    }
                    catch (error) {
                        last_error = error.toString();
                    }
                }
                throw last_error;
            }

            function clean(v) {
                return safeText(v).replace(/^\s+|\s+$/g, '');
            }

            function isMeaningfulString(s) {
                return s !== '' && !/^(?:0|1|true|false|null|n\/a)$/i.test(s);
            }

            function likelyVersion(s) {
                return /(?:^|[\s-])v?\d+\.\d+(?:\.\d+)?(?:\s*\(\d+\))?/i.test(s) ||
                       /\bbuild\b/i.test(s) ||
                       /\bGA\b/i.test(s) ||
                       /-v\d+\.\d+\.\d+/i.test(s);
            }

            function likelyModel(s) {
                return /(fortiswitch|^s\d{3,4}[a-z0-9-]+)/i.test(s);
            }

            function normalizeName(obj) {
                var serial = clean(first(obj, ['serial', 'sn', 'q_origin_key', 'id'], '')),
                    keys = ['switch_id', 'switch-id', 'name', 'switch_name', 'switch-name', 'hostname'],
                    i, s;

                for (i = 0; i < keys.length; i++) {
                    s = clean(first(obj, [keys[i]], ''));
                    if (isMeaningfulString(s) && s !== serial) {
                        return s;
                    }
                }

                for (i = 0; i < keys.length; i++) {
                    s = clean(first(obj, [keys[i]], ''));
                    if (isMeaningfulString(s)) {
                        return s;
                    }
                }

                return serial;
            }

            function deriveSwitchModelFromSerialOrVersion(serial, version) {
                var s = clean(serial),
                    v = clean(version),
                    m = s.match(/^S(\d+)([A-Z])([A-Z])/i),
                    img = v.match(/^([A-Z]\d+[A-Z]+)/i),
                    prefix = '',
                    family = '',
                    variant = '';

                if (m) {
                    prefix = m[1];
                    family = m[2];
                    variant = m[3];
                    if (/^[A-Z]$/.test(family)) {
                        if (variant === 'P') {
                            return 'FortiSwitch ' + prefix + family + '-POE';
                        }
                        if (variant === 'N') {
                            return 'FortiSwitch ' + prefix + family;
                        }
                    }
                }

                if (img) {
                    return img[1];
                }

                return '';
            }

            function normalizeVersion(obj) {
                var keys = ['image_version', 'image-version', 'version', 'os_ver', 'firmware_version', 'firmware-version', 'firmware', 'image'],
                    i, s, best = '';

                for (i = 0; i < keys.length; i++) {
                    s = clean(first(obj, [keys[i]], ''));
                    if (!isMeaningfulString(s)) {
                        continue;
                    }
                    if (likelyVersion(s)) {
                        return s;
                    }
                    if (best === '' && /[A-Za-z]/.test(s)) {
                        best = s;
                    }
                }

                return best;
            }

            function normalizeModel(obj, serial, version) {
                var keys = ['model_name', 'model-name', 'model', 'platform_str', 'platform-str', 'platform', 'product'],
                    i, s;

                for (i = 0; i < keys.length; i++) {
                    s = clean(first(obj, [keys[i]], ''));
                    if (isMeaningfulString(s) && likelyModel(s)) {
                        return s;
                    }
                }

                return deriveSwitchModelFromSerialOrVersion(serial, version);
            }

            function switchAliases(v) {
                var serial = clean(first(v, ['serial', 'sn', 'q_origin_key', '__key', 'id'], '')),
                    name = clean(normalizeName(v)),
                    swid = clean(first(v, ['switch_id', 'switch-id'], ''));

                return [serial, name, swid].filter(function (x, idx, arr) {
                    return x !== '' && arr.indexOf(x) === idx;
                });
            }

            function parseStatusParts(obj) {
                var admin = clean(first(obj, ['admin_status', 'admin-status', 'admin_state', 'admin-state', 'authorization', 'admin'], '')),
                    conn = clean(first(obj, ['connection_state', 'connection-state', 'connection', 'run_state', 'run-state', 'oper_state', 'oper-state', 'fortilink_status', 'fortilink-status', 'conn_status', 'conn-status', 'link'], '')),
                    combined = clean(first(obj, ['status', 'state'], '')),
                    raw = '',
                    parts, num = 2;

                if (combined !== '' && combined.indexOf('/') !== -1) {
                    parts = combined.split('/');
                    if (admin === '') {
                        admin = clean(parts[0]);
                    }
                    if (conn === '') {
                        conn = clean(parts.slice(1).join('/'));
                    }
                    raw = combined;
                }
                else if (combined !== '') {
                    if (conn === '' && /(up|down|connected|disconnected|online|offline|healthy|lost|dead|missing)/i.test(combined)) {
                        conn = combined;
                    }
                    else if (admin === '' && /(authorized|unauthorized|discovered|disabled|enable|disable)/i.test(combined)) {
                        admin = combined;
                    }
                    raw = combined;
                }

                if (raw === '') {
                    if (admin !== '' && conn !== '') {
                        raw = admin + '/' + conn;
                    }
                    else {
                        raw = conn !== '' ? conn : admin;
                    }
                }

                if (/(authorized\/up|connected\s*\(|\bconnected\b|\bonline\b|\bhealthy\b|\bup\b)/i.test(raw) || /(connected|up|online|healthy)/i.test(conn)) {
                    num = 1;
                }
                else if (/(discovered\/down|unauthorized|disconnected|offline|lost|dead|missing|\bdown\b)/i.test(raw) || /(disconnected|offline|down|lost|dead|missing)/i.test(conn)) {
                    num = 0;
                }
                else if (clean(first(obj, ['address', 'ip', 'ip-address', 'remote_address', 'remote-address', 'mgmt_ip', 'management_ip', 'ipv4_address', 'ipv4-address'], '')) !== '' &&
                         normalizeVersion(obj) !== '' &&
                         !/^N\/A$/i.test(normalizeVersion(obj))) {
                    num = 1;
                }
                else if (/^N\/A$/i.test(normalizeVersion(obj))) {
                    num = 0;
                }

                if (raw === '') {
                    raw = num === 1 ? 'up' : (num === 0 ? 'down' : 'unknown');
                }

                return {"raw": raw, "num": num, "admin": admin, "conn": conn};
            }

            function normalizeIp(obj) {
                return clean(first(obj, ['address', 'ip', 'ip-address', 'remote_address', 'remote-address', 'mgmt_ip', 'management_ip', 'ipv4_address', 'ipv4-address'], ''));
            }

            function normalizeProfile(obj) {
                return clean(first(obj, ['switch_profile', 'switch-profile', 'profile', 'switch-profile-name'], ''));
            }

            function normalizeJoinTime(obj) {
                return clean(first(obj, ['join_time', 'join-time', 'join time'], ''));
            }

            function normalizeFlags(obj) {
                return clean(first(obj, ['flag', 'flags'], ''));
            }

            function extractPortSummary(obj) {
                var out = {"total": 0, "up": 0, "down": 0},
                    explicit = Number(first(obj, ['port_total', 'ports_total', 'port_count', 'ports_count', 'max_ports'], NaN)),
                    candidates = [
                        first(obj, ['ports'], null),
                        first(obj, ['interfaces'], null),
                        first(obj, ['port_stats'], null),
                        first(obj, ['port-stats'], null)
                    ],
                    i, c, keys, j, p, link;

                if (!isNaN(explicit)) {
                    out.total = Math.floor(explicit);
                }

                for (i = 0; i < candidates.length; i++) {
                    c = candidates[i];
                    if (Array.isArray(c)) {
                        if (out.total === 0) {
                            out.total = c.length;
                        }
                        for (j = 0; j < c.length; j++) {
                            p = c[j];
                            if (!isObject(p)) {
                                continue;
                            }
                            link = clean(first(p, ['link_status', 'link-status', 'oper_status', 'oper-status', 'state', 'status'], '')).toLowerCase();
                            if (link === 'up' || link === 'connected') {
                                out.up += 1;
                            }
                            else if (link === 'down' || link === 'disconnected') {
                                out.down += 1;
                            }
                        }
                        return out;
                    }
                    if (isObject(c)) {
                        keys = Object.keys(c);
                        if (out.total === 0) {
                            out.total = keys.length;
                        }
                        for (j = 0; j < keys.length; j++) {
                            p = c[keys[j]];
                            if (!isObject(p)) {
                                continue;
                            }
                            link = clean(first(p, ['link_status', 'link-status', 'oper_status', 'oper-status', 'state', 'status'], '')).toLowerCase();
                            if (link === 'up' || link === 'connected') {
                                out.up += 1;
                            }
                            else if (link === 'down' || link === 'disconnected') {
                                out.down += 1;
                            }
                        }
                        return out;
                    }
                }

                return out;
            }

            function memberIds(group_item) {
                var m = first(group_item, ['members'], []),
                    out = [];

                function pushMember(v) {
                    var s = clean(v);
                    if (s !== '' && out.indexOf(s) === -1) {
                        out.push(s);
                    }
                }

                if (Array.isArray(m)) {
                    m.forEach(function (x) {
                        if (typeof x === 'string' || typeof x === 'number') {
                            pushMember(x);
                        }
                        else if (isObject(x)) {
                            pushMember(first(x, ['switch_id', 'switch-id', 'name', 'q_origin_key', 'serial'], ''));
                        }
                    });
                }
                else if (typeof m === 'string') {
                    m.split(/\s*,\s*/).forEach(pushMember);
                }

                return out;
            }

            try {
                ['scheme', 'api.token', 'api.fqdn', 'api.port'].forEach(function (field) {
                    var macro = '{$FGATE.' + field.toUpperCase() + '}';
                    var key = field.split('.').pop();

                    if (typeof params[key] === 'undefined') {
                        throw 'Please set "' + key + '" script input parameter to ' + macro + ' macro value.';
                    }

                    if (params[key] === macro || params[key] === '') {
                        throw 'Please change ' + macro + ' macro to the proper value.';
                    }
                });

                if (typeof params.http_proxy !== 'undefined' && params.http_proxy !== '{' + '$FGATE.HTTP.PROXY}' && params.http_proxy !== '') {
                    request.setProxy(params.http_proxy);
                }

                api_url = params.scheme + '://' + params.fqdn + ':' + params.port;

                var status_resp = null,
                    legacy_monitor_resp = null,
                    cmdb_resp = null,
                    group_resp = null,
                    devices = {},
                    alias_to_key = {},
                    groups_by_alias = {},
                    partial_errors = [];

                try {
                    status_resp = queryUrls([
                        api_url + '/api/v2/monitor/switch-controller/managed-switch/status?access_token=' + encodeURIComponent(params.token) + '&start=0&count=1000',
                        api_url + '/api/v2/monitor/switch-controller/managed-switch/status?access_token=' + encodeURIComponent(params.token) + '&count=1000'
                    ]);
                }
                catch (error) {
                    partial_errors.push('status endpoint failed: ' + error);
                }

                try {
                    legacy_monitor_resp = queryUrls([
                        api_url + '/api/v2/monitor/switch-controller/managed-switch?access_token=' + encodeURIComponent(params.token) + '&start=0&count=1000&poe=true&port_stats=true&transceiver=true',
                        api_url + '/api/v2/monitor/switch-controller/managed-switch?access_token=' + encodeURIComponent(params.token) + '&start=0&count=1000',
                        api_url + '/api/v2/monitor/switch-controller/managed-switch?access_token=' + encodeURIComponent(params.token)
                    ]);
                }
                catch (error) {
                    partial_errors.push('legacy monitor endpoint failed: ' + error);
                }

                try {
                    cmdb_resp = getHttpData(
                        api_url + '/api/v2/cmdb/switch-controller/managed-switch?access_token=' + encodeURIComponent(params.token)
                    );
                }
                catch (error) {
                    partial_errors.push('cmdb managed-switch endpoint failed: ' + error);
                }

                try {
                    group_resp = getHttpData(
                        api_url + '/api/v2/cmdb/switch-controller/switch-group?access_token=' + encodeURIComponent(params.token)
                    );
                }
                catch (error) {
                    partial_errors.push('cmdb switch-group endpoint failed: ' + error);
                }

                if (status_resp === null && legacy_monitor_resp === null && cmdb_resp === null) {
                    throw partial_errors.join(' ');
                }

                function resolveKey(v) {
                    var aliases = switchAliases(v),
                        key = '',
                        i;

                    for (i = 0; i < aliases.length; i++) {
                        if (aliases[i] !== '' && typeof alias_to_key[aliases[i]] !== 'undefined') {
                            key = alias_to_key[aliases[i]];
                            break;
                        }
                    }

                    if (key === '') {
                        key = aliases.length > 0 ? aliases[0] : '';
                    }

                    if (key === '') {
                        return '';
                    }

                    aliases.forEach(function (a) {
                        alias_to_key[a] = key;
                    });

                    return key;
                }

                function mergeObjects(target, src) {
                    Object.keys(src || {}).forEach(function (x) {
                        target[x] = src[x];
                    });
                }

                arrify(cmdb_resp || {}).forEach(function (item) {
                    var key;
                    if (!isObject(item)) {
                        return;
                    }

                    key = resolveKey(item);
                    if (key === '') {
                        return;
                    }

                    if (typeof devices[key] === 'undefined') {
                        devices[key] = {"cfg": {}, "status": {}, "legacy": {}};
                    }

                    devices[key].cfg = item;
                });

                arrify(status_resp || {}).forEach(function (item) {
                    var key;
                    if (!isObject(item)) {
                        return;
                    }

                    key = resolveKey(item);
                    if (key === '') {
                        return;
                    }

                    if (typeof devices[key] === 'undefined') {
                        devices[key] = {"cfg": {}, "status": {}, "legacy": {}};
                    }

                    devices[key].status = item;
                });

                arrify(legacy_monitor_resp || {}).forEach(function (item) {
                    var key;
                    if (!isObject(item)) {
                        return;
                    }

                    key = resolveKey(item);
                    if (key === '') {
                        return;
                    }

                    if (typeof devices[key] === 'undefined') {
                        devices[key] = {"cfg": {}, "status": {}, "legacy": {}};
                    }

                    devices[key].legacy = item;
                });

                arrify(group_resp || {}).forEach(function (item) {
                    var gname;
                    if (!isObject(item)) {
                        return;
                    }

                    gname = clean(first(item, ['name', 'q_origin_key', 'id'], ''));
                    if (gname === '') {
                        return;
                    }

                    memberIds(item).forEach(function (m) {
                        if (typeof groups_by_alias[m] === 'undefined') {
                            groups_by_alias[m] = {};
                        }
                        groups_by_alias[m][gname] = true;
                    });
                });

                result.data = Object.keys(devices).map(function (k) {
                    var merged = {},
                        cfg = devices[k].cfg || {},
                        status = devices[k].status || {},
                        legacy = devices[k].legacy || {},
                        aliases = [],
                        alias_seen = {},
                        state,
                        serial,
                        name,
                        version,
                        model,
                        port_summary,
                        group_names = {};

                    mergeObjects(merged, cfg);
                    mergeObjects(merged, legacy);
                    mergeObjects(merged, status);

                    serial = clean(first(merged, ['serial', 'sn', 'q_origin_key', 'id'], k));
                    name = clean(normalizeName(merged));
                    version = clean(normalizeVersion(merged));
                    model = clean(normalizeModel(merged, serial, version));
                    state = parseStatusParts(merged);
                    port_summary = extractPortSummary(merged);

                    switchAliases(merged).concat([k]).forEach(function (a) {
                        if (a !== '' && typeof alias_seen[a] === 'undefined') {
                            alias_seen[a] = true;
                            aliases.push(a);
                        }
                    });

                    aliases.forEach(function (a) {
                        if (typeof groups_by_alias[a] !== 'undefined') {
                            Object.keys(groups_by_alias[a]).forEach(function (g) {
                                group_names[g] = true;
                            });
                        }
                    });

                    return {
                        "key": k,
                        "serial": serial,
                        "name": name !== '' ? name : serial,
                        "model": model,
                        "ip": normalizeIp(merged),
                        "version": version,
                        "profile": normalizeProfile(merged),
                        "switch_group": Object.keys(group_names).sort().join(', '),
                        "admin_state": state.admin,
                        "connection_state": state.conn,
                        "state_raw": state.raw,
                        "state_num": state.num,
                        "flags": normalizeFlags(merged),
                        "join_time": normalizeJoinTime(merged),
                        "port_total": port_summary.total,
                        "port_up": port_summary.up,
                        "port_down": port_summary.down,
                        "description": clean(first(merged, ['description', 'comments'], ''))
                    };
                });

                result.data.sort(function (a, b) {
                    if (a.name < b.name) {
                        return -1;
                    }
                    if (a.name > b.name) {
                        return 1;
                    }
                    return 0;
                });

                result.ok = 1;
                if (partial_errors.length === 0) {
                    result.error = '';
                }
                else if (result.data.length > 0) {
                    result.error = partial_errors.join(' | ');
                }
            }
            catch (error) {
                error_msg = error.toString();
                error_msg += error_msg.endsWith('.') ? '' : '.';
                Zabbix.log(3, '[ FortiSwitch by FortiGate HTTP ] ERROR: ' + error_msg);
                result.error = error_msg;
            }

            return JSON.stringify(result);
      description: Item for gathering managed FortiSwitch inventory, controller runtime status, switch-group membership, and
        basic port summary from the FortiGate API.
      timeout: '{$FGATE.DATA.TIMEOUT}'
      parameters:
      - name: fqdn
        value: '{$FGATE.API.FQDN}'
      - name: http_proxy
        value: '{$FGATE.HTTP.PROXY}'
      - name: port
        value: '{$FGATE.API.PORT}'
      - name: scheme
        value: '{$FGATE.SCHEME}'
      - name: token
        value: '{$FGATE.API.TOKEN}'
      tags:
      - tag: component
        value: raw
    - uuid: 99a54308bc814097b4b167bf283f6e37
      name: API availability status
      type: DEPENDENT
      key: fgsw.api.status
      delay: '0'
      description: Checking API availability by normalized response.
      valuemap:
        name: Service state
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.ok
        error_handler: CUSTOM_VALUE
        error_handler_params: '0'
      master_item:
        key: fgsw.switches.get_data
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: 947d83249fab46dd95576c8cf3b2181a
        expression: last(/FortiSwitch by FortiGate HTTP/fgsw.api.status)=0
        name: Unexpected response from API
        priority: AVERAGE
        description: Received an unexpected response from API. It may be unavailable or the endpoint may be unsupported by
          this FortiOS build.
        tags:
        - tag: scope
          value: availability
    - uuid: f0478d1d9a094b9fba9cff9b6fb593ac
      name: Master metric item errors
      type: DEPENDENT
      key: fgsw.data_errors
      delay: '0'
      value_type: TEXT
      history: '0'
      trends: '0'
      description: Item for gathering errors of the master metric.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.error
        error_handler: CUSTOM_VALUE
        error_handler_params: ''
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: fgsw.switches.get_data
      tags:
      - tag: component
        value: error
      triggers:
      - uuid: 8802c2c28e284bdea3079d6b665da904
        expression: length(last(/FortiSwitch by FortiGate HTTP/fgsw.data_errors))>0
        name: There are errors in the master metric
        priority: WARNING
        dependencies:
        - name: Unexpected response from API
          expression: last(/FortiSwitch by FortiGate HTTP/fgsw.api.status)=0
        tags:
        - tag: scope
          value: availability
    - uuid: 36115d0b14314cb59292110a2a09da9c
      name: Managed FortiSwitch count
      type: DEPENDENT
      key: fgsw.switch.count
      delay: '0'
      description: Number of FortiSwitch devices returned by the controller.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data.length()
        error_handler: CUSTOM_VALUE
