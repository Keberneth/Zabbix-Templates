                  expression: 'min(/FortiSwitch by FortiGate HTTP/fgsw.port.tx_errors[{#SWKEY},{#PORT}],4m)>{$FGATE.SW.PORT.SEND.ERRORS.WARN:"{#PORT}"}'
                  name: 'FortiSwitch [{#SWNAME}]: {#PORT}: High send error rate'
