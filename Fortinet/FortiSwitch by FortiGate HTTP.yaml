              name: 'FortiSwitch [{#SWNAME}]: {#PORT}: Traffic'
              graph_items:
                - drawtype: BOLD_LINE
                  color: 1E88E5
                  item:
                    host: 'FortiSwitch by FortiGate HTTP'
                    key: 'fgsw.port.rx_bps[{#SWKEY},{#PORT}]'
                - sortorder: '1'
                  drawtype: BOLD_LINE
                  color: 199C0D
                  item:
                    host: 'FortiSwitch by FortiGate HTTP'
                    key: 'fgsw.port.tx_bps[{#SWKEY},{#PORT}]'
          master_item:
            key: fgsw.switches.get_data
          lld_macro_paths:
            - lld_macro: '{#PORT}'
              path: $.port
            - lld_macro: '{#SWGROUP}'
              path: $.switch_group
            - lld_macro: '{#SWKEY}'
              path: $.key
            - lld_macro: '{#SWNAME}'
              path: $.name
            - lld_macro: '{#SWSERIAL}'
              path: $.serial
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.data
            - type: JAVASCRIPT
              parameters:
                - |
                  var result = [];
                  JSON.parse(value).forEach(function (sw) {
                      var ports = sw.ports || {};
                      Object.keys(ports).forEach(function (pn) {
                          var p = ports[pn] || {};
                          var ls = (p.link_status ? String(p.link_status) : '').toLowerCase();
                          if (ls === 'down' || ls === 'disconnected' || ls === 'disabled' || ls === 'no_link') {
                              return;
                          }
                          result.push({
                              "key": sw.key,
                              "name": sw.name,
                              "serial": sw.serial,
                              "switch_group": sw.switch_group,
                              "port": pn
                          });
                      });
                  });
                  return JSON.stringify(result);
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 6h
