zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: df97989912ff40919985d25706920120
      name: 'Fortinet Office Network'
    - uuid: 41d23565286045a6855bdf9b7c52dc87
      name: 'Templates/Network devices'
  templates:
  - uuid: 3dfc5ac9a74e4269bf29ab7783a33cbc
    template: FortiSwitch by FortiGate HTTP
    name: FortiSwitch by FortiGate HTTP
    description: 'Updated template for monitoring FortiSwitch devices that are managed by a FortiGate controller.


      This template is intended to be linked to the same FortiGate host that already uses your FortiGate by HTTP template.

      It reuses the same controller-side macros:

      - {$FGATE.API.FQDN}

      - {$FGATE.API.PORT}

      - {$FGATE.API.TOKEN}

      - {$FGATE.SCHEME}

      - {$FGATE.DATA.TIMEOUT}

      - {$FGATE.HTTP.PROXY}


      This revision prefers the newer FortiGate monitor endpoint for managed switch runtime status and augments it with:

      - CMDB managed-switch data for configured values such as profile and description

      - switch-group membership for the GUI "Switch Group" column


      Normalized per-switch fields returned by the master item:

      - serial

      - name

      - model

      - ip

      - version

      - profile

      - switch_group

      - admin_state

      - connection_state

      - state_raw

      - state_num

      - flags

      - join_time

      - port_total

      - port_up

      - port_down

      - description



      This revision also adds aggregate switch/port items, graph prototypes, and dashboard pages for overview and per-switch statistics.

      '
    vendor:
      name: Keberneth
      version: 7.0.4
    groups:
    - name: Fortinet Office Network
    - name: Templates/Network devices
    items:
    - uuid: 99a54308bc814097b4b167bf283f6e37
      name: API availability status
      type: DEPENDENT
      key: fgsw.api.status
      delay: '0'
      description: Checking API availability by normalized response.
      valuemap:
        name: Service state
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.ok
        error_handler: CUSTOM_VALUE
        error_handler_params: '0'
      master_item:
        key: fgsw.switches.get_data
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: 947d83249fab46dd95576c8cf3b2181a
        expression: last(/FortiSwitch by FortiGate HTTP/fgsw.api.status)=0
        name: Unexpected response from API
        priority: AVERAGE
        description: Received an unexpected response from API. It may be unavailable or the endpoint may be unsupported by this FortiOS build.
        tags:
        - tag: scope
          value: availability
    - uuid: f0478d1d9a094b9fba9cff9b6fb593ac
      name: Master metric item errors
      type: DEPENDENT
      key: fgsw.data_errors
      delay: '0'
      history: '0'
      value_type: TEXT
      trends: '0'
      description: Item for gathering errors of the master metric.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.error
        error_handler: CUSTOM_VALUE
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: fgsw.switches.get_data
      tags:
      - tag: component
        value: error
      triggers:
      - uuid: 8802c2c28e284bdea3079d6b665da904
        expression: length(last(/FortiSwitch by FortiGate HTTP/fgsw.data_errors))>0
        name: There are errors in the master metric
        priority: WARNING
        dependencies:
        - name: Unexpected response from API
          expression: last(/FortiSwitch by FortiGate HTTP/fgsw.api.status)=0
        tags:
        - tag: scope
          value: availability
    - uuid: 01603ddf56324a5996e84eac50bb7374
      name: FortiSwitch ports down
      type: DEPENDENT
      key: fgsw.port.down
      delay: '0'
      description: Total number of managed FortiSwitch ports currently reported down by the controller.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data
        error_handler: CUSTOM_VALUE
        error_handler_params: '[]'
      - type: JAVASCRIPT
        parameters:
        - var data = JSON.parse(value); return data.reduce(function (acc, v) { return acc + Number(v.port_down || 0); }, 0);
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: fgsw.switches.get_data
    - uuid: 45ad96d698a644e3879c97281b353781
      name: Total FortiSwitch ports
      type: DEPENDENT
      key: fgsw.port.total
      delay: '0'
      description: Total number of switch ports across all managed FortiSwitch devices returned by the controller.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data
        error_handler: CUSTOM_VALUE
        error_handler_params: '[]'
      - type: JAVASCRIPT
        parameters:
        - var data = JSON.parse(value); return data.reduce(function (acc, v) { return acc + Number(v.port_total || 0); }, 0);
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: fgsw.switches.get_data
    - uuid: 7969ff1e444b404b84891d1e37a1a46d
      name: FortiSwitch ports up
      type: DEPENDENT
      key: fgsw.port.up
      delay: '0'
      description: Total number of managed FortiSwitch ports currently reported up by the controller.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data
        error_handler: CUSTOM_VALUE
        error_handler_params: '[]'
      - type: JAVASCRIPT
        parameters:
        - var data = JSON.parse(value); return data.reduce(function (acc, v) { return acc + Number(v.port_up || 0); }, 0);
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: fgsw.switches.get_data
    - uuid: 31edfefa2bf14a758f09740e49a4724c
      name: FortiSwitch ports up (%)
      type: DEPENDENT
      key: fgsw.port.up_pct
      delay: '0'
      value_type: FLOAT
      units: '%'
      description: Percentage of managed FortiSwitch ports currently reported up by the controller.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data
        error_handler: CUSTOM_VALUE
        error_handler_params: '[]'
      - type: JAVASCRIPT
        parameters:
        - 'var data = JSON.parse(value), total = 0, up = 0; data.forEach(function (v) { total += Number(v.port_total || 0); up += Number(v.port_up || 0); }); return total > 0 ? (up * 100 / total).toFixed(2) : 0;'
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: fgsw.switches.get_data
    - uuid: 42de5962c0bc4c3aa2527223c69927a9
      name: Managed FortiSwitch connected
      type: DEPENDENT
      key: fgsw.switch.connected
      delay: '0'
      description: Number of managed FortiSwitch devices with a normalized state of up.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data
        error_handler: CUSTOM_VALUE
        error_handler_params: '[]'
      - type: JAVASCRIPT
        parameters:
        - var data = JSON.parse(value); return data.filter(function (v) { return Number(v.state_num) === 1; }).length;
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: fgsw.switches.get_data
    - uuid: d90bdef8afda45798f55e5654e57c9b1
      name: Managed FortiSwitch connected (%)
      type: DEPENDENT
      key: fgsw.switch.connected_pct
      delay: '0'
      value_type: FLOAT
      units: '%'
      description: Percentage of managed FortiSwitch devices currently normalized as up.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data
        error_handler: CUSTOM_VALUE
        error_handler_params: '[]'
      - type: JAVASCRIPT
        parameters:
        - var data = JSON.parse(value); if (data.length === 0) { return 0; } var up = data.filter(function (v) { return Number(v.state_num) === 1; }).length; return (up * 100 / data.length).toFixed(2);
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: fgsw.switches.get_data
    - uuid: 36115d0b14314cb59292110a2a09da9c
      name: Managed FortiSwitch count
      type: DEPENDENT
      key: fgsw.switch.count
      delay: '0'
      description: Number of FortiSwitch devices returned by the controller.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data.length()
        error_handler: CUSTOM_VALUE
        error_handler_params: '0'
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: fgsw.switches.get_data
    - uuid: da3837db88364736a573c9440698722e
      name: Managed FortiSwitch not connected
      type: DEPENDENT
      key: fgsw.switch.not_connected
      delay: '0'
      description: Number of managed FortiSwitch devices not currently normalized as up. This includes down or unknown states.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data
        error_handler: CUSTOM_VALUE
        error_handler_params: '[]'
      - type: JAVASCRIPT
        parameters:
        - var data = JSON.parse(value); return data.filter(function (v) { return Number(v.state_num) !== 1; }).length;
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: fgsw.switches.get_data
    - uuid: 6836c66e19374f409498055fca40a172
      name: Get managed FortiSwitch data
      type: SCRIPT
      key: fgsw.switches.get_data
      delay: 5m
      history: '0'
      value_type: TEXT
      trends: '0'
      params: "    var params = JSON.parse(value),\n        request = new HttpRequest(),\n        result = {\"ok\": 0, \"data\": [], \"error\": \"\"},\n        api_url = \"\",\n        error_msg = \"\";\n\n    function isObject(v) {\n        return typeof v === 'object' && v !== null && !Array.isArray(v);\n    }\n\n    function safeText(v) {\n        return (typeof v === 'undefined' || v === null) ? '' : String(v);\n    }\n\n    function first(obj, keys, def) {\n        var i, key;\n        if (!isObject(obj)) {\n            return def;\n        }\n        for (i = 0; i < keys.length; i++) {\n            key = keys[i];\n            if (typeof obj[key] !== 'undefined' && obj[key] !== null && obj[key] !== '') {\n                return obj[key];\n            }\n        }\n        return def;\n    }\n\n    function arrify(response) {\n        var cands = ['results', 'result', 'data', 'entries'],\n            i, r, out;\n\n        if (Array.isArray(response)) {\n            return response;\n        }\n\n        if (!isObject(response)) {\n            return [];\n        }\n\n        for (i = 0; i < cands.length; i++) {\n            r = response[cands[i]];\n            if (Array.isArray(r)) {\n                return r;\n            }\n            if (isObject(r)) {\n                out = [];\n                Object.keys(r).forEach(function (k) {\n                    var item = r[k];\n                    if (!isObject(item)) {\n                        item = {\"value\": item};\n                    }\n                    if (typeof item.__key === 'undefined') {\n                        item.__key = k;\n                    }\n                    out.push(item);\n                });\n                return out;\n            }\n        }\n\n        return [];\n    }\n\n    function getHttpData(url) {\n        var response;\n\n        response = request.get(url);\n        Zabbix.log(4, '[ FortiSwitch by FortiGate HTTP ] [ ' + url + ' ] Received response with status code ' + request.getStatus() + ': ' + response);\n\n        if (request.getStatus() !== 200) {\n            throw 'Failed to receive data: invalid response status code ' + request.getStatus() + '.';\n        }\n\n        if (response !== null && response !== '') {\n            try {\n                response = JSON.parse(response);\n            }\n            catch (error) {\n                throw 'Failed to parse response received from FortiGate API.';\n            }\n        }\n\n        if (!isObject(response) && !Array.isArray(response)) {\n            throw 'Cannot process response data: received data is not an object.';\n        }\n\n        return response;\n    }\n\n    function queryUrls(urls) {\n        var i, last_error = '';\n        for (i = 0; i < urls.length; i++) {\n            try {\n                return getHttpData(urls[i]);\n            }\n            catch (error) {\n                last_error = error.toString();\n            }\n        }\n        throw last_error;\n    }\n\n    function clean(v) {\n        return safeText(v).replace(/^\\s+|\\s+$/g, '');\n    }\n\n    function isMeaningfulString(s) {\n        return s !== '' && !/^(?:0|1|true|false|null|n\\/a)$/i.test(s);\n    }\n\n    function likelyVersion(s) {\n        return /(?:^|[\\s-])v?\\d+\\.\\d+(?:\\.\\d+)?(?:\\s*\\(\\d+\\))?/i.test(s) ||\n               /\\bbuild\\b/i.test(s) ||\n               /\\bGA\\b/i.test(s) ||\n               /-v\\d+\\.\\d+\\.\\d+/i.test(s);\n    }\n\n    function likelyModel(s) {\n        return /(fortiswitch|^s\\d{3,4}[a-z0-9-]+)/i.test(s);\n    }\n\n    function normalizeName(obj) {\n        var serial = clean(first(obj, ['serial', 'sn', 'q_origin_key', 'id'], '')),\n            keys = ['switch_id', 'switch-id', 'name', 'switch_name', 'switch-name', 'hostname'],\n            i, s;\n\n        for (i = 0; i < keys.length; i++) {\n            s = clean(first(obj, [keys[i]], ''));\n            if (isMeaningfulString(s) && s !== serial) {\n                return s;\n            }\n        }\n\n        for (i = 0; i < keys.length; i++) {\n            s = clean(first(obj, [keys[i]], ''));\n            if (isMeaningfulString(s)) {\n                return s;\n            }\n        }\n\n        return serial;\n    }\n\n    function deriveSwitchModelFromSerialOrVersion(serial, version) {\n        var s = clean(serial),\n            v = clean(version),\n            m = s.match(/^S(\\d+)([A-Z])([A-Z])/i),\n            img = v.match(/^([A-Z]\\d+[A-Z]+)/i),\n            prefix = '',\n            family = '',\n            variant = '';\n\n        if (m) {\n            prefix = m[1];\n            family = m[2];\n            variant = m[3];\n            if (/^[A-Z]$/.test(family)) {\n                if (variant === 'P') {\n                    return 'FortiSwitch ' + prefix + family + '-POE';\n                }\n                if (variant === 'N') {\n                    return 'FortiSwitch ' + prefix + family;\n                }\n            }\n        }\n\n        if (img) {\n            return img[1];\n        }\n\n        return '';\n    }\n\n    function normalizeVersion(obj) {\n        var keys = ['image_version', 'image-version', 'version', 'os_version', 'os-version', 'os_ver', 'firmware_version', 'firmware-version', 'firmware', 'image'],\n            i, s, best = '';\n\n        for (i = 0; i < keys.length; i++) {\n            s = clean(first(obj, [keys[i]], ''));\n            if (!isMeaningfulString(s)) {\n                continue;\n            }\n            if (likelyVersion(s)) {\n                return s;\n            }\n            if (best === '' && /[A-Za-z]/.test(s)) {\n                best = s;\n            }\n        }\n\n        return best;\n    }\n\n    function normalizeModel(obj, serial, version) {\n        var keys = ['model_name', 'model-name', 'model', 'platform_str', 'platform-str', 'platform', 'product'],\n            i, s;\n\n        for (i = 0; i < keys.length; i++) {\n            s = clean(first(obj, [keys[i]], ''));\n            if (isMeaningfulString(s) && likelyModel(s)) {\n                return s;\n            }\n        }\n\n        return deriveSwitchModelFromSerialOrVersion(serial, version);\n    }\n\n    function switchAliases(v) {\n        var serial = clean(first(v, ['serial', 'sn', 'q_origin_key', '__key', 'id'], '')),\n            name = clean(normalizeName(v)),\n            swid = clean(first(v, ['switch_id', 'switch-id'], ''));\n\n        return [serial, name, swid].filter(function (x, idx, arr) {\n            return x !== '' && arr.indexOf(x) === idx;\n        });\n    }\n\n    function parseStatusParts(obj) {\n        var admin = clean(first(obj, ['admin_status', 'admin-status', 'admin_state', 'admin-state', 'authorization', 'admin'], '')),\n            conn = clean(first(obj, ['connection_state', 'connection-state', 'connection', 'run_state', 'run-state', 'oper_state', 'oper-state', 'fortilink_status', 'fortilink-status', 'conn_status', 'conn-status', 'link'], '')),\n            combined = clean(first(obj, ['status', 'state'], '')),\n            raw = '',\n            parts, num = 2;\n\n        if (combined !== '' && combined.indexOf('/') !== -1) {\n            parts = combined.split('/');\n            if (admin === '') {\n                admin = clean(parts[0]);\n            }\n            if (conn === '') {\n                conn = clean(parts.slice(1).join('/'));\n            }\n            raw = combined;\n        }\n        else if (combined !== '') {\n            if (conn === '' && /(up|down|connected|disconnected|online|offline|healthy|lost|dead|missing)/i.test(combined)) {\n                conn = combined;\n            }\n            else if (admin === '' && /(authorized|unauthorized|discovered|disabled|enable|disable)/i.test(combined)) {\n                admin = combined;\n            }\n            raw = combined;\n        }\n\n        if (raw === '') {\n            if (admin !== '' && conn !== '') {\n                raw = admin + '/' + conn;\n            }\n            else {\n                raw = conn !== '' ? conn : admin;\n            }\n        }\n\n        if (/(authorized\\/up|connected\\s*\\(|\\bconnected\\b|\\bonline\\b|\\bhealthy\\b|\\bup\\b)/i.test(raw) || /(connected|up|online|healthy)/i.test(conn)) {\n            num = 1;\n        }\n        else if (/(discovered\\/down|unauthorized|disconnected|offline|lost|dead|missing|\\bdown\\b)/i.test(raw) || /(disconnected|offline|down|lost|dead|missing)/i.test(conn)) {\n            num = 0;\n        }\n        else if (clean(first(obj, ['address', 'ip', 'ip-address', 'remote_address', 'remote-address', 'mgmt_ip', 'management_ip', 'ipv4_address', 'ipv4-address'], '')) !== '' &&\n                 normalizeVersion(obj) !== '' &&\n                 !/^N\\/A$/i.test(normalizeVersion(obj))) {\n            num = 1;\n        }\n        else if (/^N\\/A$/i.test(normalizeVersion(obj))) {\n            num = 0;\n        }\n\n        if (raw === '') {\n            raw = num === 1 ? 'up' : (num === 0 ? 'down' : 'unknown');\n        }\n\n        return {\"raw\": raw, \"num\": num, \"admin\": admin, \"conn\": conn};\n    }\n\n    function normalizeIp(obj) {\n        return clean(first(obj, ['address', 'ip', 'ip-address', 'connecting_from', 'connecting-from', 'remote_address', 'remote-address', 'mgmt_ip', 'management_ip', 'ipv4_address', 'ipv4-address'], ''));\n    }\n\n    function normalizeProfile(obj) {\n        return clean(first(obj, ['switch_profile', 'switch-profile', 'profile', 'switch-profile-name'], ''));\n    }\n\n    function normalizeJoinTime(obj) {\n        return clean(first(obj, ['join_time', 'join-time', 'join time'], ''));\n    }\n\n    function normalizeFlags(obj) {\n        return clean(first(obj, ['flag', 'flags'], ''));\n    }\n\n    function extractPortSummary(obj) {\n        var out = {\"total\": 0, \"up\": 0, \"down\": 0},\n            explicit = Number(first(obj, ['port_total', 'ports_total', 'port_count', 'ports_count', 'max_ports'], NaN)),\n            candidates = [\n                first(obj, ['ports'], null),\n                first(obj, ['interfaces'], null),\n                first(obj, ['port_stats'], null),\n                first(obj, ['port-stats'], null)\n            ],\n            i, c, keys, j, p, link;\n\n        if (!isNaN(explicit)) {\n            out.total = Math.floor(explicit);\n        }\n\n        for (i = 0; i < candidates.length; i++) {\n            c = candidates[i];\n            if (Array.isArray(c)) {\n                if (out.total === 0) {\n                    out.total = c.length;\n                }\n                for (j = 0; j < c.length; j++) {\n                    p = c[j];\n                    if (!isObject(p)) {\n                        continue;\n                    }\n                    link = clean(first(p, ['link_status', 'link-status', 'oper_status', 'oper-status', 'state', 'status'], '')).toLowerCase();\n                    if (link === 'up' || link === 'connected') {\n                        out.up += 1;\n                    }\n                    else if (link === 'down' || link === 'disconnected') {\n                        out.down += 1;\n                    }\n                }\n                return out;\n            }\n            if (isObject(c)) {\n                keys = Object.keys(c);\n                if (out.total === 0) {\n                    out.total = keys.length;\n                }\n                for (j = 0; j < keys.length; j++) {\n                    p = c[keys[j]];\n                    if (!isObject(p)) {\n                        continue;\n                    }\n                    link = clean(first(p, ['link_status', 'link-status', 'oper_status', 'oper-status', 'state', 'status'], '')).toLowerCase();\n                    if (link === 'up' || link === 'connected') {\n                        out.up += 1;\n                    }\n                    else if (link === 'down' || link === 'disconnected') {\n                        out.down += 1;\n                    }\n                }\n                return out;\n            }\n        }\n\n        return out;\n    }\n\n    function memberIds(group_item) {\n        var m = first(group_item, ['members'], []),\n            out = [];\n\n        function pushMember(v) {\n            var s = clean(v);\n            if (s !== '' && out.indexOf(s) === -1) {\n                out.push(s);\n            }\n        }\n\n        if (Array.isArray(m)) {\n            m.forEach(function (x) {\n                if (typeof x === 'string' || typeof x === 'number') {\n                    pushMember(x);\n                }\n                else if (isObject(x)) {\n                    pushMember(first(x, ['switch_id', 'switch-id', 'name', 'q_origin_key', 'serial'], ''));\n                }\n            });\n        }\n        else if (typeof m === 'string') {\n            m.split(/\\s*,\\s*/).forEach(pushMember);\n        }\n\n        return out;\n    }\n\n    try {\n        ['scheme', 'api.token', 'api.fqdn', 'api.port'].forEach(function (field) {\n            var macro = '{$FGATE.' + field.toUpperCase() + '}';\n            var key = field.split('.').pop();\n\n            if (typeof params[key] === 'undefined') {\n                throw 'Please set \"' + key + '\" script input parameter to ' + macro + ' macro value.';\n            }\n\n            if (params[key] === macro || params[key] === '') {\n                throw 'Please change ' + macro + ' macro to the proper value.';\n            }\n        });\n\n        if (typeof params.http_proxy !== 'undefined' && params.http_proxy !== '{' + '$FGATE.HTTP.PROXY}' && params.http_proxy !== '') {\n            request.setProxy(params.http_proxy);\n        }\n\n        api_url = params.scheme + '://' + params.fqdn + ':' + params.port;\n\n        var status_resp = null,\n            legacy_monitor_resp = null,\n            cmdb_resp = null,\n            group_resp = null,\n            health_resp = null,\n            port_stats_resp = null,\n            devices = {},\n            alias_to_key = {},\n            groups_by_alias = {},\n            partial_errors = [];\n\n        try {\n            status_resp = queryUrls([\n                api_url + '/api/v2/monitor/switch-controller/managed-switch/status?access_token=' + encodeURIComponent(params.token) + '&start=0&count=1000',\n                api_url + '/api/v2/monitor/switch-controller/managed-switch/status?access_token=' + encodeURIComponent(params.token) + '&count=1000'\n            ]);\n        }\n        catch (error) {\n            partial_errors.push('status endpoint failed: ' + error);\n        }\n\n        try {\n            legacy_monitor_resp = queryUrls([\n                api_url + '/api/v2/monitor/switch-controller/managed-switch?access_token=' + encodeURIComponent(params.token) + '&start=0&count=1000&poe=true&port_stats=true&transceiver=true',\n                api_url + '/api/v2/monitor/switch-controller/managed-switch?access_token=' + encodeURIComponent(params.token) + '&start=0&count=1000',\n                api_url + '/api/v2/monitor/switch-controller/managed-switch?access_token=' + encodeURIComponent(params.token)\n            ]);\n        }\n        catch (error) {\n            partial_errors.push('legacy monitor endpoint failed: ' + error);\n        }\n\n        try {\n            cmdb_resp = getHttpData(\n                api_url + '/api/v2/cmdb/switch-controller/managed-switch?access_token=' + encodeURIComponent(params.token)\n            );\n        }\n        catch (error) {\n            partial_errors.push('cmdb managed-switch endpoint failed: ' + error);\n        }\n\n        try {\n            group_resp = getHttpData(\n                api_url + '/api/v2/cmdb/switch-controller/switch-group?access_token=' + encodeURIComponent(params.token)\n            );\n        }\n        catch (error) {\n            partial_errors.push('cmdb switch-group endpoint failed: ' + error);\n        }\n\n        try {\n            health_resp = getHttpData(\n                api_url + '/api/v2/monitor/switch-controller/managed-switch/health?access_token=' + encodeURIComponent(params.token)\n            );\n        }\n        catch (error) {\n            partial_errors.push('managed-switch/health endpoint failed: ' + error);\n        }\n\n        try {\n            port_stats_resp = queryUrls([\n                api_url + '/api/v2/monitor/switch-controller/managed-switch/port-stats?access_token=' + encodeURIComponent(params.token) + '&start=0&count=1000',\n                api_url + '/api/v2/monitor/switch-controller/managed-switch/port-stats?access_token=' + encodeURIComponent(params.token)\n            ]);\n        }\n        catch (error) {\n            partial_errors.push('managed-switch/port-stats endpoint failed: ' + error);\n        }\n\n        if (status_resp === null && legacy_monitor_resp === null && cmdb_resp === null) {\n            throw partial_errors.join(' ');\n        }\n\n        function resolveKey(v) {\n            var aliases = switchAliases(v),\n                key = '',\n                i;\n\n            for (i = 0; i < aliases.length; i++) {\n                if (aliases[i] !== '' && typeof alias_to_key[aliases[i]] !== 'undefined') {\n                    key = alias_to_key[aliases[i]];\n                    break;\n                }\n            }\n\n            if (key === '') {\n                key = aliases.length > 0 ? aliases[0] : '';\n            }\n\n            if (key === '') {\n                return '';\n            }\n\n            aliases.forEach(function (a) {\n                alias_to_key[a] = key;\n            });\n\n            return key;\n        }\n\n        function mergeObjects(target, src) {\n            Object.keys(src || {}).forEach(function (x) {\n                target[x] = src[x];\n            });\n        }\n\n        arrify(cmdb_resp || {}).forEach(function (item) {\n            var key;\n            if (!isObject(item)) {\n                return;\n            }\n\n            key = resolveKey(item);\n            if (key === '') {\n                return;\n            }\n\n            if (typeof devices[key] === 'undefined') {\n                devices[key] = {\"cfg\": {}, \"status\": {}, \"legacy\": {}, \"health\": {}, \"port_stats\": {}};\n            }\n\n            devices[key].cfg = item;\n        });\n\n        arrify(status_resp || {}).forEach(function (item) {\n            var key;\n            if (!isObject(item)) {\n                return;\n            }\n\n            key = resolveKey(item);\n            if (key === '') {\n                return;\n            }\n\n            if (typeof devices[key] === 'undefined') {\n                devices[key] = {\"cfg\": {}, \"status\": {}, \"legacy\": {}, \"health\": {}, \"port_stats\": {}};\n            }\n\n            devices[key].status = item;\n        });\n\n        arrify(legacy_monitor_resp || {}).forEach(function (item) {\n            var key;\n            if (!isObject(item)) {\n                return;\n            }\n\n            key = resolveKey(item);\n            if (key === '') {\n                return;\n            }\n\n            if (typeof devices[key] === 'undefined') {\n                devices[key] = {\"cfg\": {}, \"status\": {}, \"legacy\": {}, \"health\": {}, \"port_stats\": {}};\n            }\n\n            devices[key].legacy = item;\n        });\n\n        arrify(group_resp || {}).forEach(function (item) {\n            var gname;\n            if (!isObject(item)) {\n                return;\n            }\n\n            gname = clean(first(item, ['name', 'q_origin_key', 'id'], ''));\n            if (gname === '') {\n                return;\n            }\n\n            memberIds(item).forEach(function (m) {\n                if (typeof groups_by_alias[m] === 'undefined') {\n                    groups_by_alias[m] = {};\n                }\n                groups_by_alias[m][gname] = true;\n            });\n        });\n\n        if (isObject(health_resp) && isObject(health_resp.results)) {\n            Object.keys(health_resp.results).forEach(function (serial) {\n                var key = typeof alias_to_key[serial] !== 'undefined' ? alias_to_key[serial] : serial;\n                if (typeof devices[key] === 'undefined') {\n                    devices[key] = {\"cfg\": {}, \"status\": {}, \"legacy\": {}, \"health\": {}, \"port_stats\": {}};\n                    alias_to_key[serial] = key;\n                }\n                devices[key].health = health_resp.results[serial];\n            });\n        }\n\n        arrify(port_stats_resp || {}).forEach(function (item) {\n            var key, ports;\n            if (!isObject(item)) {\n                return;\n            }\n\n            key = resolveKey(item);\n            if (key === '') {\n                return;\n            }\n\n            if (typeof devices[key] === 'undefined') {\n                devices[key] = {\"cfg\": {}, \"status\": {}, \"legacy\": {}, \"health\": {}, \"port_stats\": {}};\n            }\n\n            ports = first(item, ['ports'], {});\n            devices[key].port_stats = isObject(ports) ? ports : {};\n        });\n\n        function normalizePorts(legacy_ports, port_stats_ports) {\n            var ports_out = {},\n                i, pn, p, raw, target;\n\n            function normField(src, target_name, src_keys) {\n                var v = first(src, src_keys, undefined);\n                if (typeof v !== 'undefined' && v !== null && v !== '') {\n                    target[target_name] = v;\n                }\n            }\n\n            function ingest(p, pn) {\n                if (!isObject(p)) {\n                    return;\n                }\n                if (typeof ports_out[pn] === 'undefined') {\n                    ports_out[pn] = {};\n                }\n                target = ports_out[pn];\n                normField(p, 'rx_bytes', ['rx-bytes', 'rx_bytes']);\n                normField(p, 'tx_bytes', ['tx-bytes', 'tx_bytes']);\n                normField(p, 'rx_drops', ['rx-drops', 'rx_drops']);\n                normField(p, 'tx_drops', ['tx-drops', 'tx_drops']);\n                normField(p, 'rx_errors', ['rx-errors', 'rx_errors']);\n                normField(p, 'tx_errors', ['tx-errors', 'tx_errors']);\n                normField(p, 'port_power', ['port_power', 'port-power']);\n                normField(p, 'link_status', ['link_status', 'link-status', 'oper_status', 'oper-status', 'state', 'status']);\n                normField(p, 'speed', ['speed']);\n            }\n\n            if (isObject(port_stats_ports)) {\n                Object.keys(port_stats_ports).forEach(function (pn) {\n                    ingest(port_stats_ports[pn], pn);\n                });\n            }\n\n            if (Array.isArray(legacy_ports)) {\n                for (i = 0; i < legacy_ports.length; i++) {\n                    p = legacy_ports[i];\n                    if (!isObject(p)) {\n                        continue;\n                    }\n                    pn = clean(first(p, ['interface', 'name', 'port'], ''));\n                    if (pn === '') {\n                        continue;\n                    }\n                    ingest(p, pn);\n                }\n            }\n            else if (isObject(legacy_ports)) {\n                Object.keys(legacy_ports).forEach(function (pn) {\n                    ingest(legacy_ports[pn], pn);\n                });\n            }\n\n            return ports_out;\n        }\n\n        function sumPoeUsage(ports_obj) {\n            var sum = 0;\n            if (!isObject(ports_obj)) {\n                return 0;\n            }\n            Object.keys(ports_obj).forEach(function (pn) {\n                var v = Number(ports_obj[pn].port_power);\n                if (!isNaN(v)) {\n                    sum += v;\n                }\n            });\n            return Math.round(sum * 100) / 100;\n        }\n\n        result.data = Object.keys(devices).map(function (k) {\n            var merged = {},\n                cfg = devices[k].cfg || {},\n                status = devices[k].status || {},\n                legacy = devices[k].legacy || {},\n                health = devices[k].health || {},\n                port_stats = devices[k].port_stats || {},\n                aliases = [],\n                alias_seen = {},\n                state,\n                serial,\n                name,\n                version,\n                model,\n                port_summary,\n                group_names = {},\n                hsum,\n                hcpu,\n                hmem,\n                hfan,\n                htemp,\n                huptime,\n                hoverall,\n                ports_out,\n                poe_usage,\n                poe_budget,\n                legacy_ports;\n\n            mergeObjects(merged, cfg);\n            mergeObjects(merged, legacy);\n            mergeObjects(merged, status);\n\n            serial = clean(first(merged, ['serial', 'sn', 'q_origin_key', 'id'], k));\n            name = clean(normalizeName(merged));\n            version = clean(normalizeVersion(merged));\n            model = clean(normalizeModel(merged, serial, version));\n            state = parseStatusParts(merged);\n            port_summary = extractPortSummary(merged);\n\n            switchAliases(merged).concat([k]).forEach(function (a) {\n                if (a !== '' && typeof alias_seen[a] === 'undefined') {\n                    alias_seen[a] = true;\n                    aliases.push(a);\n                }\n            });\n\n            aliases.forEach(function (a) {\n                if (typeof groups_by_alias[a] !== 'undefined') {\n                    Object.keys(groups_by_alias[a]).forEach(function (g) {\n                        group_names[g] = true;\n                    });\n                }\n            });\n\n            hsum = isObject(health) && isObject(health.summary) ? health.summary : {};\n            hcpu = isObject(hsum.cpu) ? Number(hsum.cpu.value) : NaN;\n            hmem = isObject(hsum.memory) ? Number(hsum.memory.value) : NaN;\n            hfan = isObject(hsum.fan) && isObject(hsum.fan.fan) ? clean(safeText(hsum.fan.fan.value)) : '';\n            htemp = isObject(hsum.temperature) ? Number(hsum.temperature.value) : NaN;\n            huptime = isObject(hsum.uptime) ? Number(hsum.uptime.value) : NaN;\n            hoverall = clean(safeText(hsum.overall));\n\n            legacy_ports = first(merged, ['ports', 'port_stats', 'port-stats', 'interfaces'], null);\n            ports_out = normalizePorts(legacy_ports, port_stats);\n            poe_usage = sumPoeUsage(ports_out);\n            poe_budget = Number(first(merged, ['max_poe_budget', 'max-poe-budget'], 0));\n\n            return {\n                \"key\": k,\n                \"serial\": serial,\n                \"name\": name !== '' ? name : serial,\n                \"model\": model,\n                \"ip\": normalizeIp(merged),\n                \"version\": version,\n                \"profile\": normalizeProfile(merged),\n                \"switch_group\": Object.keys(group_names).sort().join(', '),\n                \"admin_state\": state.admin,\n                \"connection_state\": state.conn,\n                \"state_raw\": state.raw,\n                \"state_num\": state.num,\n                \"flags\": normalizeFlags(merged),\n                \"join_time\": normalizeJoinTime(merged),\n                \"port_total\": port_summary.total,\n                \"port_up\": port_summary.up,\n                \"port_down\": port_summary.down,\n                \"description\": clean(first(merged, ['description', 'comments'], '')),\n                \"cpu_usage\": isNaN(hcpu) ? 0 : hcpu,\n                \"mem_usage\": isNaN(hmem) ? 0 : hmem,\n                \"fan_status\": hfan,\n                \"overall_health\": hoverall,\n                \"temperature\": isNaN(htemp) ? 0 : htemp,\n                \"uptime\": isNaN(huptime) ? 0 : huptime,\n                \"eos\": clean(first(merged, ['eos'], '')),\n                \"max_poe_budget\": isNaN(poe_budget) ? 0 : poe_budget,\n                \"poe_usage\": poe_usage,\n                \"ports\": ports_out\n            };\n        });\n\n        result.data.sort(function (a, b) {\n            if (a.name < b.name) {\n                return -1;\n            }\n            if (a.name > b.name) {\n                return 1;\n            }\n            return 0;\n        });\n\n        result.ok = 1;\n                result.error = '';\n    }\n    catch (error) {\n        error_msg = error.toString();\n        error_msg += error_msg.endsWith('.') ? '' : '.';\n        Zabbix.log(3, '[ FortiSwitch by FortiGate HTTP ] ERROR: ' + error_msg);\n        result.error = error_msg;\n    }\n\n    return JSON.stringify(result);\n"
