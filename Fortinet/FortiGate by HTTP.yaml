        - uuid: dfe74c85770d49c9b2303596d7dd03ac
          name: 'IPSec tunnels down'
          type: DEPENDENT
          key: fgate.ipsec.tunnels.down
          delay: '0'
          description: 'Number of IPSec phase 2 tunnels with status down.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var obj = JSON.parse(value);
                  var roots = Array.isArray(obj.results) ? obj.results : [];
                  
                  var tunnelMatchesPattern = '{$FGATE.IPSEC.TUNNEL.MATCHES}';
                  var tunnelNotMatchesPattern = '{$FGATE.IPSEC.TUNNEL.NOT_MATCHES}';
                  var phase1MatchesPattern = '{$FGATE.IPSEC.PHASE1.MATCHES}';
                  var phase1NotMatchesPattern = '{$FGATE.IPSEC.PHASE1.NOT_MATCHES}';
                  
                  function buildRegex(pattern, fallbackPattern) {
                      pattern = String(pattern || fallbackPattern || '.*');
                      var flags = '';
                  
                      if (pattern.indexOf('(?i)') !== -1) {
                          pattern = pattern.replace(/\(\?i\)/g, '');
                          flags = 'i';
                      }
                  
                      try {
                          return new RegExp(pattern, flags);
                      }
                      catch (error) {
                          return new RegExp(fallbackPattern || '(?!)');
                      }
                  }
                  
                  var tunnelMatches = buildRegex(tunnelMatchesPattern, '.*');
                  var tunnelNotMatches = buildRegex(tunnelNotMatchesPattern, '(?!)');
                  var phase1Matches = buildRegex(phase1MatchesPattern, '.*');
                  var phase1NotMatches = buildRegex(phase1NotMatchesPattern, '(?!)');
                  
                  function shouldMonitor(phase1, p2) {
                      var tunnelName = String(p2.p2name || p2.name || '');
                      var phase1Name = String(p2.p1name || phase1.p1name || phase1.phase1name || phase1.name || phase1.vpn_name || '');
                  
                      return tunnelMatches.test(tunnelName)
                          && !tunnelNotMatches.test(tunnelName)
                          && phase1Matches.test(phase1Name)
                          && !phase1NotMatches.test(phase1Name);
                  }
                  
                  var count = 0;
                  roots.forEach(function (phase1) {
                      var proxyids = Array.isArray(phase1.proxyid) ? phase1.proxyid : [];
                      proxyids.forEach(function (p2) {
                          if (shouldMonitor(phase1, p2) && String(p2.status || '').toLowerCase() === 'down') {
                              count++;
                          }
                      });
                  });
                  return count;
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: fgate.ipsec.get_data
          tags:
            - tag: component
              value: ipsec
