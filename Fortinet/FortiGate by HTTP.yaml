                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFKEY}'
          trigger_prototypes:
            - uuid: b21dcb60f79d4d6686209ff4bb0d4dad
              expression: 'change(/FortiGate by HTTP/fgate.netif.speed[{#IFKEY}])<0 and last(/FortiGate by HTTP/fgate.netif.speed[{#IFKEY}])>0  and last(/FortiGate by HTTP/fgate.netif.status[{#IFKEY}])<>0'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: '(change(/FortiGate by HTTP/fgate.netif.speed[{#IFKEY}])>0 and last(/FortiGate by HTTP/fgate.netif.speed[{#IFKEY}],#2)>0)  or last(/FortiGate by HTTP/fgate.netif.status[{#IFKEY}])=0'
              name: 'Interface [{#IFNAME}({#IFALIAS})]: Ethernet has changed to lower speed than it was before'
              opdata: 'Current reported speed: {ITEM.LASTVALUE1}'
              priority: INFO
              description: 'This Ethernet connection has transitioned down from its known maximum speed. This might be a sign of autonegotiation issues. Acknowledge to close the problem manually.'
              manual_close: 'YES'
              dependencies:
                - name: 'Interface [{#IFNAME}({#IFALIAS})]: Link down'
                  expression: '{$NET.IF.CONTROL:"{#IFNAME}"}=1 and last(/FortiGate by HTTP/fgate.netif.status[{#IFKEY}])=0 and (last(/FortiGate by HTTP/fgate.netif.status[{#IFKEY}],#1)<>last(/FortiGate by HTTP/fgate.netif.status[{#IFKEY}],#2))'
                  recovery_expression: 'last(/FortiGate by HTTP/fgate.netif.status[{#IFKEY}])<>0 or {$NET.IF.CONTROL:"{#IFNAME}"}=0'
              tags:
                - tag: scope
                  value: performance
            - uuid: 5aa7f2cacfc54b6eadfd9817b967725a
              expression: '(avg(/FortiGate by HTTP/fgate.netif.in[{#IFKEY}],15m)>({$NET.IF.UTIL.MAX:"{#IFNAME}"}/100)*last(/FortiGate by HTTP/fgate.netif.speed[{#IFKEY}]) or  avg(/FortiGate by HTTP/fgate.netif.out[{#IFKEY}],15m)>({$NET.IF.UTIL.MAX:"{#IFNAME}"}/100)*last(/FortiGate by HTTP/fgate.netif.speed[{#IFKEY}]))  and last(/FortiGate by HTTP/fgate.netif.speed[{#IFKEY}])>0'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'avg(/FortiGate by HTTP/fgate.netif.in[{#IFKEY}],15m)<(({$NET.IF.UTIL.MAX:"{#IFNAME}"}-3)/100)*last(/FortiGate by HTTP/fgate.netif.speed[{#IFKEY}])  and avg(/FortiGate by HTTP/fgate.netif.out[{#IFKEY}],15m)<(({$NET.IF.UTIL.MAX:"{#IFNAME}"}-3)/100)*last(/FortiGate by HTTP/fgate.netif.speed[{#IFKEY}])'
              name: 'Interface [{#IFNAME}({#IFALIAS})]: High bandwidth usage'
              event_name: 'Interface [{#IFNAME}({#IFALIAS})]: High bandwidth usage (>{$NET.IF.UTIL.MAX:"{#IFNAME}"}%)'
              opdata: 'In: {ITEM.LASTVALUE1}, out: {ITEM.LASTVALUE3}, speed: {ITEM.LASTVALUE2}'
              priority: WARNING
              description: 'The utilization of the network interface is close to its estimated maximum bandwidth.'
              manual_close: 'YES'
              dependencies:
                - name: 'Interface [{#IFNAME}({#IFALIAS})]: Link down'
                  expression: '{$NET.IF.CONTROL:"{#IFNAME}"}=1 and last(/FortiGate by HTTP/fgate.netif.status[{#IFKEY}])=0 and (last(/FortiGate by HTTP/fgate.netif.status[{#IFKEY}],#1)<>last(/FortiGate by HTTP/fgate.netif.status[{#IFKEY}],#2))'
                  recovery_expression: 'last(/FortiGate by HTTP/fgate.netif.status[{#IFKEY}])<>0 or {$NET.IF.CONTROL:"{#IFNAME}"}=0'
              tags:
                - tag: scope
                  value: performance
            - uuid: 9ef845b9e393423f96403ea4c195859e
              expression: 'min(/FortiGate by HTTP/fgate.netif.in_errors[{#IFKEY}],5m)>{$NET.IF.ERRORS.WARN:"{#IFKEY}"} or min(/FortiGate by HTTP/fgate.netif.out_errors[{#IFKEY}],5m)>{$NET.IF.ERRORS.WARN:"{#IFKEY}"}'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'max(/FortiGate by HTTP/fgate.netif.in_errors[{#IFKEY}],5m)<{$NET.IF.ERRORS.WARN:"{#IFKEY}"}*0.8 and max(/FortiGate by HTTP/fgate.netif.out_errors[{#IFKEY}],5m)<{$NET.IF.ERRORS.WARN:"{#IFKEY}"}*0.8'
              name: 'Interface [{#IFNAME}({#IFALIAS})]: High error rate'
              event_name: 'Interface [{#IFNAME}({#IFALIAS})]: High error rate (>{$NET.IF.ERRORS.WARN:"{#IFKEY}"} for 5m)'
              opdata: 'errors in: {ITEM.LASTVALUE1}, errors out: {ITEM.LASTVALUE2}'
              priority: WARNING
              description: 'It recovers when it is below 80% of the `{$NET.IF.ERRORS.WARN:"{#IFKEY}"}` threshold.'
              manual_close: 'YES'
              dependencies:
                - name: 'Interface [{#IFNAME}({#IFALIAS})]: Link down'
                  expression: '{$NET.IF.CONTROL:"{#IFNAME}"}=1 and last(/FortiGate by HTTP/fgate.netif.status[{#IFKEY}])=0 and (last(/FortiGate by HTTP/fgate.netif.status[{#IFKEY}],#1)<>last(/FortiGate by HTTP/fgate.netif.status[{#IFKEY}],#2))'
                  recovery_expression: 'last(/FortiGate by HTTP/fgate.netif.status[{#IFKEY}])<>0 or {$NET.IF.CONTROL:"{#IFNAME}"}=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
          graph_prototypes:
            - uuid: 5d5b2b5c35a7433999f29f4f22a6d380
              name: 'Interface [{#IFNAME}({#IFALIAS})]: Network traffic'
              graph_items:
                - drawtype: GRADIENT_LINE
                  color: 199C0D
