        - uuid: 13b8d4522bb94502a1a397cbcc64c5f3
          name: 'Get HA cluster data'
          type: SCRIPT
          key: fgate.ha.get_data
          history: '0'
          value_type: TEXT
          trends: '0'
          params: |
            var params = JSON.parse(value),
                request = new HttpRequest(),
                result = {
                    data: {
                        config: {
                            enabled: 0,
                            mode: 'standalone',
                            mode_num: 0,
                            group_id: 0,
                            group_name: ''
                        },
                        cluster: {
                            members_count: 0,
                            primary: '',
                            status: 1,
                            sync_status: 1,
                            state: 1,
                            failover_ready: 2,
                            failover_reason: 'HA disabled or standalone'
                        },
                        members: [],
                        members_lld: []
                    },
                    error: ''
                },
                api_url = '',
                error_msg = '',
                errors = [],
                member_map = {},
                member_key_by_serial = {},
                member_key_by_hostname = {},
                expected_members = 0;
            
            function getHttpData(url) {
                var response = request.get(url);
                Zabbix.log(4, '[ FortiGate HA ] [ ' + url + ' ] Received response with status code ' + request.getStatus() + ': ' + response);
            
                if (request.getStatus() !== 200) {
                    throw 'Failed to receive data from ' + url + ': invalid response status code ' +  request.getStatus() + '.';
                }
            
                if (response !== null) {
                    try {
                        response = JSON.parse(response);
                    }
                    catch (error) {
                        throw 'Failed to parse response received from FortiGate API.';
                    }
                }
            
                if (typeof response !== 'object' || response === null) {
                    throw 'Cannot process response data: received data is not an object.';
                }
            
                if (typeof response.status !== 'undefined' && response.status !== 'success') {
                    throw 'FortiGate API returned non-success status for ' + url + '.';
                }
            
                if (typeof response.results === 'undefined' && typeof response.data === 'undefined') {
                    throw 'Cannot process response data from ' + url + ': missing results field.';
                }
            
                return response;
            }
            
            function getFirst(paths, required, label) {
                var last_error = '';
                for (var i = 0; i < paths.length; i++) {
                    try {
                        return getHttpData(api_url + paths[i]);
                    }
                    catch (error) {
                        last_error = error.toString();
                        Zabbix.log(3, '[ FortiGate HA ] ' + label + ' endpoint failed: ' + last_error);
                    }
                }
                if (required) {
                     throw label + ': ' + last_error;
                }
                return null;
            }
            
            function unwrap(response) {
                if (response === null || typeof response === 'undefined') {
                    return null;
                }
                if (typeof response.results !== 'undefined') {
                    return response.results;
                }
                if (typeof response.data !== 'undefined') {
                    return response.data;
                }
                return response;
            }
            
            function hasOwn(obj, key) {
                return Object.prototype.hasOwnProperty.call(obj, key);
            }
            
            function getValue(obj, keys, def) {
                if (typeof obj !== 'object' || obj === null) {
                    return def;
                }
                for (var i = 0; i < keys.length; i++) {
                    var k = keys[i];
                    if (hasOwn(obj, k) && obj[k] !== null && typeof obj[k] !== 'undefined' && obj[k] !== '') {
                        return obj[k];
                    }
                }
                return def;
            }
            
            function toStringValue(v, def) {
                if (v === null || typeof v === 'undefined') {
                    return def;
                }
                return String(v);
            }
            
            function toNumber(v, def) {
                if (v === null || typeof v === 'undefined' || v === '') {
                    return def;
                }
                if (typeof v === 'boolean') {
                    return v ? 1 : 0;
                }
                if (typeof  v === 'number') {
                    return v;
                }
                var s = String(v).replace(/%/g, '').replace(/,/g, '').trim();
                var n = parseFloat(s);
                return isNaN(n) ? def : n;
            }
            
            function toInteger(v, def) {
                var n = toNumber(v, def);
                return (n === def) ? def : Math.round(n);
            }
            
            function modeToNum(mode) {
                var m = String(mode || '').toLowerCase();
                if (m === '' || m === 'standalone' || m === 'none' || m === 'disable' || m === 'disabled') {
                    return 0;
                }
                if (m === 'a-p' || m === 'ap' || m.indexOf('passive') !== -1 || m.indexOf('active-passive') !== -1) {
                    return 1;
                }
                if (m === 'a-a' || m === 'aa' || m.indexOf('active-active') !== -1) {
                    return 2;
                }
                return 3;
            }
            
            function enabledFromMode(mode) {
                return modeToNum(mode) === 0 ? 0 : 1;
            }
            
            function cleanKey(s, fallback) {
                s = String(s || fallback || 'unknown').replace(/^\s+|\s+$/g, '');
                if (s === '') {
                    s = String(fallback || 'unknown');
                }
                s = s.replace(/[^A-Za-z0-9_.-]/g, '_');
                if (s.length > 180) {
                    s = s.substring(0, 180);
                }
                return s;
            }
            
            function looksLikeSerial(s) {
                s = String(s || '');
                 if (s === '' || s === 'root' || s === 'global' || s === 'vdom' || s === 'results' || s === 'members') {
                    return false;
                }
                return /^[A-Za-z0-9][A-Za-z0-9_.-]{7,}$/.test(s);
            }
            
            function normalizeRole(v) {
                if (typeof v === 'boolean') {
                    return v ? 1 : 2;
                }
                if (typeof v === 'number') {
                    if (v === 1) { return 1; }
                    if (v === 2) { return 2; }
                    if (v === 0) { return 0; }
                }
                var s = String(v || '').toLowerCase();
                if (s === '') { return 0; }
                if (s === '1' || s.indexOf('primary') !== -1 || s.indexOf('master') !== -1 || s.indexOf('root') !== -1 || s === 'main') {
                    return 1;
                }
                if (s === '2' || s.indexOf('secondary') !== -1 || s.indexOf('slave') !== -1 || s.indexOf('backup') !== -1 || s.indexOf('subordinate') !== -1) {
                    return 2;
                }
                if (s.indexOf('standalone') !== -1) {
                    return 3;
                }
                return 0;
            }
            
            function roleToText(n) {
                if (n === 1) { return 'primary'; }
                if (n === 2) { return 'secondary'; }
                if (n === 3) { return 'standalone'; }
                return 'unknown';
            }
            
            function normalizeState(v, def) {
                if (typeof v === 'boolean') {
                     return v ? 1 : 0;
                }
                if (typeof v === 'number') {
                    if (v === 1) { return 1; }
                    if (v === 0) { return 0; }
                    return 2;
                }
                var s = String(v || '').toLowerCase();
                if (s === '') { return def; }
                if (s === '1' || s.indexOf('up') !== -1 || s.indexOf('online') !== -1 || s.indexOf('alive') !== -1 || s.indexOf('running') !== -1 || s.indexOf('ok') !== -1 || s.indexOf('healthy') !== -1 || s.indexOf('active') !== -1) {
                    return 1;
                }
                if (s === '0' || s.indexOf('down') !== -1 || s.indexOf('offline') !== -1 || s.indexOf('dead') !== -1 || s.indexOf('fail') !== -1 || s.indexOf('error') !== -1 || s.indexOf('lost') !== -1 || s.indexOf('unavailable') !== -1) {
                    return 0;
                }
                return 2;
            }
            
            function stateToText(n) {
                if (n === 1) { return 'up'; }
                if (n === 0) { return 'down'; }
                return 'unknown';
            }
            
            function normalizeSync(v) {
                if (typeof v === 'boolean') {
                    return v ? 1 : 0;
                }
                if (typeof v === 'number') {
                    if (v === 1) { return 1; }
                    if (v === 0) { return 0; }
                    return 2;
                }
                var s = String(v || '').toLowerCase();
                if (s === '') { return  2; }
                if (s.indexOf('out') !== -1 || s.indexOf('not') !== -1 || s.indexOf('unsync') !== -1 || s.indexOf('mismatch') !== -1 || s.indexOf('different') !== -1 || s.indexOf('fail') !== -1 || s.indexOf('error') !== -1) {
                    return 0;
                }
                if (s === '1' || s.indexOf('in-sync') !== -1 || s.indexOf('in sync') !== -1 || s.indexOf('synchronized') !== -1 || s.indexOf('synchronised') !== -1 || s.indexOf('sync') !== -1 || s.indexOf('same') !== -1 || s.indexOf('ok') !== -1) {
                    return 1;
                }
                return 2;
            }
            
            function syncToText(n) {
                if (n === 1) { return 'in-sync'; }
                if (n === 0) { return 'out-of-sync'; }
                return 'unknown';
            }
            
            
            function checksumScalar(v) {
                if (v === null || typeof v === 'undefined') {
                    return '';
                }
                if (typeof v === 'boolean') {
                    return v ? 'true' : 'false';
                }
                if (typeof v === 'number') {
                    return String(v);
                }
                var s = String(v).replace(/^\s+|\s+$/g, '').toLowerCase();
                if (s === '') {
                    return '';
                }
                return s;
            }
            
            function normalizeChecksum(value) {
                if (value === null || typeof value === 'undefined') {
                    return '';
                }
                if (Array.isArray(value))  {
                    var arr = [];
                    for (var i = 0; i < value.length; i++) {
                        var av = normalizeChecksum(value[i]);
                        if (av !== '') {
                            arr.push(av);
                        }
                    }
                    return arr.join(',');
                }
                if (typeof value === 'object') {
                    var parts = [];
                    for (var k in value) {
                        if (hasOwn(value, k)) {
                            var cv = normalizeChecksum(value[k]);
                            if (cv !== '') {
                                parts.push(String(k).toLowerCase() + ':' + cv);
                            }
                        }
                    }
                    parts.sort();
                    return parts.join('|');
                }
                return checksumScalar(value);
            }
            
            function extractChecksumInfo(src) {
                var checksum = {},
                    base = getValue(src, ['checksum', 'checksums'], ''),
                    v;
            
                if (typeof base === 'object' && base !== null) {
                    checksum = base;
                }
                else if (base !== '') {
                    checksum.all = base;
                }
            
                v = getValue(src, ['all', 'checksum_all', 'all_checksum'], '');
                if (v !== '') { checksum.all = v; }
            
                v = getValue(src, ['global', 'checksum_global', 'global_checksum'], '');
                if (v !== '') {  checksum.global = v; }
            
                v = getValue(src, ['root', 'checksum_root', 'root_checksum'], '');
                if (v !== '') { checksum.root = v; }
            
                return {
                    norm: normalizeChecksum(checksum),
                    all: normalizeChecksum(getValue(checksum, ['all', 'checksum_all', 'all_checksum'], '')),
                    global: normalizeChecksum(getValue(checksum, ['global', 'checksum_global', 'global_checksum'], '')),
                    root: normalizeChecksum(getValue(checksum, ['root', 'checksum_root', 'root_checksum'], ''))
                };
            }
            
            function keyFor(serial, hostname, idx) {
                var existing = '';
                if (serial && hasOwn(member_key_by_serial, serial)) {
                    return member_key_by_serial[serial];
                }
                if (hostname && hasOwn(member_key_by_hostname, hostname)) {
                    return member_key_by_hostname[hostname];
                }
                var base = cleanKey(serial || hostname || ('member_' + idx), 'member_' + idx);
                var key = base;
                var i = 2;
                while (hasOwn(member_map, key)) {
                    key = base + '_' + i;
                    i++;
                }
                return key;
            }
            
            function rememberIndexes(m) {
                if (m.serial) {
                    member_key_by_serial[m.serial] = m.key;
                }
                if (m.hostname) {
                     member_key_by_hostname[m.hostname] = m.key;
                }
            }
            
            function mergeMember(src, source, parentKey) {
                if (typeof src !== 'object' || src === null) {
                    return;
                }
            
                var serial = toStringValue(getValue(src, ['serial', 'serial_no', 'serial-number', 'serial_number', 'sn', 'devid', 'device_id', 'device-id', 'member_serial'], ''), '');
                if (serial === '' && looksLikeSerial(parentKey)) {
                    serial = String(parentKey);
                }
            
                var hostname = toStringValue(getValue(src, ['hostname', 'host_name', 'host-name', 'name', 'device_name', 'devname', 'member_name'], ''), '');
                if (hostname === '' && serial !== '' && !looksLikeSerial(parentKey)) {
                    hostname = serial;
                }
                if (serial === '' && hostname === '') {
                    return;
                }
            
                var key = keyFor(serial, hostname, Object.keys(member_map).length + 1);
                var m = member_map[key] || {
                    key: key,
                    serial: serial || hostname,
                    hostname: hostname || serial,
                    role: 0,
                    role_text: 'unknown',
                    state: 1,
                    state_text: 'up',
                    sync: 2,
                    sync_text: 'unknown',
                    seen_stats: 0,
                    seen_checksum: 0,
                     seen_peer: 0,
                    priority: 0,
                    vdom: '',
                    cpu_usage: 0,
                    mem_usage: 0,
                    net_usage: 0,
                    sessions: 0,
                    traffic_bytes: 0,
                    packets: 0,
                    virus_events: 0,
                    ips_events: 0,
                    uptime: 0,
                    checksum_norm: '',
                    checksum_all: '',
                    checksum_global: '',
                    checksum_root: ''
                };
            
                if (serial !== '') { m.serial = serial; }
                if (hostname !== '') { m.hostname = hostname; }
                if (source === 'ha-statistics') { m.seen_stats = 1; }
                if (source === 'ha-checksums') { m.seen_checksum = 1; }
                if (source === 'ha-peer') { m.seen_peer = 1; }
            
                var role_candidate = getValue(src, ['role', 'ha_role', 'cluster_role', 'member_role', 'ha_state'], '');
                if (role_candidate === '') {
                    var primary_candidate = getValue(src, ['primary', 'Primary', 'is_primary', 'is_master', 'is_root_master', 'is_manage_master', 'root_master', 'manage_master'], '');
                    if (primary_candidate !== '') {
                        role_candidate = primary_candidate;
                    }
                }
                var role_num = normalizeRole(role_candidate);
                if (role_num !== 0) {
                    m.role = role_num;
                     m.role_text = roleToText(role_num);
                }
            
                var sync_candidate = getValue(src, ['sync_status', 'sync-state', 'sync_state', 'sync', 'configuration_status', 'configuration-status', 'cfg_sync', 'conf_sync', 'checksum_status', 'checksum-status', 'checksum'], '');
                var sync_num = normalizeSync(sync_candidate);
                if (sync_num !== 2) {
                    m.sync = sync_num;
                    m.sync_text = syncToText(sync_num);
                }
            
                var state_candidate = getValue(src, ['state', 'connection', 'connection_status', 'connection-status', 'health', 'member_state', 'member-state'], '');
                if (state_candidate === '') {
                    var status_candidate = getValue(src, ['status'], '');
                    var status_role = normalizeRole(status_candidate);
                    var status_sync = normalizeSync(status_candidate);
                    if (status_role === 0 && status_sync === 2) {
                        state_candidate = status_candidate;
                    }
                }
                var state_num = normalizeState(state_candidate, 1);
                m.state = state_num;
                m.state_text = stateToText(state_num);
            
                m.priority = toInteger(getValue(src, ['priority', 'prio', 'ha_priority', 'device_priority'], m.priority), m.priority);
                m.vdom  = toStringValue(getValue(src, ['vdom', 'vd'], m.vdom), m.vdom);
                m.cpu_usage = toNumber(getValue(src, ['cpu_usage', 'cpu', 'cpu_usage_percent', 'cpu_percent', 'cpu-usage'], m.cpu_usage), m.cpu_usage);
                m.mem_usage = toNumber(getValue(src, ['mem_usage', 'memory_usage', 'memory', 'mem', 'mem_usage_percent', 'memory_percent', 'mem-usage'], m.mem_usage), m.mem_usage);
                m.net_usage = toNumber(getValue(src, ['net_usage', 'network_usage', 'network', 'network_usage_percent', 'net-usage'], m.net_usage), m.net_usage);
                m.sessions = toInteger(getValue(src, ['sessions', 'session', 'session_count', 'session-count'], m.sessions), m.sessions);
                m.traffic_bytes = toNumber(getValue(src, ['tbyte', 'traffic_bytes', 'traffic', 'bytes', 'total_bytes', 'total-bytes'], m.traffic_bytes), m.traffic_bytes);
                m.packets = toNumber(getValue(src, ['packets', 'packet', 'total_packets', 'total-packets'], m.packets), m.packets);
                m.virus_events = toNumber(getValue(src, ['virus_events', 'virus', 'virus-events'], m.virus_events), m.virus_events);
                m.ips_events = toNumber(getValue(src, ['ips_events', 'ips', 'ips-events'], m.ips_events), m.ips_events);
                m.uptime = toNumber(getValue(src,  ['uptime', 'up_time', 'uptime_seconds', 'uptime-seconds'], m.uptime), m.uptime);
            
                var checksum_info = extractChecksumInfo(src);
                if (checksum_info.norm !== '') {
                    m.checksum_norm = checksum_info.norm;
                    m.checksum_all = checksum_info.all;
                    m.checksum_global = checksum_info.global;
                    m.checksum_root = checksum_info.root;
                }
            
                member_map[key] = m;
                rememberIndexes(m);
            }
            
            function looksLikeMemberObject(obj, parentKey) {
                if (typeof obj !== 'object' || obj === null) {
                    return false;
                }
                if (getValue(obj, ['hostname', 'host_name', 'name', 'serial', 'serial_no', 'serial-number', 'serial_number', 'sn'], '') !== '') {
                    return true;
                }
                if (looksLikeSerial(parentKey) && (
                    typeof obj.cpu_usage !== 'undefined' ||
                    typeof obj.mem_usage !== 'undefined' ||
                    typeof obj.sessions !== 'undefined' ||
                    typeof obj.tbyte !== 'undefined' ||
                    typeof obj.priority !== 'undefined')) {
                    return true;
                }
                return false;
            }
            
            function walkMembers(obj, source, parentKey) {
                if (obj === null || typeof obj === 'undefined') {
                    return;
                }
                if  (Array.isArray(obj)) {
                    for (var i = 0; i < obj.length; i++) {
                        walkMembers(obj[i], source, parentKey);
                    }
                    return;
                }
                if (typeof obj === 'object') {
                    if (looksLikeMemberObject(obj, parentKey)) {
                        mergeMember(obj, source, parentKey);
                        return;
                    }
                    for (var k in obj) {
                        if (hasOwn(obj, k)) {
                            walkMembers(obj[k], source, k);
                        }
                    }
                }
            }
            
            function findRootMaster(obj) {
                if (obj === null || typeof obj === 'undefined') {
                    return '';
                }
                if (Array.isArray(obj)) {
                    for (var i = 0; i < obj.length; i++) {
                        var v = findRootMaster(obj[i]);
                        if (v !== '') { return v; }
                    }
                    return '';
                }
                if (typeof obj === 'object') {
                    var serial = getValue(obj, ['serial', 'serial_no', 'serial-number', 'serial_number', 'sn'], '');
                    var primary = getValue(obj, ['root_master', 'is_root_master', 'primary', 'Primary', 'is_primary'], '');
                    if (primary !== '' && (primary === true || String(primary) === '1' || String(primary).toLowerCase() === 'true') && serial !== '')  {
                        return String(serial);
                    }
                    if (hasOwn(obj, 'root_master') && typeof obj.root_master !== 'object' && obj.root_master !== true && obj.root_master !== false) {
                        return String(obj.root_master);
                    }
                    for (var k in obj) {
                        if (hasOwn(obj, k)) {
                            var r = findRootMaster(obj[k]);
                            if (r !== '') { return r; }
                        }
                    }
                }
                return '';
            }
            
            expected_members = parseInt(params.expected_members || '0', 10);
            if (isNaN(expected_members)) {
                expected_members = 0;
            }
            
            try {
                ['scheme', 'api.token', 'api.fqdn', 'api.port'].forEach(function (field) {
                    var macro = '{$FGATE.' + field.toUpperCase() + '}';
                    var key = field.split('.').pop();
                    if (params[key] === macro || params[key] === '') {
                        throw 'Please change ' + macro + ' macro to the proper value.';
                    }
                    if (typeof params[key] === 'undefined') {
                        throw 'Please set "' + key + '" script input parameter to ' + macro + ' macro value.';
                    }
                });
            
                if (typeof params.http_proxy !== 'undefined' && params.http_proxy !== '{' + '$FGATE.HTTP.PROXY}'  && params.http_proxy !== '') {
                    request.setProxy(params.http_proxy);
                }
            
                request.addHeader('Accept: application/json');
                request.addHeader('Authorization: Bearer ' + params.token);
            
                api_url = params.scheme + '://' + params.fqdn + ':' + params.port;
            
                var ha_config = getFirst([
                    '/api/v2/cmdb/system/ha'
                ], true, 'HA configuration');
            
                var config = unwrap(ha_config);
                var mode = toStringValue(getValue(config, ['mode'], 'standalone'), 'standalone');
                result.data.config.mode = mode;
                result.data.config.mode_num = modeToNum(mode);
                result.data.config.enabled = enabledFromMode(mode);
                result.data.config.group_id = toInteger(getValue(config, ['group-id', 'group_id', 'group'], 0), 0);
                result.data.config.group_name = toStringValue(getValue(config, ['group-name', 'group_name'], ''), '');
            
                if (result.data.config.enabled === 1) {
                    var ha_stats = getFirst([
                        '/api/v2/monitor/system/ha-statistics/select/',
                        '/api/v2/monitor/system/ha-statistics/select',
                        '/api/v2/monitor/system/ha-statistics'
                    ], true, 'HA statistics');
                    walkMembers(unwrap(ha_stats),  'ha-statistics', '');
            
                    var ha_peer = getFirst([
                        '/api/v2/monitor/system/ha-peer/select/',
                        '/api/v2/monitor/system/ha-peer/select',
                        '/api/v2/monitor/system/ha-peer'
                    ], false, 'HA peer');
                    walkMembers(unwrap(ha_peer), 'ha-peer', '');
            
                    var ha_checksums = getFirst([
                        '/api/v2/monitor/system/ha-checksums/select/',
                        '/api/v2/monitor/system/ha-checksums/select',
                        '/api/v2/monitor/system/ha-checksums'
                    ], false, 'HA checksums');
                    var checksum_results = unwrap(ha_checksums);
                    walkMembers(checksum_results, 'ha-checksums', '');
            
                    var root_master = findRootMaster(checksum_results);
                    if (root_master !== '') {
                        for (var mk in member_map) {
                            if (hasOwn(member_map, mk)) {
                                var m = member_map[mk];
                                if (m.serial === root_master || m.hostname === root_master || m.key === cleanKey(root_master, root_master)) {
                                    m.role = 1;
                                    m.role_text = 'primary';
                                }
                                else if (m.role === 0) {
                                     m.role = 2;
                                    m.role_text = 'secondary';
                                }
                            }
                        }
                    }
            
                    var reference_checksum = '';
                    for (var ck in member_map) {
                        if (hasOwn(member_map, ck)) {
                            var cm = member_map[ck];
                            if (cm.role === 1 && cm.checksum_norm !== '') {
                                reference_checksum = cm.checksum_norm;
                                break;
                            }
                        }
                    }
                    if (reference_checksum === '') {
                        for (var fk in member_map) {
                            if (hasOwn(member_map, fk) && member_map[fk].checksum_norm !== '') {
                                reference_checksum = member_map[fk].checksum_norm;
                                break;
                            }
                        }
                    }
                    if (reference_checksum !== '') {
                        for (var sk in member_map) {
                            if (hasOwn(member_map, sk) && member_map[sk].checksum_norm !== '') {
                                member_map[sk].sync = (member_map[sk].checksum_norm === reference_checksum) ? 1 : 0;
                                member_map[sk].sync_text = syncToText(member_map[sk].sync);
                             }
                        }
                    }
            
                    for (var ok in member_map) {
                        if (hasOwn(member_map, ok)) {
                            var om = member_map[ok];
                            if ((om.seen_stats === 1 || om.seen_checksum === 1) && om.state === 2) {
                                om.state = 1;
                                om.state_text = stateToText(om.state);
                            }
                            if (om.seen_peer === 1 && om.seen_stats !== 1 && om.seen_checksum !== 1) {
                                om.state = 0;
                                om.state_text = stateToText(om.state);
                            }
                        }
                    }
            
                }
            
                var members = [];
                for (var key in member_map) {
                    if (hasOwn(member_map, key)) {
                        members.push(member_map[key]);
                    }
                }
            
                members.sort(function (a, b) {
                    if (a.role !== b.role) {
                        if (a.role === 1) { return -1; }
                        if (b.role === 1) { return 1; }
                    }
                    return String(a.hostname).localeCompare(String(b.hostname));
                });
            
                var any_down = 0,
                    any_out_of_sync = 0,
                    known_sync = 0,
                    primary = '';
            
                members.forEach(function (m) {
                    if (m.role === 1 && primary  === '') {
                        primary = m.hostname || m.serial;
                    }
                    if (m.state === 0) {
                        any_down = 1;
                    }
                    if (m.sync === 0) {
                        any_out_of_sync = 1;
                    }
                    if (m.sync !== 2) {
                        known_sync++;
                    }
                });
            
                result.data.members = members;
                result.data.members_lld = members.map(function (m) {
                    return {
                        key: m.key,
                        hostname: m.hostname,
                        serial: m.serial,
                        role: m.role_text,
                        state: m.state_text,
                        sync: m.sync_text,
                        vdom: m.vdom
                    };
                });
                result.data.cluster.members_count = members.length;
                result.data.cluster.primary = primary;
                result.data.cluster.state = any_down ? 0 : 1;
                result.data.cluster.sync_status = result.data.config.enabled === 0 ? 1 : (any_out_of_sync ? 0 : (known_sync > 0 ? 1 : 2));
            
                var failover_reasons = [];
                if (result.data.config.enabled === 1) {
                    if (expected_members > 0 && members.length !== expected_members) {
                        failover_reasons.push('member count ' + members.length + ' does not match expected ' + expected_members);
                     }
                    if (members.length === 0) {
                        failover_reasons.push('no HA members discovered');
                    }
                    if (any_down) {
                        failover_reasons.push('one or more HA members are down');
                    }
                    if (any_out_of_sync) {
                        failover_reasons.push('one or more HA members are out of sync');
                    }
                    if (known_sync === 0) {
                        failover_reasons.push('HA sync state is unknown');
                    }
            
                    result.data.cluster.failover_ready = failover_reasons.length === 0 ? 1 : 0;
                    result.data.cluster.failover_reason = failover_reasons.length === 0 ? 'HA members are up and in sync' : failover_reasons.join('; ');
                }
                else {
                    result.data.cluster.failover_ready = 2;
                    result.data.cluster.failover_reason = 'HA disabled or standalone';
                }
            
                result.data.cluster.status = result.data.config.enabled === 0 ? 1 : (result.data.cluster.failover_ready === 1 ? 1 : 0);
            } catch (error) {
                error_msg = error.toString();
                error_msg += error_msg.endsWith('.') ? '' : '.';
                Zabbix.log(3, '[ FortiGate HA ] ERROR: ' + error_msg);
            }
            
            if (errors.length > 0) {
                error_msg += (error_msg  === '' ? '' : ' ') + errors.join(' ');
            }
            
            result.error = error_msg;
            
            return JSON.stringify(result);
          description: 'Item for gathering FortiGate HA configuration, HA members, and HA statistics from the FortiGate API.'
          timeout: '{$FGATE.DATA.TIMEOUT}'
          parameters:
            - name: expected_members
              value: '{$FGATE.HA.EXPECTED.MEMBERS}'
            - name: fqdn
              value: '{$FGATE.API.FQDN}'
            - name: http_proxy
              value: '{$FGATE.HTTP.PROXY}'
            - name: port
              value: '{$FGATE.API.PORT}'
            - name: scheme
              value: '{$FGATE.SCHEME}'
            - name: token
              value: '{$FGATE.API.TOKEN}'
          tags:
            - tag: component
              value: ha
            - tag: component
              value: raw
