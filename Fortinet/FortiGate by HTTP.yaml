  triggers:
    - uuid: 8c39ecb47ef44d588c36a492deea3d4d
      expression: '{$FGATE.HA.MONITOR}=1 and {$FGATE.HA.SYNC.CONTROL}=1 and last(/FortiGate by HTTP/fgate.ha.enabled)=1 and last(/FortiGate by HTTP/fgate.ha.sync.status)=0'
      recovery_mode: RECOVERY_EXPRESSION
      recovery_expression: 'last(/FortiGate by HTTP/fgate.ha.enabled)=0 or last(/FortiGate by HTTP/fgate.ha.sync.status)<>0 or {$FGATE.HA.MONITOR}=0 or {$FGATE.HA.SYNC.CONTROL}=0'
      name: 'FortiGate HA cluster is out of sync'
      opdata: 'Current sync state: {ITEM.LASTVALUE1}'
      priority: HIGH
      description: 'At least one HA member reports an out-of-sync state.'
      tags:
        - tag: scope
          value: availability
    - uuid: 87ebb85e04094aa5850c928cf8d2666c
      expression: '{$FGATE.HA.MONITOR}=1 and last(/FortiGate by HTTP/fgate.ha.enabled)=1 and last(/FortiGate by HTTP/fgate.ha.members.count)<>{$FGATE.HA.EXPECTED.MEMBERS}'
      recovery_mode: RECOVERY_EXPRESSION
      recovery_expression: 'last(/FortiGate by HTTP/fgate.ha.enabled)=0 or last(/FortiGate by HTTP/fgate.ha.members.count)={$FGATE.HA.EXPECTED.MEMBERS} or {$FGATE.HA.MONITOR}=0'
      name: 'FortiGate HA cluster member count does not match expected'
      opdata: 'Current members: {ITEM.LASTVALUE1}; expected: {$FGATE.HA.EXPECTED.MEMBERS}'
      priority: HIGH
      description: 'The number of discovered HA members differs from {$FGATE.HA.EXPECTED.MEMBERS}. This can indicate that the secondary FortiGate is missing/offline or that the expected member count macro needs adjustment.'
      tags:
        - tag: scope
          value: availability
    - uuid: d615aecf3d684046b9e3edfeffa11efd
      expression: '{$FGATE.HA.MONITOR}=1 and last(/FortiGate by HTTP/fgate.ha.enabled)=1 and last(/FortiGate by HTTP/fgate.ha.failover.ready)=3'
      recovery_mode: RECOVERY_EXPRESSION
      recovery_expression: 'last(/FortiGate by HTTP/fgate.ha.enabled)=0 or last(/FortiGate by HTTP/fgate.ha.failover.ready)<>3 or {$FGATE.HA.MONITOR}=0'
      name: 'FortiGate HA failover readiness is unknown'
      opdata: 'Readiness: {ITEM.LASTVALUE1}'
      priority: WARNING
      description: 'Zabbix could not determine HA failover readiness from the FortiGate HA API data.'
      tags:
        - tag: scope
          value: availability
    - uuid: f2110677cd19486ca207b88119c79cb2
      expression: '{$FGATE.HA.MONITOR}=1 and last(/FortiGate by HTTP/fgate.ha.enabled)=1 and last(/FortiGate by HTTP/fgate.ha.failover.ready)=0'
      recovery_mode: RECOVERY_EXPRESSION
      recovery_expression: 'last(/FortiGate by HTTP/fgate.ha.enabled)=0 or last(/FortiGate by HTTP/fgate.ha.failover.ready)<>0 or {$FGATE.HA.MONITOR}=0'
      name: 'FortiGate HA failover readiness problem'
      opdata: 'Readiness: {ITEM.LASTVALUE1}'
      priority: HIGH
      description: 'The HA cluster should be considered risky for failover because at least one readiness condition failed: member count, member state, or sync/checksum state.'
      tags:
        - tag: scope
          value: availability
