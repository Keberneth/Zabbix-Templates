                - sortorder: '5'
                  color: 6C59DC
                  yaxisside: RIGHT
                  item:
                    host: 'FortiGate by HTTP'
                    key: 'fgate.netif.out_packets[{#IFKEY}]'
          master_item:
            key: fgate.netif.get_data
          lld_macro_paths:
            - lld_macro: '{#IFALIAS}'
              path: $.alias
            - lld_macro: '{#IFDESCR}'
              path: $.description
            - lld_macro: '{#IFKEY}'
              path: $.id
            - lld_macro: '{#IFNAME}'
              path: $.name
            - lld_macro: '{#IFSTATUS}'
              path: $.link
            - lld_macro: '{#IFTYPE}'
              path: $.type
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.data
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 6h
        - uuid: ededd6a88d74407c998f54a63bec5155
