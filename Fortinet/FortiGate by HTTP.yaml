          master_item:
            key: fgate.resources.get_data
          tags:
            - tag: component
              value: storage
        - uuid: 6ddf5a6fc9cd4b7ca6522f8e86a7aac8
          name: 'Used disk space'
          type: DEPENDENT
          key: fgate.fs.used
          delay: '0'
          units: B
          description: 'The used space of the current disk, in bytes.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.data.disk_used
          master_item:
            key: fgate.resources.get_data
          tags:
            - tag: component
              value: storage
        - uuid: 847069b5ceaa417cbd84b1b0d5184771
          name: 'Disk utilization'
          type: DEPENDENT
          key: fgate.fs.util
          delay: '0'
          value_type: FLOAT
          units: '%'
          description: 'Disk utilization, expressed in %.'
          preprocessing:
