              value: storage
        - uuid: 3e595bf084f342ecaf94af97c2751c26
          name: 'Total disk space'
          type: DEPENDENT
          key: fgate.fs.total
          delay: '0'
          units: B
          description: 'The total space of the current disk, in bytes.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.data.disk_total
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
