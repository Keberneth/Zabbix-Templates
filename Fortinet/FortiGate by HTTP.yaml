              expression: '(100-last(/FortiGate by HTTP/fgate.fs.util))<{$DISK.FREE.WARN}'
              name: 'Free disk space is low'
              event_name: 'Free disk space is less than {$DISK.FREE.WARN}%'
              priority: WARNING
              description: 'Left disk space is not enough.'
              dependencies:
