zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 41d23565286045a6855bdf9b7c52dc87
      name: 'Templates/Network devices'
  templates:
    - uuid: e56c9577c225476eb6d8f1c2f5dc90a5
      template: 'FortiGate by HTTP'
      name: 'FortiGate by HTTP'
      description: |
        The template for monitoring FortiGate Next Generation Firewall by HTTP.
        Fixed for FortiOS 7.4.5 / 7.6.1 and later.
        
        1. On the FortiGate GUI, select System > Admin Profiles > Create New.
        2. Enter a profile name (ex. zabbix_ro) and enable all the Read permissions. Please note the profile name, it will be used a bit later.
        3. Go to System > Administrators > Create New > REST API Admin.
        4. Enter the API-user's name and select the profile name you created in step 2.
        5. The trusted host can be specified to ensure that only Zabbix server can reach the FortiGate.
        6. Click OK and an API token will be generated. Make a note of the API token as it's only shown once and cannot be retrieved.
        7. Put the API token into {$FGATE.API.TOKEN} macro.
        8. Set your FortiGate GUI IP/FQDN as {$FGATE.API.FQDN} macro value.
        9. FortiGate REST API should use HTTPS. Leave "{$FGATE.SCHEME}" as "https" unless you have a legacy exception.
        10. If FortiGate GUI/API uses the default HTTPS port, leave {$FGATE.API.PORT} as "443".
        11. If FortiGate GUI/API port differs from the standard one, specify it in {$FGATE.API.PORT} macro.
        12. This template sends the API token in the Authorization header ("Bearer <token>"), which is recommended for current FortiOS versions.
        
        You can discuss this template or leave feedback on our forum https://www.zabbix.com/forum/zabbix-suggestions-and-feedback.
        
        Generated by official Zabbix template tool "Templator"
        
        
        Custom extension: HA cluster monitoring via FortiOS REST API. Adds HA member discovery, per-member items/triggers, and an HA diagnostics dashboard while keeping existing FortiGate monitoring items unchanged.
        
        Custom extension: BGP neighbor, IPSec tunnel, and hardware sensor alarm monitoring via FortiOS REST API with integrated dashboards.
      vendor:
        name: Keberneth
        version: 7.0.4
      groups:
        - name: 'Templates/Network devices'
      items:
        - uuid: e74af8e347814085a7d01142c9aae447
          name: 'API availability status'
          type: DEPENDENT
          key: fgate.api.status
          delay: '0'
          description: 'Checking API availability by response.'
          valuemap:
            name: 'Service state'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.build
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
            - type: IN_RANGE
              parameters:
                - ''
                - '0'
              error_handler: CUSTOM_VALUE
              error_handler_params: '1'
          master_item:
            key: fgate.system.get_data
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: 8b8c03f1497f4f18a417d103267d2947
              expression: 'last(/FortiGate by HTTP/fgate.api.status)=0'
              name: 'Unexpected response from API'
              priority: AVERAGE
              description: 'Received an unexpected response from API. It may be unavailable.'
              dependencies:
                - name: 'Port {$FGATE.API.PORT} is unavailable'
                  expression: 'last(/FortiGate by HTTP/net.tcp.service["{$FGATE.SCHEME}","{$FGATE.API.FQDN}","{$FGATE.API.PORT}"])=0'
              tags:
                - tag: scope
                  value: availability
        - uuid: 2910581857964420a78007eaa04013a2
          name: 'BGP neighbors item errors'
          type: DEPENDENT
          key: fgate.bgp.data_errors
          delay: '0'
          value_type: TEXT
          trends: '0'
          description: 'Item for gathering errors of BGP neighbor data.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.error
              error_handler: DISCARD_VALUE
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: fgate.bgp.get_data
          tags:
            - tag: component
              value: bgp
            - tag: component
              value: error
          triggers:
            - uuid: aa56508637424970ad6846d6c605d519
              expression: 'length(last(/FortiGate by HTTP/fgate.bgp.data_errors))>0 and length(last(/FortiGate by HTTP/fgate.bgp.data_errors,#1:now-1m))>0 and nodata(/FortiGate by HTTP/fgate.bgp.data_errors,2m)=0'
              name: 'BGP neighbors API item errors'
              priority: WARNING
              dependencies:
                - name: 'Unexpected response from API'
                  expression: 'last(/FortiGate by HTTP/fgate.api.status)=0'
              tags:
                - tag: scope
                  value: availability
        - uuid: 331f179db3164bceabf6fc03b79494d1
          name: 'Get BGP neighbors'
          type: HTTP_AGENT
          key: fgate.bgp.get_data
          delay: 3m
          history: 1d
          value_type: TEXT
          trends: '0'
          description: 'Raw BGP neighbor data from FortiGate REST API.'
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
              error_handler: CUSTOM_VALUE
              error_handler_params: '{"error":"Not supported value received"}'
          timeout: '{$FGATE.DATA.TIMEOUT}'
          url: '{$FGATE.SCHEME}://{$FGATE.API.FQDN}:{$FGATE.API.PORT}/api/v2/monitor/router/bgp/neighbors'
          query_fields:
            - name: vdom
              value: '{$FGATE.API.BGP.VDOM}'
          follow_redirects: 'NO'
          http_proxy: '{$FGATE.HTTP.PROXY}'
          headers:
            - name: Accept
              value: application/json
            - name: Authorization
              value: 'Bearer {$FGATE.API.TOKEN}'
          tags:
            - tag: component
              value: bgp
            - tag: component
              value: raw
        - uuid: 88d91dfc32d040abb9236b5d4d0e9fd3
          name: 'BGP neighbors established'
          type: DEPENDENT
          key: fgate.bgp.neighbors.established
          delay: '0'
          description: 'Number of BGP neighbors in Established state.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var obj = JSON.parse(value);
                  var results = Array.isArray(obj.results) ? obj.results : [];
                  var count = 0;
                  results.forEach(function (n) {
                      if (String(n.state || '').toLowerCase() === 'established') {
                          count++;
                      }
                  });
                  return count;
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: fgate.bgp.get_data
          tags:
            - tag: component
              value: bgp
        - uuid: 2eed491587f24a678c7679bef18d5c9a
          name: 'BGP neighbors not established'
          type: DEPENDENT
          key: fgate.bgp.neighbors.not_established
          delay: '0'
          description: 'Number of BGP neighbors not in Established state.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var obj = JSON.parse(value);
                  var results = Array.isArray(obj.results) ? obj.results : [];
                  var count = 0;
                  results.forEach(function (n) {
                      if (String(n.state || '').toLowerCase() !== 'established') {
                          count++;
                      }
                  });
                  return count;
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: fgate.bgp.get_data
          tags:
            - tag: component
              value: bgp
        - uuid: 9503640a165149639724697402ed6a60
          name: 'BGP neighbors total'
          type: DEPENDENT
          key: fgate.bgp.neighbors.total
          delay: '0'
          description: 'Total number of BGP neighbors returned by the FortiGate API.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var obj = JSON.parse(value);
                  var results = Array.isArray(obj.results) ? obj.results : [];
                  return results.length;
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: fgate.bgp.get_data
          tags:
            - tag: component
              value: bgp
        - uuid: 3a54a2ef2ad94f0d8df190356ca0ac9b
          name: 'FortiGate-VM license: Number of CPUs'
          type: DEPENDENT
          key: fgate.cpu.num
          delay: '0'
          description: 'Number of FortiGate-VM vCPUs from license/status data. This field is not returned by physical FortiGate appliances; missing values are discarded to avoid false preprocessing errors. CPU utilization is monitored separately by fgate.cpu.util.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.data.vm.cpu_used
              error_handler: DISCARD_VALUE
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: fgate.service.get_data
          tags:
            - tag: component
              value: cpu
        - uuid: 4c83427d66764255be934ea7e2c6084a
          name: 'CPU utilization'
          type: DEPENDENT
          key: fgate.cpu.util
          delay: '0'
          value_type: FLOAT
          units: '%'
          description: 'CPU utilization, expressed in %.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.data.cpu
          master_item:
            key: fgate.resources.get_data
          tags:
            - tag: component
              value: cpu
          triggers:
            - uuid: 4698d35fa5e242ef828ac4e3dba5bc09
              expression: 'min(/FortiGate by HTTP/fgate.cpu.util,5m)>{$CPU.UTIL.WARN}'
              name: 'CPU utilization is high'
              event_name: 'High CPU utilization (over {$CPU.UTIL.WARN}% for 5m)'
              opdata: 'Current utilization: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'The CPU utilization is high.'
              dependencies:
                - name: 'CPU utilization is too high'
                  expression: 'min(/FortiGate by HTTP/fgate.cpu.util,5m)>{$CPU.UTIL.CRIT}'
              tags:
                - tag: scope
                  value: performance
            - uuid: 170087cd8ebf4fc29093e5c1dbd86fea
              expression: 'min(/FortiGate by HTTP/fgate.cpu.util,5m)>{$CPU.UTIL.CRIT}'
              name: 'CPU utilization is too high'
              event_name: 'High CPU utilization (over {$CPU.UTIL.CRIT}% for 5m)'
              opdata: 'Current utilization: {ITEM.LASTVALUE1}'
              priority: HIGH
              description: 'The CPU utilization is too high. The system might be slow to respond.'
              tags:
                - tag: scope
                  value: performance
        - uuid: c29e3336f92f448587e7492c55db8e7c
          name: 'Device firmware version'
          type: DEPENDENT
          key: fgate.device.firmware
          delay: '0'
          value_type: CHAR
          trends: '0'
          description: 'Current version of the device firmware.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.results.current
            - type: JAVASCRIPT
              parameters:
                - |
                  var firmware = JSON.parse(value);
                  return firmware.name + ' ' + firmware.version + ' build' + String(firmware.build);
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: fgate.firmware.get_data
          tags:
            - tag: component
              value: system
        - uuid: 75084a08e92042e5869b57e34506849d
          name: 'Available firmware versions'
          type: DEPENDENT
          key: fgate.device.firmwares_avail
          delay: '0'
          description: 'Number of available firmware versions to download.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.results.available.length()
              error_handler: DISCARD_VALUE
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          master_item:
            key: fgate.firmware.get_data
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: da4a8352ffb94c15a62523a0b97460c4
              expression: '{$FIRMWARE.UPDATES.CONTROL}=1 and last(/FortiGate by HTTP/fgate.device.firmwares_avail)>0'
              name: 'New available firmware found'
              priority: INFO
              description: |
                New available firmware versions found to download.
                
                This trigger expression works as follows:
                1. It can be triggered if there are one or more available firmware versions.
                2. `{$FIRMWARE.UPDATES.CONTROL}=1` - a user can redefine context macro to value - 0. That marks this notification as not important. No new trigger will be fired if new firmware is found.
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
        - uuid: d42b5e392a6a468a84b009ff02f77b18
          name: 'Device model name'
          type: DEPENDENT
          key: fgate.device.model
          delay: '0'
          value_type: CHAR
          trends: '0'
          description: 'The model name of the device.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.results
            - type: JAVASCRIPT
              parameters:
                - |
                  var info = JSON.parse(value);
                  return info.model_name + ' ' + info.model_number + ' (' + info.model + ')';
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: fgate.system.get_data
          tags:
            - tag: component
              value: system
        - uuid: 80bafe55b05f416ebcdde86b58bda1f4
          name: 'Device serial number'
          type: DEPENDENT
          key: fgate.device.serialnumber
          delay: '0'
          value_type: CHAR
          trends: '0'
          description: 'The device serial number.'
          preprocessing:
