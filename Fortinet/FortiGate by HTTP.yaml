      discovery_rules:
        - uuid: 657fd9b9be094331857d24386ad6bad0
          name: 'BGP neighbor discovery'
          type: DEPENDENT
          key: fgate.bgp.neighbor.discovery
          delay: '0'
          filter:
            evaltype: AND
            conditions:
              - macro: '{#BGP_NEIGHBOR_IP}'
                value: '{$FGATE.BGP.NEIGHBOR.MATCHES}'
                formulaid: A
              - macro: '{#BGP_NEIGHBOR_IP}'
                value: '{$FGATE.BGP.NEIGHBOR.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
          enabled_lifetime_type: DISABLE_NEVER
          description: 'Discovery of BGP neighbors from FortiGate REST API.'
          item_prototypes:
            - uuid: 0c71d8b4506a4fc2b655a9e94ead0b36
              name: 'BGP neighbor [{#BGP_NEIGHBOR_IP}]: State'
              type: DEPENDENT
              key: 'fgate.bgp.neighbor.state["{#BGP_NEIGHBOR_IP}"]'
              delay: '0'
              history: 30d
              value_type: TEXT
              trends: '0'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.results[?(@.neighbor_ip == "{#BGP_NEIGHBOR_IP}")].state.first()'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: fgate.bgp.get_data
              tags:
                - tag: bgp_neighbor
                  value: '{#BGP_NEIGHBOR_IP}'
                - tag: component
                  value: bgp
            - uuid: 7f13e6b580774d19988c5c7fb5d59c0b
              name: 'BGP neighbor [{#BGP_NEIGHBOR_IP}]: State code'
              type: DEPENDENT
              key: 'fgate.bgp.neighbor.state_code["{#BGP_NEIGHBOR_IP}"]'
              delay: '0'
              history: 30d
              description: 'Numeric BGP state code for dashboards and trigger evaluation.'
              valuemap:
                name: 'BGP neighbor state'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var state = String(value || '').toLowerCase().replace(/[-_]/g, ' ').replace(/\s+/g, ' ').trim();
                      if (state === 'established') { return 1; }
                      if (state === 'idle') { return 2; }
                      if (state === 'connect') { return 3; }
                      if (state === 'active') { return 4; }
                      if (state === 'open sent' || state === 'opensent') { return 5; }
                      if (state === 'open confirm' || state === 'openconfirm') { return 6; }
                      return 0;
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: 'fgate.bgp.neighbor.state["{#BGP_NEIGHBOR_IP}"]'
              tags:
                - tag: bgp_neighbor
                  value: '{#BGP_NEIGHBOR_IP}'
                - tag: component
                  value: bgp
              trigger_prototypes:
                - uuid: 3962defd2b734c969c66a2206f30f9e5
                  expression: '{$FGATE.BGP.MONITOR}=1 and {$FGATE.BGP.NEIGHBOR.CONTROL:"{#BGP_NEIGHBOR_IP}"}=1 and (last(/FortiGate by HTTP/fgate.bgp.neighbor.state_code["{#BGP_NEIGHBOR_IP}"])=3 or last(/FortiGate by HTTP/fgate.bgp.neighbor.state_code["{#BGP_NEIGHBOR_IP}"])=4)'
                  name: 'BGP neighbor [{#BGP_NEIGHBOR_IP}]: Status Active or Connect'
                  opdata: 'Current state: {ITEM.LASTVALUE1}'
                  priority: HIGH
                  description: 'The BGP neighbor is in Active or Connect state instead of Established.'
                  tags:
                    - tag: scope
                      value: availability
                - uuid: ba0c211b95fa4b2fa93b72c16f8cee4e
                  expression: '{$FGATE.BGP.MONITOR}=1 and {$FGATE.BGP.NEIGHBOR.CONTROL:"{#BGP_NEIGHBOR_IP}"}=1 and last(/FortiGate by HTTP/fgate.bgp.neighbor.state_code["{#BGP_NEIGHBOR_IP}"])=2'
                  name: 'BGP neighbor [{#BGP_NEIGHBOR_IP}]: Status Idle'
                  opdata: 'Current state: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: 'The BGP neighbor is in Idle state instead of Established.'
                  tags:
                    - tag: scope
                      value: availability
                - uuid: ab5280c1623149e480477d278188d2c4
                  expression: '{$FGATE.BGP.MONITOR}=1 and {$FGATE.BGP.NEIGHBOR.CONTROL:"{#BGP_NEIGHBOR_IP}"}=1 and last(/FortiGate by HTTP/fgate.bgp.neighbor.state_code["{#BGP_NEIGHBOR_IP}"])=6'
                  name: 'BGP neighbor [{#BGP_NEIGHBOR_IP}]: Status Open Confirm'
                  opdata: 'Current state: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: 'The BGP neighbor is in Open Confirm state instead of Established.'
                  tags:
                    - tag: scope
                      value: availability
                - uuid: eb5adf74fb4b40ff8de130e650d32c22
                  expression: '{$FGATE.BGP.MONITOR}=1 and {$FGATE.BGP.NEIGHBOR.CONTROL:"{#BGP_NEIGHBOR_IP}"}=1 and last(/FortiGate by HTTP/fgate.bgp.neighbor.state_code["{#BGP_NEIGHBOR_IP}"])=5'
                  name: 'BGP neighbor [{#BGP_NEIGHBOR_IP}]: Status Open Sent'
                  opdata: 'Current state: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: 'The BGP neighbor is in Open Sent state instead of Established.'
                  tags:
                    - tag: scope
                      value: availability
          master_item:
            key: fgate.bgp.get_data
          lld_macro_paths:
            - lld_macro: '{#BGP_NEIGHBOR_IP}'
