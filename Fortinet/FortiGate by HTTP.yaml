                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: 'fgate.service.get_data["{#KEY}"]'
              tags:
                - tag: component
                  value: service
                - tag: name
                  value: '{#KEY}'
            - uuid: 5f395038deb643ed83823695c4475d9e
              name: 'Service [{#NAME}]: Service version'
              type: DEPENDENT
              key: 'fgate.service.version["{#KEY}"]'
              delay: '0'
              value_type: CHAR
              trends: '0'
              description: 'Current version of the {#NAME} service.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.version
                  error_handler: DISCARD_VALUE
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: 'fgate.service.get_data["{#KEY}"]'
              tags:
                - tag: component
                  value: service
                - tag: name
                  value: '{#KEY}'
          master_item:
            key: fgate.service.get_data
          lld_macro_paths:
            - lld_macro: '{#HAS_EXPIRES}'
              path: $.has_expires
            - lld_macro: '{#KEY}'
              path: $.key
            - lld_macro: '{#NAME}'
              path: $.name
            - lld_macro: '{#STATUS}'
              path: $.status
            - lld_macro: '{#TYPE}'
              path: $.type
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.lld
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 6h
          overrides:
            - name: 'System services'
              step: '1'
              filter:
                conditions:
                  - macro: '{#TYPE}'
                    value: ^(cloud_service_status|platform|other)$
                    formulaid: A
              operations:
                - operationobject: ITEM_PROTOTYPE
                  operator: LIKE
                  value: ': Expiration date'
                  discover: NO_DISCOVER
                - operationobject: ITEM_PROTOTYPE
                  operator: LIKE
                  value: ': Last attempt to update'
                  discover: NO_DISCOVER
                - operationobject: ITEM_PROTOTYPE
                  operator: LIKE
                  value: ': Last update time'
                  discover: NO_DISCOVER
                - operationobject: ITEM_PROTOTYPE
                  operator: LIKE
                  value: ': Service version'
                  discover: NO_DISCOVER
                - operationobject: ITEM_PROTOTYPE
                  operator: LIKE
                  value: ': Update method'
                  discover: NO_DISCOVER
                - operationobject: ITEM_PROTOTYPE
                  operator: LIKE
                  value: ': Update result'
                  discover: NO_DISCOVER
                - operationobject: TRIGGER_PROTOTYPE
                  operator: LIKE
                  value: ': License expires soon'
                  discover: NO_DISCOVER
                - operationobject: TRIGGER_PROTOTYPE
                  operator: LIKE
                  value: ': License status is unsuccessful'
                  discover: NO_DISCOVER
            - name: 'Services without expiration'
              step: '2'
              filter:
                conditions:
                  - macro: '{#HAS_EXPIRES}'
                    value: ^0$
                    formulaid: A
              operations:
                - operationobject: ITEM_PROTOTYPE
                  operator: LIKE
                  value: ': Expiration date'
                  discover: NO_DISCOVER
                - operationobject: TRIGGER_PROTOTYPE
                  operator: LIKE
                  value: ': License expires soon'
                  discover: NO_DISCOVER
                - operationobject: TRIGGER_PROTOTYPE
                  operator: LIKE
                  value: ': License status is unsuccessful'
                  discover: NO_DISCOVER
