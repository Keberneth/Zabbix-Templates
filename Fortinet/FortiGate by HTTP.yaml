            - uuid: e0dbfeb62ad14260a299263be8db631c
              name: 'Interface [{#IFNAME}({#IFALIAS})]: Link status'
              type: DEPENDENT
              key: 'fgate.netif.status[{#IFKEY}]'
              delay: '0'
              description: 'Current link status of the interface.'
              valuemap:
                name: 'Link state'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.link
                - type: BOOL_TO_DECIMAL
                  parameters:
                    - ''
              master_item:
                key: 'fgate.netif.get_data[{#IFKEY}]'
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFKEY}'
              trigger_prototypes:
                - uuid: e03715db2ab3447ba3dda0e07c3bc604
                  expression: '{$NET.IF.CONTROL:"{#IFNAME}"}=1 and last(/FortiGate by HTTP/fgate.netif.status[{#IFKEY}])=0 and (last(/FortiGate by HTTP/fgate.netif.status[{#IFKEY}],#1)<>last(/FortiGate by HTTP/fgate.netif.status[{#IFKEY}],#2))'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'last(/FortiGate by HTTP/fgate.netif.status[{#IFKEY}])<>0 or {$NET.IF.CONTROL:"{#IFNAME}"}=0'
                  name: 'Interface [{#IFNAME}({#IFALIAS})]: Link down'
                  opdata: 'Current status: {ITEM.LASTVALUE1}'
                  priority: AVERAGE
                  description: |
                    This trigger expression works as follows:
                    1. It can be triggered if the interface link status is down.
                    2. `{$NET.IF.CONTROL:"{#IFNAME}"}=1` - a user can redefine context macro to value - 0. That marks this interface as not important. No new trigger will be fired if this interface link is down.
                    3. `{TEMPLATE_NAME:METRIC.diff()}=1` - the trigger fires only if the interface link status was up to (1) sometime before.
                    
                    WARNING: If closed manually, it will not fire again on the next poll because of .diff.
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: availability
            - uuid: ffba364bc78c446bb57f6673b7b6d255
              name: 'Interface [{#IFNAME}({#IFALIAS})]: Interface type'
              type: DEPENDENT
              key: 'fgate.netif.type[{#IFKEY}]'
              delay: '0'
              description: 'Type of the interface.'
              valuemap:
                name: 'Interface type'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.type
                - type: JAVASCRIPT
                  parameters:
                    - |
                      const idx = [
                      	'physical',
                      	'vlan',
                      	'aggregate',
                      	'redundant',
                      	'tunnel',
                      	'vdom-link',
                      	'loopback',
                       	'switch',
                      	'vap-switch',
                      	'wl-mesh',
                      	'fext-wan',
                      	'vxlan',
                      	'geneve',
                      	'hdlc',
                      	'switch-vlan',
                       	'emac-vlan',
                      	'ssl',
                      	'lan-extension'
                      ].indexOf(value);
                      return idx !== -1 ? idx : 30;
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: 'fgate.netif.get_data[{#IFKEY}]'
