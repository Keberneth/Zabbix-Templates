zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: df97989912ff40919985d25706920120
      name: 'Fortinet Office Network'
    - uuid: 41d23565286045a6855bdf9b7c52dc87
      name: 'Templates/Network devices'
    - uuid: df97989912ff40919985d25706920120
      name: 'Fortinet Office Network'
    - uuid: 41d23565286045a6855bdf9b7c52dc87
      name: 'Templates/Network devices'
  templates:
    - uuid: 12cc788d218d4af5ac8df7f6b02ac40a
      template: 'FortiAP by FortiGate HTTP'
      name: 'FortiAP by FortiGate HTTP'
      description: |
        Updated template for monitoring FortiAP devices that are managed by a FortiGate controller.
        
        This template is intended to be linked to the same FortiGate host that already uses your FortiGate by HTTP template.
        It reuses the same controller-side macros:
        - {$FGATE.API.FQDN}
        - {$FGATE.API.PORT}
        - {$FGATE.API.TOKEN}
        - {$FGATE.SCHEME}
        - {$FGATE.DATA.TIMEOUT}
        - {$FGATE.HTTP.PROXY}
        
        This revision prefers the FortiGate monitor endpoint for managed AP runtime information and augments it with:
        - CMDB wireless-controller wtp data for configured values
        - WiFi client data for per-AP client counts and signal/SNR averages
        
        Normalized per-AP fields returned by the master item:
        - serial
        - name
        - model
        - ip
        - profile
        - admin_state
        - version
        - state_raw
        - state_num
        - client_count
        - signal_avg
        - snr_avg
        - radios_seen
        - location
        - description
        
        
        This revision also adds aggregate count/quality items, graph prototypes, and dashboard pages for overview and per-AP statistics.
        
        Dashboard update: consolidates FortiAP dashboards into one host dashboard with pages for Overview, AP clients and health, AP wireless quality, and AP operations.
      vendor:
        name: Keberneth
        version: 7.0.4
      groups:
        - name: 'Fortinet Office Network'
        - name: 'Templates/Network devices'
      items:
        - uuid: c312fa99510941789a433d37fb1c757c
          name: 'Managed FortiAP connected'
          type: DEPENDENT
          key: fap.ap.connected
          delay: '0'
          description: 'Number of managed FortiAP devices with a normalized state of up.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.data
              error_handler: CUSTOM_VALUE
              error_handler_params: '[]'
            - type: JAVASCRIPT
              parameters:
                - 'var data = JSON.parse(value); return data.filter(function (v) { return Number(v.state_num) === 1; }).length;'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: fap.aps.get_data
        - uuid: c9114ee78a5b4c939209c36fb8740e72
          name: 'Managed FortiAP connected (%)'
          type: DEPENDENT
          key: fap.ap.connected_pct
          delay: '0'
          value_type: FLOAT
          units: '%'
          description: 'Percentage of managed FortiAP devices currently normalized as up.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.data
              error_handler: CUSTOM_VALUE
              error_handler_params: '[]'
            - type: JAVASCRIPT
              parameters:
                - 'var data = JSON.parse(value); if (data.length === 0) { return 0; } var up = data.filter(function (v) { return Number(v.state_num) === 1; }).length; return (up * 100 / data.length).toFixed(2);'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: fap.aps.get_data
        - uuid: e7d9b6cab4974a9e92199d0d43646500
          name: 'Managed FortiAP count'
          type: DEPENDENT
          key: fap.ap.count
          delay: '0'
          description: 'Number of FortiAP devices returned by the controller.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.data.length()
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: fap.aps.get_data
        - uuid: 3e26c24fd51b4332854c42c89de822a4
          name: 'Managed FortiAP not connected'
          type: DEPENDENT
          key: fap.ap.not_connected
          delay: '0'
          description: 'Number of managed FortiAP devices not currently normalized as up. This includes down or unknown states.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.data
              error_handler: CUSTOM_VALUE
              error_handler_params: '[]'
            - type: JAVASCRIPT
              parameters:
                - 'var data = JSON.parse(value); return data.filter(function (v) { return Number(v.state_num) !== 1; }).length;'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: fap.aps.get_data
        - uuid: 29536b5c3a4741509a8b9c6671caa825
          name: 'FortiAP with clients'
          type: DEPENDENT
          key: fap.ap.with_clients
          delay: '0'
          description: 'Number of managed FortiAP devices currently serving one or more clients.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.data
              error_handler: CUSTOM_VALUE
              error_handler_params: '[]'
            - type: JAVASCRIPT
              parameters:
                - 'var data = JSON.parse(value); return data.filter(function (v) { return Number(v.client_count || 0) > 0; }).length;'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: fap.aps.get_data
        - uuid: 7971abdce459447c9cebb7e02cb436ce
          name: 'API availability status'
          type: DEPENDENT
          key: fap.api.status
          delay: '0'
          description: 'Checking API availability by normalized response.'
          valuemap:
            name: 'Service state'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.ok
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
          master_item:
            key: fap.aps.get_data
          tags:
            - tag: component
              value: health
          triggers:
            - uuid: be0960fbe833420188fb601cfe4245cf
              expression: 'last(/FortiAP by FortiGate HTTP/fap.api.status)=0'
              name: 'Unexpected response from API'
              priority: AVERAGE
              description: 'Received an unexpected response from API. It may be unavailable or the endpoint may be unsupported by this FortiOS build.'
              tags:
                - tag: scope
                  value: availability
        - uuid: 207db1d1b59046eba2b4cae0944b7ba1
          name: 'Get managed FortiAP data'
          type: SCRIPT
          key: fap.aps.get_data
          delay: 5m
          history: '0'
          value_type: TEXT
          trends: '0'
          params: |2
                var params = JSON.parse(value),
                    request = new HttpRequest(),
                    result = {"ok": 0, "data": [], "rogue_count": 0, "error": ""},
                    api_url = "",
                    error_msg = "";
            
                function isObject(v) {
                    return typeof v === 'object' && v !== null && !Array.isArray(v);
                }
            
                function safeText(v) {
                    return (typeof v === 'undefined' || v === null) ? '' : String(v);
                }
            
                function clean(v) {
                    return safeText(v).replace(/^\s+|\s+$/g, '');
                }
            
                function first(obj, keys, def) {
                    var i, key;
                    if (!isObject(obj)) {
                        return def;
                    }
                    for (i = 0; i < keys.length; i++) {
                        key = keys[i];
                        if (typeof obj[key] !== 'undefined' && obj[key] !== null && obj[key] !== '') {
                            return obj[key];
                        }
                    }
                    return def;
                }
            
                function arrify(response) {
                    var cands = ['results', 'result', 'data', 'entries'],
                        i, r, out;
            
                    if (Array.isArray(response)) {
                        return response;
                    }
            
                    if (!isObject(response)) {
                        return [];
                    }
            
                    for (i = 0; i < cands.length; i++) {
                        r = response[cands[i]];
                        if (Array.isArray(r)) {
                            return r;
                        }
                        if (isObject(r)) {
                            out = [];
                            Object.keys(r).forEach(function (k) {
                                var item = r[k];
                                if (!isObject(item)) {
                                    item = {"value": item};
                                }
                                if (typeof item.__key === 'undefined') {
                                    item.__key = k;
                                }
                                out.push(item);
                            });
                            return out;
                        }
                    }
            
                    return [];
                }
            
                function getHttpData(url) {
                    var response;
            
                    response = request.get(url);
                    Zabbix.log(4, '[ FortiAP by FortiGate HTTP ] [ ' + url + ' ] Received response with status code ' + request.getStatus() + ': ' + response);
            
                    if (request.getStatus() !== 200) {
                        throw 'Failed to receive data: invalid response status code ' + request.getStatus() + '.';
                    }
            
                    if (response !== null && response !== '') {
                        try {
                            response = JSON.parse(response);
                        }
                        catch (error) {
                            throw 'Failed to parse response received from FortiGate API.';
                        }
                    }
            
                    if (!isObject(response) && !Array.isArray(response)) {
                        throw 'Cannot process response data: received data is not an object.';
                    }
            
                    return response;
                }
            
                function queryUrls(urls) {
                    var i, last_error = '';
                    for (i = 0; i < urls.length; i++) {
                        try {
                            return getHttpData(urls[i]);
                        }
                        catch (error) {
                            last_error = error.toString();
                        }
                    }
                    throw last_error;
                }
            
                function isMeaningfulString(s) {
                    return s !== '' && !/^(?:0|1|true|false|null|n\/a)$/i.test(s);
                }
            
                function likelyVersion(s) {
                    return /(?:^|[\s-])v?\d+\.\d+(?:\.\d+)?(?:\s*\(\d+\))?/i.test(s) ||
                           /\bbuild\b/i.test(s) ||
                           /\bGA\b/i.test(s) ||
                           /-v\d+\.\d+\.\d+/i.test(s);
                }
            
                function deriveApModelFromSerial(serial) {
                    var s = clean(serial),
                        m = s.match(/^FP(\d+)([A-Z0-9])/i);
            
                    if (m) {
                        return 'FortiAP ' + m[1] + m[2];
                    }
            
                    return '';
                }
            
                function normalizeVersion(obj) {
                    var keys = ['image_version', 'image-version', 'version', 'wtp_version', 'wtp-version', 'os_version', 'os-version', 'version_str', 'version-str', 'firmware', 'firmware_version', 'firmware-version', 'active_sw_ver', 'active sw ver', 'firmware-provision'],
                        i, s, best = '';
            
                    for (i = 0; i < keys.length; i++)  {
                        s = clean(first(obj, [keys[i]], ''));
                        if (!isMeaningfulString(s)) {
                            continue;
                        }
                        if (likelyVersion(s)) {
                            return s;
                        }
                        if (best === '' && /[A-Za-z]/.test(s)) {
                            best = s;
                        }
                    }
            
                    return best;
                }
            
                function normalizeModel(obj, serial) {
                    var keys = ['model', 'wtp_model', 'wtp-model', 'platform', 'platform_str', 'platform-str', 'boardid'],
                        i, s;
            
                    for (i = 0; i < keys.length; i++) {
                        s = clean(first(obj, [keys[i]], ''));
                        if (isMeaningfulString(s)) {
                            return s;
                        }
                    }
            
                    return deriveApModelFromSerial(serial);
                }
            
                function normalizeName(obj) {
                    var serial = clean(first(obj, ['wtp_id', 'wtp-id', 'serial', 'q_origin_key', 'id'], '')),
                        keys = ['wtp_name', 'wtp-name', 'name', 'hostname'],
                        i, s;
            
                    for (i = 0; i < keys.length; i++) {
                        s = clean(first(obj, [keys[i]], ''));
                        if (isMeaningfulString(s) && s !== serial) {
                            return s;
                        }
                    }
            
                    for (i = 0; i < keys.length; i++) {
                        s = clean(first(obj, [keys[i]], ''));
                        if (isMeaningfulString(s)) {
                            return s;
                        }
                    }
            
                    return serial;
                }
            
                function normalizeIp(obj) {
                    return clean(first(obj, ['wtp_ip', 'ip', 'ip-address', 'ip_addr', 'ip-addr', 'local_ip', 'local-ip', 'address'], ''));
                }
            
                function normalizeProfile(obj) {
                    return clean(first(obj, ['wtp-profile', 'wtp_profile', 'apcfg-profile', 'apcfg_profile', 'profile'], ''));
                }
            
                function normalizeAdmin(obj) {
                    return clean(first(obj, ['admin', 'admin_state', 'admin-state'], ''));
                }
            
                function apAliases(v) {
                    var serial = clean(first(v, ['wtp_id', 'wtp-id', 'serial', 'q_origin_key', '__key', 'id'], '')),
                        name = clean(normalizeName(v));
            
                    return [serial, name].filter(function (x, idx, arr) {
                        return x !== '' && arr.indexOf(x) === idx;
                    });
                }
            
                function parseApState(cfg, mon, client_count, monitor_present) {
                    var merged = {},
                        raw = '',
                        admin = '',
                        keys = ['status', 'wtp_status', 'wtp-status', 'connection_state', 'connection-state', 'conn_status', 'conn-status', 'run_state', 'run-state', 'oper_state', 'oper-state', 'state'],
                        i, s, num = 2,
                        ip = '',
                        version = '';
            
                    Object.keys(cfg || {}).forEach(function (k) { merged[k] = cfg[k]; });
                    Object.keys(mon || {}).forEach(function (k) { merged[k] = mon[k]; });
            
                    admin = normalizeAdmin(merged);
            
                    for (i = 0; i < keys.length; i++) {
                        s = clean(first(merged, [keys[i]], ''));
                        if (s !== '') {
                            raw = s;
                            break;
                        }
                    }
            
                    if (/(online|up|connected|present|joined|healthy|active)/i.test(raw)) {
                        num = 1;
                    }
                    else if (/(offline|down|disconnected|missing|dead|lost|error|failed)/i.test(raw)) {
                        num = 0;
                    }
                    else if (/disable/i.test(admin)) {
                        raw = raw === '' ? 'disabled' : raw;
                        num = 0;
                    }
            
                    ip = normalizeIp(merged);
                    version = normalizeVersion(merged);
            
                    if (num === 2 && client_count > 0) {
                        raw = raw === '' ? 'client-detected' : raw;
                        num = 1;
                    }
                    else if (num === 2 && monitor_present && (ip !== '' || version !== '')) {
                        raw = raw === '' ? 'online' : raw;
                        num = 1;
                    }
                    else if (num === 2 && !monitor_present && !/disable/i.test(admin)) {
                        raw = raw === '' ? 'offline' : raw;
                        num = 0;
                    }
                    else if (num === 2 && ip !== '' && admin !== '') {
                        raw = raw === '' ? 'online' : raw;
                        num = 1;
                     }
            
                    if (raw === '') {
                        raw = num === 1 ? 'up' : (num === 0 ? 'down' : 'unknown');
                    }
            
                    return {"raw": raw, "num": num};
                }
            
                try {
                    ['scheme', 'api.token', 'api.fqdn', 'api.port'].forEach(function (field) {
                        var macro = '{$FGATE.' + field.toUpperCase() + '}';
                        var key = field.split('.').pop();
            
                        if (typeof params[key] === 'undefined') {
                            throw 'Please set "' + key + '" script input parameter to ' + macro + ' macro value.';
                        }
            
                        if (params[key] === macro || params[key] === '') {
                            throw 'Please change ' + macro + ' macro to the proper value.';
                        }
                    });
            
                    if (typeof params.http_proxy !== 'undefined' && params.http_proxy !== '{' + '$FGATE.HTTP.PROXY}' && params.http_proxy !== '') {
                        request.setProxy(params.http_proxy);
                    }
            
                    api_url = params.scheme + '://' + params.fqdn + ':' + params.port;
            
                    var cmdb_resp = null,
                        managed_resp = null,
                        client_resp = null,
                        rogue_resp = null,
                        partial_errors = [],
                        devices = {},
                        alias_to_key = {};
            
                    try {
                        cmdb_resp = getHttpData(
                            api_url + '/api/v2/cmdb/wireless-controller/wtp?access_token=' + encodeURIComponent(params.token)
                        );
                    }
                    catch (error) {
                        partial_errors.push('cmdb wtp endpoint failed: ' + error);
                    }
            
                    try {
                        managed_resp = queryUrls([
                            api_url + '/api/v2/monitor/wifi/managed_ap?access_token=' + encodeURIComponent(params.token) + '&start=0&count=1000',
                            api_url + '/api/v2/monitor/wifi/managed_ap/select?access_token=' + encodeURIComponent(params.token) + '&start=0&count=1000',
                            api_url + '/api/v2/monitor/wifi/managed_ap?access_token=' + encodeURIComponent(params.token),
                            api_url + '/api/v2/monitor/wifi/managed_ap/select?access_token=' + encodeURIComponent(params.token)
                        ]);
                    }
                    catch (error) {
                        partial_errors.push('monitor managed_ap endpoint failed: ' + error);
                    }
            
                    try {
                        client_resp = queryUrls([
                            api_url + '/api/v2/monitor/wifi/client?access_token=' + encodeURIComponent(params.token) + '&global=1&start=0&count=1000',
                            api_url + '/api/v2/monitor/wifi/client/select?access_token=' + encodeURIComponent(params.token) + '&global=1&start=0&count=1000',
                            api_url + '/api/v2/monitor/wifi/client?access_token=' + encodeURIComponent(params.token) + '&global=1',
                            api_url + '/api/v2/monitor/wifi/client/select?access_token=' + encodeURIComponent(params.token) + '&global=1',
                            api_url + '/api/v2/monitor/wifi/client?access_token=' + encodeURIComponent(params.token),
                            api_url + '/api/v2/monitor/wifi/client/select?access_token=' + encodeURIComponent(params.token)
                        ]);
                    }
                    catch (error) {
                        partial_errors.push('wifi client endpoint failed: ' + error);
                    }
            
                    try {
                        rogue_resp = queryUrls([
                            api_url + '/api/v2/monitor/wifi/rogue_ap?access_token=' + encodeURIComponent(params.token) + '&start=0&count=1000',
                            api_url + '/api/v2/monitor/wifi/rogue_ap/select?access_token=' + encodeURIComponent(params.token) + '&start=0&count=1000',
                            api_url + '/api/v2/monitor/wifi/rogue_ap?access_token=' + encodeURIComponent(params.token),
                            api_url + '/api/v2/monitor/wifi/rogue_ap/select?access_token=' + encodeURIComponent(params.token)
                        ]);
                    }
                    catch (error) {
                        partial_errors.push('rogue_ap endpoint failed: ' + error);
                    }
            
                    if (cmdb_resp === null && managed_resp === null && client_resp === null && rogue_resp === null) {
                        throw partial_errors.join(' ');
                    }
            
                    function resolveKey(v)  {
                        var aliases = apAliases(v),
                            key = '',
                            i;
            
                        for (i = 0; i < aliases.length; i++) {
                            if (aliases[i] !== '' && typeof alias_to_key[aliases[i]] !== 'undefined') {
                                key = alias_to_key[aliases[i]];
                                break;
                            }
                        }
            
                        if (key === '') {
                            key = aliases.length > 0 ? aliases[0] : '';
                        }
            
                        if (key === '') {
                            return '';
                        }
            
                        aliases.forEach(function (a) {
                            alias_to_key[a] = key;
                        });
            
                        return key;
                    }
            
                    arrify(cmdb_resp || {}).forEach(function (item) {
                        var key;
                        if (!isObject(item)) {
                            return;
                        }
            
                        key = resolveKey(item);
                        if (key === '') {
                            return;
                        }
            
                        if (typeof devices[key] === 'undefined') {
                            devices[key] = {"cfg": {}, "mon": {}, "monitor_present": false, "clients": {"count": 0, "signal_sum": 0, "signal_n": 0, "snr_sum": 0, "snr_n": 0, "radios": {}}};
                        }
            
                        devices[key].cfg = item;
                    });
            
                    arrify(managed_resp || {}).forEach(function (item) {
                        var key;
                        if (!isObject(item)) {
                            return;
                        }
            
                        key = resolveKey(item);
                        if (key === '') {
                            return;
                        }
            
                        if (typeof devices[key] === 'undefined') {
                            devices[key] = {"cfg": {}, "mon": {}, "monitor_present": false, "clients": {"count": 0, "signal_sum": 0, "signal_n": 0, "snr_sum": 0, "snr_n": 0, "radios": {}}};
                        }
            
                        devices[key].mon = item;
                        devices[key].monitor_present = true;
                    });
            
                    arrify(client_resp || {}).forEach(function (client) {
                        var serial = clean(first(client, ['wtp_id', 'wtp-id', 'serial'], '')),
                            name = clean(first(client, ['wtp_name', 'wtp-name', 'name'], '')),
                            key = '';
            
                        if (serial !== '' && typeof alias_to_key[serial] !== 'undefined') {
                            key = alias_to_key[serial];
                        }
                        else if (name !== '' && typeof alias_to_key[name] !== 'undefined') {
                            key = alias_to_key[name];
                        }
                        else {
                            key = serial !== '' ? serial : name;
                        }
            
                        if (key === '') {
                            return;
                        }
            
                        if (typeof devices[key] === 'undefined') {
                            devices[key] = {"cfg": {"wtp_id": serial, "name": name}, "mon": {}, "monitor_present": false, "clients": {"count": 0, "signal_sum": 0, "signal_n": 0, "snr_sum": 0, "snr_n": 0, "radios": {}}};
                        }
            
                        if (serial !== '') {
                            alias_to_key[serial] = key;
                        }
                        if (name !== '') {
                            alias_to_key[name] = key;
                        }
            
                        devices[key].clients.count += 1;
            
                        var signal = Number(first(client, ['signal'], ''));
                        if (!isNaN(signal)) {
                            devices[key].clients.signal_sum += signal;
                            devices[key].clients.signal_n += 1;
                        }
            
                        var snr = Number(first(client, ['snr'], ''));
                        if (!isNaN(snr)) {
                            devices[key].clients.snr_sum += snr;
                            devices[key].clients.snr_n += 1;
                        }
            
                        var radio = clean(first(client, ['wtp_radio', 'radio_id'], ''));
                        if (radio !== '') {
                            devices[key].clients.radios[radio] = true;
                        }
            
                        if (normalizeIp(devices[key].mon) === '' && clean(first(client, ['wtp_ip'], '')) !== '') {
                            devices[key].mon.wtp_ip = first(client, ['wtp_ip'], '');
                        }
                    });
            
                    result.data = Object.keys(devices).map(function (k) {
                        var cfg  = devices[k].cfg || {},
                            mon = devices[k].mon || {},
                            clients = devices[k].clients || {"count": 0, "signal_sum": 0, "signal_n": 0, "snr_sum": 0, "snr_n": 0, "radios": {}},
                            merged = {},
                            serial,
                            state,
                            signal_avg = clients.signal_n > 0 ? (clients.signal_sum / clients.signal_n) : 0,
                            snr_avg = clients.snr_n > 0 ? (clients.snr_sum / clients.snr_n) : 0,
                            cpu_raw,
                            mem_free_raw,
                            mem_total_raw,
                            last_reboot_raw,
                            health_overall = '',
                            health_node;
            
                        Object.keys(cfg).forEach(function (x) { merged[x] = cfg[x]; });
                        Object.keys(mon).forEach(function (x) { merged[x] = mon[x]; });
            
                        serial = clean(first(merged, ['wtp_id', 'wtp-id', 'serial', 'q_origin_key', 'id'], k));
                        state = parseApState(cfg, mon, clients.count, devices[k].monitor_present);
            
                        cpu_raw = Number(first(merged, ['cpu_usage', 'cpu-usage'], 0));
                        mem_free_raw = Number(first(merged, ['mem_free', 'mem-free'], 0));
                        mem_total_raw = Number(first(merged, ['mem_total', 'mem-total'], 0));
                        last_reboot_raw = Number(first(merged, ['last_reboot_time_raw', 'last-reboot-time-raw', 'last_reboot_time', 'last-reboot-time'], 0));
            
                        health_node = first(merged, ['health'], null);
                        if (isObject(health_node) && isObject(health_node.general) && isObject(health_node.general.overall)) {
                            health_overall = clean(safeText(health_node.general.overall.severity));
                        }
            
                        return {
                            "key": k,
                            "serial": serial,
                            "name": clean(normalizeName(merged)),
                            "model": clean(normalizeModel(merged, serial)),
                            "ip": normalizeIp(merged),
                            "profile": normalizeProfile(merged),
                            "admin_state": normalizeAdmin(merged),
                            "version": clean(normalizeVersion(merged)),
                            "state_raw": state.raw,
                            "state_num": state.num,
                            "client_count": clients.count,
                            "signal_avg": signal_avg,
                            "snr_avg": snr_avg,
                            "radios_seen": Object.keys(clients.radios).length,
                            "location": clean(first(merged, ['location'], '')),
                            "description": clean(first(merged, ['description', 'comments'], '')),
                            "cpu_usage": isNaN(cpu_raw) ? 0 : cpu_raw,
                            "mem_free": isNaN(mem_free_raw) ? 0 : mem_free_raw,
                            "mem_total": isNaN(mem_total_raw) ? 0 : mem_total_raw,
                            "last_reboot": isNaN(last_reboot_raw) ? 0 : last_reboot_raw,
                            "last_failure": clean(first(merged, ['last_failure', 'last-failure'], '')),
                            "override_profile": clean(first(merged, ['override_profile', 'override-profile'], '')),
                            "region": clean(first(merged, ['region'], '')),
                            "health_overall": health_overall
                        };
                    });
            
                    result.rogue_count = arrify(rogue_resp || {}).length;
            
                    result.data.sort(function (a, b) {
                        if (a.name < b.name) {
                            return -1;
                        }
                        if (a.name > b.name) {
                            return 1;
                        }
                        return 0;
                    });
            
                    result.ok = 1;
                            result.error = '';
                }
                catch (error) {
                    error_msg = error.toString();
                    error_msg += error_msg.endsWith('.') ? '' : '.';
                    Zabbix.log(3, '[ FortiAP by FortiGate HTTP ] ERROR: ' + error_msg);
                    result.error = error_msg;
                }
            
                return JSON.stringify(result);
          description: 'Item for gathering managed FortiAP inventory, runtime status, and wireless client statistics from the FortiGate API.'
