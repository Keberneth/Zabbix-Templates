              - macro: '{#JOBNAME}'
                value: '{$MSSQL.JOB.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
          description: 'Scanning jobs in DBMS.'
          item_prototypes:
            - uuid: 0d97073177404ab4be1993bcde448926
              name: 'MSSQL Job ''{#JOBNAME}'': Enabled'
