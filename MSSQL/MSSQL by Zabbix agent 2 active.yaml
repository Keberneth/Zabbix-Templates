                  value: database
                - tag: database
                  value: '{#DBNAME}'
              trigger_prototypes:
                - uuid: f5d7472c252b474581e83ba48addf5a2
                  expression: 'last(/MSSQL by Zabbix agent 2 active/mssql.db.state["{#DBNAME}"])>1'
