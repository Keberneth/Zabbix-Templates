          trigger_prototypes:
            - uuid: ab294b1e45f346e68f511cc1c0c85ab4
              expression: 'last(/MSSQL by Zabbix agent 2 active/mssql.job.runstatus["{#JOBNAME}"])=0 and last(/MSSQL by Zabbix agent 2 active/mssql.job.enabled["{#JOBNAME}"])=1 and last(/MSSQL by Zabbix agent 2 active/mssql.job.lastrundatetime["{#JOBNAME}"])>0'
              name: 'MSSQL: Job ''{#JOBNAME}'': Failed to run'
