        - uuid: 2b7500ad6cfb489884ae6ff311d509ac
          name: 'Buffer cache hit ratio'
          type: DEPENDENT
          key: mssql.buffer_cache_hit_ratio
          delay: '0'
          value_type: FLOAT
          units: '%'
          description: 'Indicates the percentage of pages found in the buffer cache without having to read from the disk. The ratio is the total number of cache hits divided by the total number of cache lookups over the last few thousand page accesses. After a long period of time, the ratio changes very little. Since reading from the cache is much less expensive than reading from the disk, a higher value is preferred for this item. To increase the buffer cache hit ratio, consider increasing the amount of memory available to MSSQL Server or using the buffer pool extension feature.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  
                  if (!Array.isArray(data)) {
                    throw 'Unexpected JSON payload';
                  }
                  
                  function pick(names) {
                    var wanted = {};
                  
                    for (var i = 0; i < names.length; i++) {
                      wanted[String(names[i]).toLowerCase()] = true;
                    }
                  
                    for (var j = 0; j < data.length; j++) {
                      var row = data[j] || {};
                      var name = String(row.counter_name || '').toLowerCase();
                  
                      if (wanted[name]) {
                        var num = Number(row.cntr_value);
                  
                        if (!isNaN(num)) {
                          return num;
                        }
                      }
                    }
                  
                    return null;
                  }
                  
                  var direct = pick(['BufferCacheHitRatio']);
                  
                  if (direct !== null) {
                    return direct;
                  }
                  
                  var ratio = pick(['Buffer cache hit ratio']);
                  var base = pick(['Buffer cache hit ratio base']);
                  
                  if (ratio === null || base === null || base <= 0) {
                    throw 'Missing ratio/base counter';
                  }
                  
                  return Math.round((ratio * 10000) / base) / 100;
          master_item:
            key: mssql.buffer_manager.raw
          tags:
            - tag: component
              value: cache
        - uuid: 241d2d9164524d53938075687d6d0152
          name: 'Get Buffer Manager counters'
          type: DEPENDENT
          key: mssql.buffer_manager.raw
