          value_type: FLOAT
          units: '%'
          description: 'Ratio between cache hits and lookups.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  
                  if (!Array.isArray(data)) {
                    throw 'Unexpected JSON payload';
                  }
                  
                  function pick(names) {
                    var wanted = {};
                  
                    for (var i = 0; i < names.length; i++) {
                      wanted[String(names[i]).toLowerCase()] = true;
                    }
                  
                    for (var j = 0; j < data.length; j++) {
                      var row = data[j] || {};
                      var name = String(row.counter_name || '').toLowerCase();
                  
                      if (wanted[name]) {
                        var num = Number(row.cntr_value);
                  
                        if (!isNaN(num)) {
                          return num;
                        }
                      }
                    }
                  
                    return null;
                  }
                  
                  var direct = pick(['CacheHitRatio']);
                  
                  if (direct !== null) {
                    return direct;
                  }
                  
                  var ratio = pick(['Cache Hit Ratio']);
                  var base = pick(['Cache Hit Ratio Base']);
                  
                  if (ratio === null || base === null || base <= 0) {
                    throw 'Missing ratio/base counter';
                  }
                  
                  return Math.round((ratio * 10000) / base) / 100;
          master_item:
            key: mssql.cache_info.raw
          tags:
            - tag: component
              value: cache
