  triggers:
    - uuid: 254da4a3a95340d2ba94b78328b77877
      expression: '(max(/MSSQL by Zabbix agent 2 active/mssql.buffer_cache_hit_ratio,5m)<{$MSSQL.BUFFER_CACHE_RATIO.MIN.CRIT}) and last(/MSSQL by Zabbix agent 2 active/mssql.uptime)>1h'
      name: 'MSSQL: Percentage of the buffer cache efficiency is low'
      event_name: 'MSSQL: Percentage of the buffer cache efficiency is low (below {$MSSQL.BUFFER_CACHE_RATIO.MIN.CRIT}% for 5m)'
      priority: WARNING
      description: 'Too low buffer cache hit ratio.'
      tags:
        - tag: scope
          value: performance
    - uuid: c44e2b86f2bc402b9684225235f17f3f
      expression: '(max(/MSSQL by Zabbix agent 2 active/mssql.buffer_cache_hit_ratio,5m)<{$MSSQL.BUFFER_CACHE_RATIO.MIN.WARN}) and last(/MSSQL by Zabbix agent 2 active/mssql.uptime)>1h'
      name: 'MSSQL: Percentage of the buffer cache efficiency is low'
      event_name: 'MSSQL: Percentage of the buffer cache efficiency is low (below {$MSSQL.BUFFER_CACHE_RATIO.MIN.WARN}% for 5m)'
      priority: INFO
      description: 'Low buffer cache hit ratio.'
      dependencies:
        - name: 'MSSQL: Percentage of the buffer cache efficiency is low'
          expression: '(max(/MSSQL by Zabbix agent 2 active/mssql.buffer_cache_hit_ratio,5m)<{$MSSQL.BUFFER_CACHE_RATIO.MIN.CRIT}) and last(/MSSQL by Zabbix agent 2 active/mssql.uptime)>1h'
      tags:
        - tag: scope
          value: performance
    - uuid: 1b885ea6062c4944afa465b9bf06dfab
      expression: |
        (avg(/MSSQL by Zabbix agent 2 active/mssql.forwarded_records_sec.rate,15m)
         /
         (avg(/MSSQL by Zabbix agent 2 active/mssql.batch_requests_sec.rate,15m)+0.01)
        ) > 0.50
        and avg(/MSSQL by Zabbix agent 2 active/mssql.batch_requests_sec.rate,15m) > 50
      recovery_mode: RECOVERY_EXPRESSION
      recovery_expression: |
        (avg(/MSSQL by Zabbix agent 2 active/mssql.forwarded_records_sec.rate,15m)
         /
         (avg(/MSSQL by Zabbix agent 2 active/mssql.batch_requests_sec.rate,15m)+0.01)
        ) < 0.30
      name: 'MSSQL: Too frequently using pointers'
      priority: WARNING
      description: 'Rows with VARCHAR columns can experience expansion when VARCHAR values are updated with a longer string. In the case where the row cannot fit in the existing page, the row migrates, and access to the row will traverse a pointer. This only happens on heaps (tables without clustered indexes). In cases where clustered indexes cannot be used, drop non-clustered indexes, build a clustered index to reorg pages and rows, drop the clustered index, then recreate non-clustered indexes.'
      tags:
        - tag: scope
          value: performance
    - uuid: 6be6faae25b04fd3bb2c30a2ba619970
      expression: |
        avg(/MSSQL by Zabbix agent 2 active/mssql.readahead_pages_sec.rate,{$MSSQL.READ_RATIO.WINDOW}) >
        {$MSSQL.PERCENT_READAHEAD.MAX} / 100 *
        avg(/MSSQL by Zabbix agent 2 active/mssql.page_reads_sec.rate,{$MSSQL.READ_RATIO.WINDOW})
        and
        avg(/MSSQL by Zabbix agent 2 active/mssql.page_reads_sec.rate,{$MSSQL.READ_RATIO.WINDOW}) >
        {$MSSQL.PAGE_READS.MIN_FOR_RATIO}
      name: 'MSSQL: Too many physical reads occurring'
      priority: WARNING
      description: 'If this value makes up even a sizeable minority of the total "Page Reads/sec" (say, greater than 20% of the total page reads), you may have too many physical reads occurring.'
      tags:
        - tag: scope
          value: performance
