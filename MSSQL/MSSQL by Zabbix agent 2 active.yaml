        - uuid: 4bdac288c29f438fba6de638a15f28c8
          name: 'Worktables from cache ratio'
          type: DEPENDENT
          key: mssql.worktables_from_cache_ratio
          delay: '0'
          value_type: FLOAT
          units: '%'
          description: 'Percentage of work tables created where the initial two pages of the work table were not allocated but were immediately available from the work table cache.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  
                  if (!Array.isArray(data)) {
                    throw 'Unexpected JSON payload';
                  }
                  
                  function pick(names) {
                    var wanted = {};
                  
                    for (var i = 0; i < names.length; i++) {
                      wanted[String(names[i]).toLowerCase()] = true;
                    }
                  
                    for (var j = 0; j < data.length; j++) {
                      var row = data[j] || {};
                      var name = String(row.counter_name || '').toLowerCase();
                  
                      if (wanted[name]) {
                        var num = Number(row.cntr_value);
                  
                        if (!isNaN(num)) {
                          return num;
                        }
                      }
                    }
                  
                    return null;
                  }
                  
                  var direct = pick(['WorktablesFromCacheRatio']);
                  
                  if (direct !== null) {
                    return direct;
                  }
                  
                  var ratio = pick(['Worktables From Cache Ratio']);
                  var base = pick(['Worktables From Cache Base']);
                  
                  if (ratio === null || base === null || base <= 0) {
                    throw 'Missing ratio/base counter';
                  }
                  
                  return Math.round((ratio * 10000) / base) / 100;
          master_item:
            key: mssql.access_methods.raw
          tags:
            - tag: component
              value: cache
        - uuid: b63ac6f16ad94ed18c7db14fe4a01cb4
