zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: c2e076bb4255499886a5b6b4ca5262a5
      name: 'Templates/Network devices'
  templates:
    - uuid: e5205d7c24e64fe2b6833a7e7ff20d6d
      template: 'Citrix ADC by NITRO API'
      name: 'Citrix ADC by NITRO API'
      description: |
        API-only monitoring template for Citrix ADC / NetScaler using the NITRO API.
        
        The template is intentionally designed for low operational noise:
        - one master SCRIPT item polls Citrix ADC and returns a single JSON document
        - dependent items and discovery rules use that JSON, so API/auth/network failures raise one clear problem instead of hundreds of unsupported items
        - VIP and pool alerts ignore Out of Service / disabled states by default
        - per-member alerts are disabled by default and can be enabled only for selected pools
        
        Covered areas:
        - appliance health and throughput
        - HA health
        - load-balancing VIPs (lbvserver)
        - service groups / backend pools
        - pool members
      vendor:
        name: Keberneth
        version: '7.0.0'
      groups:
        - name: 'Templates/Network devices'
      items:
        - uuid: eb20758c63f740a6bf08cdaa429c0c4c
          name: 'Citrix ADC: Appliance raw data'
          type: DEPENDENT
          key: citrix.adc.appliance.raw
          delay: '0'
          history: '0'
          value_type: TEXT
          trends: '0'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.appliance
              error_handler: DISCARD_VALUE
          master_item:
            key: citrix.adc.get
          tags:
            - tag: component
              value: raw
        - uuid: 156be45036374b82b777125f17be3bd3
          name: 'Citrix ADC: Collect NITRO data'
          type: SCRIPT
          key: citrix.adc.get
          delay: '{$CITRIX.ADC.DATA.INTERVAL}'
          history: '0'
          value_type: TEXT
          trends: '0'
          params: |
            var params = JSON.parse(value);
            
            function str(v) {
                return (v === null || typeof v === 'undefined') ? '' : String(v);
            }
            
            function trim(v) {
                return str(v).replace(/^\s+|\s+$/g, '');
            }
            
            function upper(v) {
                return trim(v).replace(/_/g, ' ').toUpperCase();
            }
            
            function isArray(v) {
                return Object.prototype.toString.call(v) === '[object Array]';
            }
            
            function array(v) {
                return isArray(v) ? v : [];
            }
            
            function object(v) {
                return (v && typeof v === 'object' && !isArray(v)) ? v : {};
            }
            
            function toNum(v, d) {
                var n = Number(v);
                return isNaN(n) ? (typeof d === 'undefined' ? 0 : d) : n;
            }
            
            function uniqueSorted(list) {
                var map = {},
                    out = [],
                    i,
                    key;
                for (i = 0; i < list.length; i++) {
                    key = trim(list[i]);
                    if (key !== '') {
                        map[key] = 1;
                    }
                }
            
                for (key in map) {
                    if (map.hasOwnProperty(key)) {
                        out.push(key);
                    }
                }
            
                out.sort();
                return out;
            }
            
            function getArray(data, key) {
                if (!data || typeof data[key] === 'undefined') {
                    return [];
                }
            
                if (isArray(data[key])) {
                    return data[key];
                }
            
                if (typeof data[key] === 'object' && data[key] !== null) {
                    return [data[key]];
                }
            
                return [];
            }
            
            function getFirst(data, key) {
                var arr = getArray(data, key);
                return arr.length ? object(arr[0]) : {};
            }
            
            function stateTextFromCode(code) {
                switch (code) {
                    case 1:
                        return 'Up';
                    case 2:
                        return 'Down';
                    case 3:
                        return 'Out of service';
                    default:
                        return 'Unknown';
                }
            }
            
            function haTextFromCode(code) {
                switch (code) {
                    case 1:
                        return 'Up';
                    case 2:
                        return 'Down';
                    case 3:
                        return 'Inactive';
                    default:
                        return 'Unknown';
                }
            }
            
            function mapVipState(v) {
                var s = upper(v);
            
                if (s === '7' || s === 'UP' || s === 'BUSY' || s === '3') {
                    return {code: 1, text: 'Up'};
                }
            
                if (s === '4' || s === '5' || s === 'OUT OF SERVICE' || s === 'TRANSITION TO OUT OF SERVICE' ||
                    s === 'TRANSITION OUT OF SERVICE' || s === 'TROFS' || s === 'DISABLED') {
                    return {code: 3, text: 'Out of service'};
                }
            
                if (s === '1' || s === 'DOWN' || s === '8' || s === 'DOWN WHEN GOING OUT OF SERVICE') {
                    return {code: 2, text: 'Down'};
                }
            
                return {code: 4, text: 'Unknown'};
            }
            
            function mapPoolState(v, counts) {
                var s = upper(v);
            
                if (s === 'UP' || s === '7') {
                    return {code: 1, text: 'Up'};
                }
            
                if (s === 'DOWN' || s === '1') {
                    return {code: 2, text: 'Down'};
                }
            
                if (s === 'OUT OF SERVICE' || s === 'DISABLED' || s === 'TROFS' || s === '4' || s === '5') {
                    return {code: 3, text: 'Out of service'};
                }
            
                if (counts.total > 0) {
                    if (counts.up > 0) {
                        return {code: 1, text: 'Up'};
                    }
            
                    if (counts.disabled === counts.total) {
                        return {code: 3, text: 'Out of service'};
                    }
            
                    return {code: 2, text: 'Down'};
                }
            
                return {code: 4, text: 'Unknown'};
            }
            
            function mapMemberState(state, svrstate) {
                var s = upper(state),
                    ss = upper(svrstate);
            
                if (s === 'DISABLED' || s === 'OUT OF SERVICE' || s === 'TROFS') {
                    return {code: 3, text: 'Out of service'};
                }
            
                if (ss === 'UP' || s === 'UP' || s === 'ENABLED') {
                    return {code: 1, text: 'Up'};
                }
            
                if (ss === 'DOWN' || s === 'DOWN') {
                    return {code: 2, text: 'Down'};
                }
            
                return {code: 4, text: 'Unknown'};
            }
            
            function mapHaState(enabled, curState) {
                var s = upper(curState);
            
                if (!enabled) {
                    return {code: 3, text: 'Inactive'};
                }
            
                if (s === '3' || s === 'UP' || s === 'MONITOROK') {
                    return {code: 1, text: 'Up'};
                }
            
                if (s === '2' || s === 'DOWN' || s === 'PARTIALFAIL' || s === 'COMPLETEFAIL' ||
                    s === 'PARTIALFAILSSL' || s === 'ROUTEMONITORFAIL' || s === 'MONITORFAIL') {
                    return {code: 2, text: 'Down'};
                }
            
                if (s === '9' || s === 'DISABLED') {
                    return {code: 3, text: 'Inactive'};
                }
            
                return {code: 4, text: 'Unknown'};
            }
            
            function normalizeBaseUrl(url) {
                return trim(url).replace(/\/+$/, '');
            }
            
            var ADC = {
                api_url: '',
                username: trim(params.username),
                password: trim(params.password),
                proxy: trim(params.proxy),
                request: function (path, optional) {
                    var request = new HttpRequest(),
                        response,
                        json,
                        status,
                        err;
            
                    if (ADC.proxy !== '') {
                        request.setProxy(ADC.proxy);
                    }
            
                    request.addHeader('Accept: application/json');
                    request.addHeader('Content-Type: application/json');
                    request.addHeader('X-NITRO-USER: ' + ADC.username);
                    request.addHeader('X-NITRO-PASS: ' + ADC.password);
            
                    response = request.get(ADC.api_url + path);
                    status = request.getStatus();
            
                    if (status !== 200 && status !== 201 && status !== 209) {
                        err = 'HTTP ' + status + ' for ' + path + ': ' + response;
                        if (optional === true) {
                            return {};
                        }
                        throw err;
                    }
            
                    try {
                        json = JSON.parse(response);
                    }
                    catch (e) {
                        if (optional === true) {
                            return {};
                        }
                        throw 'Failed to parse JSON for ' + path + '.';
                    }
            
                    if (typeof json.errorcode !== 'undefined' && json.errorcode !== 0) {
                        err = 'NITRO error ' + json.errorcode + ' for ' + path + ': ' + str(json.message);
                        if (optional === true) {
                            return {};
                        }
                        throw err;
                    }
            
                    return json;
                }
            };
            
            function sortByName(a, b) {
                return str(a.name || a.id).localeCompare(str(b.name || b.id));
            }
            
            try {
                var apiUrl = trim(params.api_url),
                    scheme = trim(params.scheme) || 'https',
                    host = trim(params.host),
                    port = trim(params.port) || '443',
                    systemStats,
                    nsStats,
                    haStats,
                    lbvserverStats,
                    servicegroupStats,
                    memberBindings,
                    lbvserverSgBindings,
                    systemObj,
                    nsObj,
                    haObj,
                    lbvservers,
                    servicegroups,
                    members,
                    vipToSg = {},
                    sgToVip = {},
                    sgMemberCounts = {},
                    sgMemberLists = {},
                    i,
                    item,
                    name,
                    sgName,
                    vipName,
                    memberId,
                    state,
                    result,
                    appliance,
                    vserversOut = [],
                    servicegroupsOut = [],
                    membersOut = [],
                    enabled,
                    haState,
                    vserverMemberSet,
                    backendMembers,
                    list;
            
                if (apiUrl === '') {
                    if (host === '') {
                        throw 'API URL is empty and host interface is not defined.';
                    }
                    apiUrl = scheme + '://' + host + ':' + port;
                }
            
                ADC.api_url = normalizeBaseUrl(apiUrl);
            
                if (ADC.username === '' || ADC.password === '') {
                    throw 'API username or password macro is empty.';
                }
            
                systemStats = ADC.request('/nitro/v1/stat/system', false);
                nsStats = ADC.request('/nitro/v1/stat/ns', false);
                haStats = ADC.request('/nitro/v1/stat/hanode', true);
                lbvserverStats = ADC.request('/nitro/v1/stat/lbvserver', true);
                servicegroupStats = ADC.request('/nitro/v1/stat/servicegroup', true);
                memberBindings = ADC.request('/nitro/v1/config/servicegroup_servicegroupmember_binding?bulkbindings=yes', true);
                lbvserverSgBindings = ADC.request('/nitro/v1/config/lbvserver_servicegroup_binding?bulkbindings=yes', true);
            
                systemObj = getFirst(systemStats, 'system');
                nsObj = getFirst(nsStats, 'ns');
                haObj = getFirst(haStats, 'hanode');
                lbvservers = getArray(lbvserverStats, 'lbvserver');
                servicegroups = getArray(servicegroupStats, 'servicegroup');
                members = getArray(memberBindings, 'servicegroup_servicegroupmember_binding');
            
                list = getArray(lbvserverSgBindings, 'lbvserver_servicegroup_binding');
                for (i = 0; i < list.length; i++) {
                    item = object(list[i]);
                    vipName = trim(item.name);
                    sgName = trim(item.servicegroupname);
            
                    if (vipName === '' || sgName === '') {
                        continue;
                    }
            
                    if (typeof vipToSg[vipName] === 'undefined') {
                        vipToSg[vipName] = [];
                    }
                    if (typeof sgToVip[sgName] === 'undefined') {
                        sgToVip[sgName] = [];
                    }
            
                    vipToSg[vipName].push(sgName);
                    sgToVip[sgName].push(vipName);
                }
            
                for (i = 0; i < members.length; i++) {
                    item = object(members[i]);
                    sgName = trim(item.servicegroupname);
            
                    if (sgName === '') {
                        continue;
                    }
            
                    state = mapMemberState(item.state, item.svrstate);
            
                    if (typeof sgMemberCounts[sgName] === 'undefined') {
                        sgMemberCounts[sgName] = {total: 0, up: 0, down: 0, disabled: 0};
                    }
                    if (typeof sgMemberLists[sgName] === 'undefined') {
                        sgMemberLists[sgName] = [];
                    }
            
                    memberId = sgName + ':' + (trim(item.servername) !== '' ? trim(item.servername) : trim(item.ip)) + ':' + trim(item.port);
            
                    sgMemberCounts[sgName].total += 1;
                    if (state.code === 1) {
                        sgMemberCounts[sgName].up += 1;
                    }
                    else if (state.code === 2) {
                        sgMemberCounts[sgName].down += 1;
                    }
                    else if (state.code === 3) {
                        sgMemberCounts[sgName].disabled += 1;
                    }
            
                    sgMemberLists[sgName].push(memberId);
            
                    membersOut.push({
                        id: memberId,
                        servicegroup: sgName,
                        ip: trim(item.ip),
                        servername: trim(item.servername),
                        port: toNum(item.port, 0),
                        state_code: state.code,
                        state_text: state.text,
                        state_raw: trim(item.state),
                        svrstate_raw: trim(item.svrstate),
                        vservers: uniqueSorted(array(sgToVip[sgName] || [])).join(', ')
                    });
                }
            
                enabled = (upper(haObj.hacurstatus) === '1' || upper(haObj.hacurstatus) === 'YES' ||
                           upper(haObj.hacurstatus) === 'ACTIVE' || upper(haObj.hacurstatus) === 'ENABLED') ? 1 : 0;
                haState = mapHaState(enabled, haObj.hacurstate);
            
                appliance = {
                    cpu_util: toNum(systemObj.cpuusagepcnt || systemObj.rescpuusagepcnt || nsObj.rescpuusage, 0),
                    cpu_packet_util: toNum(systemObj.pktcpuusagepcnt || nsObj.pktcpuusagepcnt, 0),
                    cpu_mgmt_util: toNum(systemObj.mgmtcpuusagepcnt || nsObj.mgmtcpuusagepcnt, 0),
                    memory_util: toNum(systemObj.memusagepcnt, 0),
                    memory_used_b: Math.round(toNum(systemObj.memuseinmb, 0) * 1048576),
                    memory_total_b: Math.round(toNum(systemObj.memsizemb, 0) * 1048576),
                    disk0_util: toNum(systemObj.disk0perusage, 0),
                    disk1_util: toNum(systemObj.disk1perusage, 0),
                    uptime: toNum(systemObj.timesincestart, 0),
                    cpus: toNum(systemObj.numcpus, 0),
                    ha_enabled: enabled,
                    ha_state_code: haState.code,
                    ha_state_text: haState.text,
                    ha_state_raw: trim(haObj.hacurstate),
                    rx_bps: Math.round(toNum(nsObj.rxmbitsrate, 0) * 1000000),
                    tx_bps: Math.round(toNum(nsObj.txmbitsrate, 0) * 1000000),
                    client_conn: toNum(nsObj.tcpcurclientconn, 0),
                    server_conn: toNum(nsObj.tcpcurserverconn, 0),
                    http_req_rate: toNum(nsObj.httprequestsrate, 0),
                    http_req_in_bps: Math.round(toNum(nsObj.httprxrequestbytesrate, 0) * 8),
                    http_resp_out_bps: Math.round(toNum(nsObj.httprxresponsebytesrate, 0) * 8),
                    ssl_tx_rate: toNum(nsObj.ssltransactionsrate, 0)
                };
            
                for (i = 0; i < lbvservers.length; i++) {
                    item = object(lbvservers[i]);
                    name = trim(item.name);
                    state = mapVipState(item.state);
                    vserverMemberSet = {};
                    backendMembers = {total: 0, up: 0, down: 0, disabled: 0};
            
                    list = uniqueSorted(array(vipToSg[name] || []));
                    for (var j = 0; j < list.length; j++) {
                        sgName = list[j];
                        backendMembers.total += toNum(object(sgMemberCounts[sgName]).total, 0);
                        backendMembers.up += toNum(object(sgMemberCounts[sgName]).up, 0);
                        backendMembers.down += toNum(object(sgMemberCounts[sgName]).down, 0);
                        backendMembers.disabled += toNum(object(sgMemberCounts[sgName]).disabled, 0);
            
                        if (typeof sgMemberLists[sgName] !== 'undefined') {
                            for (var k = 0; k < sgMemberLists[sgName].length; k++) {
                                vserverMemberSet[sgMemberLists[sgName][k]] = 1;
                            }
                        }
                    }
            
                    vserversOut.push({
                        name: name,
                        ip: trim(item.primaryipaddress),
                        port: toNum(item.primaryport, 0),
                        type: trim(item.type),
                        state_code: state.code,
                        state_text: state.text,
                        state_raw: trim(item.state),
                        health: toNum(item.vslbhealth, 0),
                        active_services: toNum(item.actsvcs, 0),
                        inactive_services: toNum(item.inactsvcs, 0),
                        request_rate: toNum(item.requestsrate, 0),
                        response_rate: toNum(item.responsesrate, 0),
                        request_bps: Math.round(toNum(item.requestbytesrate, 0) * 8),
                        response_bps: Math.round(toNum(item.responsebytesrate, 0) * 8),
                        client_conn: toNum(item.curclntconnections, 0),
                        server_conn: toNum(item.cursrvrconnections, 0),
                        established_conn: toNum(item.establishedconn, 0),
                        servicegroups: list.join(', '),
                        backend_members_total: backendMembers.total,
                        backend_members_up: backendMembers.up,
                        backend_members_down: backendMembers.down,
                        backend_members_disabled: backendMembers.disabled
                    });
                }
            
                for (i = 0; i < servicegroups.length; i++) {
                    item = object(servicegroups[i]);
                    name = trim(item.servicegroupname);
                    result = object(sgMemberCounts[name]);
                    state = mapPoolState(item.state, {
                        total: toNum(result.total, 0),
                        up: toNum(result.up, 0),
                        down: toNum(result.down, 0),
                        disabled: toNum(result.disabled, 0)
                    });
            
                    servicegroupsOut.push({
                        name: name,
                        type: trim(item.servicetype),
                        state_code: state.code,
                        state_text: state.text,
                        state_raw: trim(item.state),
                        vservers: uniqueSorted(array(sgToVip[name] || [])).join(', '),
                        members_total: toNum(result.total, 0),
                        members_up: toNum(result.up, 0),
                        members_down: toNum(result.down, 0),
                        members_disabled: toNum(result.disabled, 0)
                    });
                }
            
                vserversOut.sort(sortByName);
                servicegroupsOut.sort(sortByName);
                membersOut.sort(sortByName);
            
                return JSON.stringify({
                    error: '',
                    meta: {
                        api_url: ADC.api_url
                    },
                    appliance: appliance,
                    vservers: vserversOut,
                    servicegroups: servicegroupsOut,
                    members: membersOut
                });
            }
            catch (e) {
                return JSON.stringify({
                    error: str(e)
                });
            }
          description: |
            Collects appliance, VIP, pool and member data from the Citrix ADC NITRO API.
            
            Design notes:
            - one master item returns a single JSON document
            - dependent items and LLD consume that JSON
            - API/auth/network failures become one error signal instead of hundreds of unsupported items
          timeout: '{$CITRIX.ADC.DATA.TIMEOUT}'
          parameters:
            - name: api_url
              value: '{$CITRIX.ADC.API.URL}'
            - name: host
              value: '{HOST.CONN}'
            - name: password
              value: '{$CITRIX.ADC.API.PASSWORD}'
            - name: port
              value: '{$CITRIX.ADC.API.PORT}'
            - name: proxy
              value: '{$CITRIX.ADC.HTTP.PROXY}'
            - name: scheme
              value: '{$CITRIX.ADC.API.SCHEME}'
            - name: username
              value: '{$CITRIX.ADC.API.USER}'
          tags:
            - tag: component
              value: api
            - tag: component
              value: raw
          triggers:
            - uuid: 5699d60845444beda1a1d605a5ee44b9
              expression: 'nodata(/Citrix ADC by NITRO API/citrix.adc.get,{$CITRIX.ADC.NODATA})=1'
              name: 'Citrix ADC: No API data collected'
              event_name: 'Citrix ADC: No API data collected for {$CITRIX.ADC.NODATA}'
              priority: HIGH
              description: 'The master NITRO collection item has not produced data.'
              tags:
                - tag: scope
                  value: availability
        - uuid: 444b2959f5334e3a81499037d0f7f1c8
          name: 'Citrix ADC: API collection error'
          type: DEPENDENT
          key: citrix.adc.get.error
          delay: '0'
          history: 7d
          value_type: TEXT
          trends: '0'
          description: 'Error returned by the NITRO master item.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.error
              error_handler: CUSTOM_VALUE
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: citrix.adc.get
          tags:
            - tag: component
              value: error
          triggers:
            - uuid: 2b25413e8932468987662a57f6b25ec7
              expression: 'length(last(/Citrix ADC by NITRO API/citrix.adc.get.error))>0'
              name: 'Citrix ADC: API collection has errors'
              priority: HIGH
              description: 'The master NITRO item returned an error.'
              tags:
                - tag: scope
                  value: availability
        - uuid: 42d98028e6d945fe985e310d95eb00ea
          name: 'HA enabled'
          type: DEPENDENT
          key: citrix.adc.ha.enabled
          delay: '0'
          history: 7d
          trends: '0'
          valuemap:
            name: 'Boolean yes/no'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.ha_enabled
              error_handler: DISCARD_VALUE
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: citrix.adc.appliance.raw
          tags:
            - tag: component
              value: ha
        - uuid: 5caa48104e2f463ba0ccb1246d43dbf8
          name: 'HA state'
          type: DEPENDENT
          key: citrix.adc.ha.state
          delay: '0'
          history: 7d
          trends: '0'
          valuemap:
            name: 'Citrix ADC HA state'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.ha_state_code
              error_handler: DISCARD_VALUE
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 5m
          master_item:
            key: citrix.adc.appliance.raw
          tags:
            - tag: component
              value: ha
        - uuid: 8ec992f5ecff44f5994e61579d5cb7be
          name: 'HTTP requests rate'
          type: DEPENDENT
          key: citrix.adc.http.requests.rate
          delay: '0'
          units: r/s
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.http_req_rate
              error_handler: DISCARD_VALUE
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 5m
          master_item:
            key: citrix.adc.appliance.raw
          tags:
            - tag: component
              value: http
        - uuid: 4a89608e893e4fa9997edb8d78f9619f
          name: 'Citrix ADC: Backend members raw data'
          type: DEPENDENT
          key: citrix.adc.members.raw
          delay: '0'
          history: '0'
          value_type: TEXT
          trends: '0'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.members
              error_handler: DISCARD_VALUE
          master_item:
            key: citrix.adc.get
          tags:
            - tag: component
              value: raw
        - uuid: b87acc1ad7eb4d5ead1d0e9896554216
          name: 'Current client connections'
          type: DEPENDENT
          key: citrix.adc.net.client.conn
          delay: '0'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.client_conn
              error_handler: DISCARD_VALUE
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 5m
          master_item:
            key: citrix.adc.appliance.raw
          tags:
            - tag: component
              value: connections
        - uuid: 3ee6918217f44c3f8c514e0fdbd50f9a
          name: 'Aggregate RX throughput'
          type: DEPENDENT
          key: citrix.adc.net.rx
          delay: '0'
          units: bps
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.rx_bps
              error_handler: DISCARD_VALUE
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 5m
          master_item:
            key: citrix.adc.appliance.raw
          tags:
            - tag: component
              value: network
        - uuid: 89f4fc7f6796401c9c0f05880992ea79
          name: 'Current server connections'
