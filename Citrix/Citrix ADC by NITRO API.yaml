        - macro: '{$CITRIX.ADC.MEMBER.ALERT.GROUP}'
          value: '0'
          description: 'Per-member down trigger enable flag by service-group context. Default: disabled to avoid noise.'
        - macro: '{$CITRIX.ADC.MEMBER.DOWN.WINDOW}'
          value: 3m
          description: 'Backend member must remain Down for this long before opening an alert.'
        - macro: '{$CITRIX.ADC.MEMBER.SERVICEGROUP.MATCHES}'
          value: '.*'
          description: 'Discover backend members only for service groups that match this regex.'
        - macro: '{$CITRIX.ADC.MEMBER.SERVICEGROUP.NOT_MATCHES}'
          value: '(?i)(^test|^dev|^demo|maintenance|drain|tmp)'
          description: 'Do not discover backend members for service groups that match this regex.'
        - macro: '{$CITRIX.ADC.NODATA}'
          value: 10m
          description: 'Maximum period without master NITRO data before opening an availability problem.'
        - macro: '{$CITRIX.ADC.SERVICEGROUP.ALERT}'
          value: '1'
          description: 'Service-group down trigger enable flag. Use with pool name as context. Default: enabled.'
        - macro: '{$CITRIX.ADC.SERVICEGROUP.DOWN.WINDOW}'
          value: 3m
          description: 'Service group must remain Down for this long before opening an alert.'
        - macro: '{$CITRIX.ADC.SERVICEGROUP.NAME.MATCHES}'
          value: '.*'
          description: 'Discover only service-group names that match this regex.'
        - macro: '{$CITRIX.ADC.SERVICEGROUP.NAME.NOT_MATCHES}'
          value: '(?i)(^test|^dev|^demo|maintenance|drain|tmp)'
          description: 'Do not discover service-group names that match this regex.'
        - macro: '{$CITRIX.ADC.SYSTEM.CPU.CRIT}'
          value: '90'
          description: 'Critical threshold for sustained system CPU utilization.'
        - macro: '{$CITRIX.ADC.SYSTEM.CPU.WARN}'
          value: '80'
          description: 'Warning threshold for sustained system CPU utilization.'
        - macro: '{$CITRIX.ADC.SYSTEM.MEM.CRIT}'
          value: '90'
          description: 'Critical threshold for sustained system memory utilization.'
        - macro: '{$CITRIX.ADC.SYSTEM.MEM.WARN}'
          value: '80'
          description: 'Warning threshold for sustained system memory utilization.'
        - macro: '{$CITRIX.ADC.VSERVER.ALERT}'
          value: '1'
          description: 'VIP down trigger enable flag. Use with VIP name as context. Default: enabled.'
        - macro: '{$CITRIX.ADC.VSERVER.DEGRADED.ALERT}'
          value: '0'
          description: 'VIP degraded-health trigger enable flag. Use with VIP name as context. Default: disabled.'
        - macro: '{$CITRIX.ADC.VSERVER.DOWN.WINDOW}'
          value: 3m
          description: 'VIP must remain Down for this long before opening an alert.'
        - macro: '{$CITRIX.ADC.VSERVER.HEALTH.MIN}'
          value: '50'
          description: 'Minimum VIP health percentage before the optional degraded-health trigger opens. Use with VIP name as context.'
        - macro: '{$CITRIX.ADC.VSERVER.HEALTH.WINDOW}'
          value: 5m
          description: 'Evaluation window for the optional VIP degraded-health trigger.'
        - macro: '{$CITRIX.ADC.VSERVER.NAME.MATCHES}'
          value: '.*'
          description: 'Discover only VIP names that match this regex.'
        - macro: '{$CITRIX.ADC.VSERVER.NAME.NOT_MATCHES}'
          value: '(?i)(^test|^dev|^demo|maintenance|drain|tmp)'
          description: 'Do not discover VIP names that match this regex.'
